.enc-hero-pick:hover{border-color:var(--border-m);background:rgba(255,255,255,.04);}
.enc-hero-pick.selected{border-color:rgba(240,171,252,.4);background:rgba(240,171,252,.06);}
.enc-hero-pick .enc-pick-icon{font-size:28px;display:block;margin-bottom:6px;}
.enc-hero-pick .enc-pick-name{font-size:12px;color:var(--text);font-weight:500;}
.enc-vs{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text3);text-align:center;letter-spacing:.1em;}
.enc-result{padding:20px;border-radius:14px;border:1px solid rgba(240,171,252,.2);background:rgba(240,171,252,.03);margin-top:16px;position:relative;overflow:hidden;}
.enc-result::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,171,252,.5),transparent);}
.enc-type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:5px;margin-bottom:10px;}
.enc-narrative{font-size:13px;color:var(--text2);line-height:1.75;white-space:pre-line;}
.enc-outcome{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;}
.enc-outcome.positive{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.15);color:#4ade80;}
.enc-outcome.negative{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);color:#f87171;}
.enc-outcome.neutral{background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.15);color:#94a3b8;}
.enc-outcome.shift{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);color:#fbbf24;}
.enc-history{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.enc-hist-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);padding:4px 0;}
.enc-pair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}

/* STORY ARCS */
.arc-card{padding:16px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.015);margin-bottom:10px;position:relative;overflow:hidden;}
.arc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--arc-color,#888);}
.arc-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.arc-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.08em;color:var(--arc-color);}
.arc-status{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
.arc-status.active{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);}
.arc-status.completed{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2);}
.arc-heroes{font-size:11px;color:var(--text3);margin-bottom:10px;}
.arc-progress{display:flex;gap:4px;margin-bottom:12px;}
.arc-beat-dot{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.06);}
.arc-beat-dot.reached{background:var(--arc-color);}
.arc-beat-dot.current{background:var(--arc-color);animation:arcPulse 1.5s ease-in-out infinite;}
@keyframes arcPulse{0%,100%{opacity:.6}50%{opacity:1}}
.arc-beats{display:flex;flex-direction:column;gap:8px;}
.arc-beat{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.01);}
.arc-beat.current-beat{border-color:rgba(var(--arc-rgb,150,150,150),.3);background:rgba(var(--arc-rgb,150,150,150),.04);}
.arc-beat.locked{opacity:.4;filter:blur(1px);}
.arc-beat-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;}
.arc-beat-text{font-size:12px;color:var(--text2);line-height:1.65;white-space:pre-line;}

@media(max-width:700px){
  .page-wrap{padding-bottom:160px;}
  .header-stats{display:none;}.hud{padding:0 14px;gap:10px;flex-wrap:wrap;height:auto;min-height:var(--hud);padding-top:8px;padding-bottom:8px;}
  .hud-label,.hud-sep{display:none;}
  .mode-group{order:10;width:100%;}
  .hud-tools{order:11;width:100%;justify-content:center;gap:6px;}
  .hud-tools button{margin-top:0;}
  .info-modal{max-height:95vh;}.info-header{padding:18px 20px 16px;}
  .info-body{padding:16px 20px 20px;}.info-footer{padding:0 20px 20px;}
  .converge-text{font-size:44px;}
  .we-title{font-size:36px;}.we-icon{font-size:48px;}
  .title-logo{font-size:48px;letter-spacing:.14em;}
  .codex-modal{max-height:95vh;}
  .codex-header{padding:16px 16px 12px;}
  .codex-body{padding:8px 8px 12px;}
  .codex-footer{padding:10px 16px;}
}

<script>
// ── TAG SYSTEM ──────────────────────────────────────────────────────────────
const TAG_DEFS = {
  heat:         {type:'Element', intensity:1, polarity:'negative', stat:'pow', opposes:'cold',     resonates:['destruction','energy','volatile'],   desc:'The raw thermal signature of combustion — volatile, expanding, and hungry to consume. Amplifies destructive output and raw power.'},
  cold:         {type:'Element', intensity:1, polarity:'negative', stat:'dur', opposes:'heat',     resonates:['stillness','density','crystalline'], desc:'Arrested entropy — the stillness that descends when thermal energy is forcibly withdrawn. Slows systems and increases resistance to change.'},
  charge:       {type:'Element', intensity:2, polarity:'positive', stat:'rng', resonates:['signal','neural','current'],                            desc:'Ordered electrical potential seeking equilibrium at any cost. Extends the reach of power dramatically when combined with signal-based tags.'},
  void:         {type:'Element', intensity:2, polarity:'negative', stat:'ctl', opposes:'life',        resonates:['absence','intangibility','liminal'],                    desc:'The structural principle of absence — not empty space, but the active negation of presence. Grants surgical control over what does and does not exist.'},
  life:         {type:'Element', intensity:2, polarity:'positive', stat:'dur', opposes:'entropy',  resonates:['restoration','biological','growth'], desc:'The self-organizing drive that resists entropy and converts energy into complexity. Massively boosts durability and regenerative capacity.'},
  current:      {type:'Element', intensity:1, polarity:'neutral',  stat:'pow', resonates:['charge','signal','frequency'],                          desc:'Electrical flow in directed motion — the difference between raw charge and usable power. Converts potential into kinetic output.'},
  destruction:  {type:'Concept', intensity:1, polarity:'negative', stat:'pow', opposes:'preservation',resonates:['heat','volatile','entropy'],                            desc:'The tendency of complex structures to collapse into simpler, lower-energy states. Directly amplifies raw destructive output.'},
  energy:       {type:'Concept', intensity:1, polarity:'neutral',  stat:'pow', resonates:['heat','charge','kinetic'],                              desc:'The universal currency underlying all physical phenomena — the capacity to do work. Connects with almost any other active tag.'},
  preservation: {type:'Concept', intensity:1, polarity:'positive', stat:'dur', opposes:'destruction', resonates:['cold','stillness','density'],                           desc:'The maintenance of a system\'s current state against forces that would alter it. Pairs strongly with cold and stillness to lock things in place.'},
  restoration:  {type:'Concept', intensity:2, polarity:'positive', stat:'dur', resonates:['life','biological','growth'],                           desc:'The return of a damaged system to a prior, functional configuration. High synergy with biological and life tags for healing amplification.'},
  connection:   {type:'Concept', intensity:1, polarity:'positive', stat:'vrs', resonates:['mind','signal','neural'],                               desc:'The informational bridge between two systems. Broadens the range of what a power can affect and who it can reach.'},
  causality:    {type:'Concept', intensity:3, polarity:'neutral',  stat:'vrs', resonates:['temporal','past','future','entropy'],                   desc:'The chain linking every event to its cause and every cause to its consequence. One of the highest-intensity tags — affects every downstream fusion it touches.'},
  entropy:      {type:'Concept', intensity:2, polarity:'negative', stat:'pow', opposes:'life',     resonates:['temporal','destruction','heat'],    desc:'The universe\'s tendency toward disorder — the arrow of time made physical. Opposes life; when they collide, something unprecedented emerges.'},
  signal:       {type:'Concept', intensity:1, polarity:'positive', stat:'rng', resonates:['charge','neural','connection','frequency'],             desc:'Encoded information riding a carrier wave — meaning separated from its source. Extends range and enables cross-system influence.'},
  frequency:    {type:'Concept', intensity:1, polarity:'neutral',  stat:'rng', resonates:['charge','signal','neural'],                             desc:'The oscillation rate of a wave — the fingerprint distinguishing one energy from another. Allows fine-tuning of how power propagates.'},
  neural:       {type:'Concept', intensity:2, polarity:'positive', stat:'ctl', resonates:['signal','mind','charge','connection'],                  desc:'The bioelectrical language of nervous systems — thought made physical. Dramatically boosts control when combined with mind or signal tags.'},
  biological:   {type:'Concept', intensity:1, polarity:'positive', stat:'dur', resonates:['life','restoration','growth'],                          desc:'The logic of living systems: self-replication, adaptation, and metabolic exchange. Foundation of all healing and regenerative chains.'},
  growth:       {type:'Concept', intensity:1, polarity:'positive', stat:'dur', opposes:'entropy',     resonates:['life','biological','restoration'],                      desc:'The accumulation of mass, complexity, or capability over time. Scales with the number of fusion generations — older chains grow more.'},
  memory:       {type:'Concept', intensity:2, polarity:'neutral',  stat:'vrs', resonates:['mind','ancient','past','perception'],                   desc:'Information encoded in structure — the past made present through physical imprint. Stone, tissue, and minds all carry memory differently.'},
  perception:   {type:'Concept', intensity:2, polarity:'neutral',  stat:'vrs', resonates:['mind','memory','causality'],                            desc:'The processing of external signals into internal models of reality. Boosts versatility by expanding the range of what a power can sense and respond to.'},
  mind:         {type:'Concept', intensity:2, polarity:'positive', stat:'ctl', resonates:['memory','perception','connection','neural'],             desc:'The emergent phenomenon of consciousness — the observer behind all experience. The anchor tag for all mental and psychic power chains.'},
  stillness:    {type:'State',   intensity:1, polarity:'neutral',  stat:'ctl', opposes:'velocity',    resonates:['cold','crystalline','preservation'],                    desc:'The absence of motion — not emptiness, but a state of perfect, held potential. Increases precision and reduces collateral effects.'},
  liminal:      {type:'State',   intensity:2, polarity:'neutral',  stat:'vrs', resonates:['void','absence','intangibility'],                       desc:'The threshold condition between two states — belonging fully to neither. Powers carrying this tag can exist in contradictory states simultaneously.'},
  intangibility:{type:'State',   intensity:2, polarity:'neutral',  stat:'ctl', resonates:['void','stealth','absence'],                             desc:'The property of existing without physical interaction — presence without substance. Makes a power extremely difficult to counter directly.'},
  absence:      {type:'State',   intensity:1, polarity:'negative', stat:'ctl', resonates:['void','intangibility','stealth'],                       desc:'Not merely nothing — the active space left by something that was, or could be. Enables powers to act through gaps in reality.'},
  stealth:      {type:'State',   intensity:1, polarity:'negative', stat:'ctl', resonates:['absence','void','hidden'],                              desc:'The strategic reduction of observable signature — invisibility as an active art. Reduces the detectability of a power\'s operation.'},
  volatile:     {type:'State',   intensity:1, polarity:'negative', stat:'pow', resonates:['heat','destruction','energy'],                          desc:'A state of held tension on the verge of rapid, uncontrolled release. High burst output, but difficult to chain with precision-based tags.'},
  crystalline:  {type:'State',   intensity:1, polarity:'positive', stat:'ctl', resonates:['cold','stillness','density'],                           desc:'Ordered molecular structure — the universe\'s tendency toward geometric perfection under pressure. Increases structural integrity of effects.'},
  hidden:       {type:'State',   intensity:1, polarity:'neutral',  stat:'ctl', resonates:['stealth','void','absence'],                             desc:'Information or presence that exists but resists detection by conventional means. Pairs with mental tags to conceal the nature of a power entirely.'},
  past:         {type:'State',   intensity:1, polarity:'positive', stat:'vrs', opposes:'future',      resonates:['temporal','memory','causality'],                        desc:'The fixed record of events that preceded the present — immutable, but readable. Opens access to historical information and prior states.'},
  future:       {type:'State',   intensity:1, polarity:'positive', stat:'vrs', opposes:'past',        resonates:['temporal','causality','entropy'],                       desc:'The probabilistic field of possible events that have not yet collapsed into the present. Allows limited anticipation of outcomes.'},
  reflex:       {type:'State',   intensity:1, polarity:'positive', stat:'ctl', resonates:['velocity','neural','kinetic'],                          desc:'Response that bypasses conscious processing — the body acting before the mind decides. Reduces the reaction time cost of using a power.'},
  mass:         {type:'Scale',   intensity:2, polarity:'neutral',  stat:'pow', resonates:['force','compression','orbit','attraction'],             desc:'The quantity of matter in a system — source of gravitational attraction and inertial resistance. The foundation of all cosmic-scale power chains.'},
  force:        {type:'Scale',   intensity:2, polarity:'negative', stat:'pow', resonates:['mass','compression','kinetic'],                         desc:'A directed push or pull applied to mass — the mechanism of all physical change. Combines with mass to produce devastating kinetic outcomes.'},
  orbit:        {type:'Scale',   intensity:3, polarity:'neutral',  stat:'rng', resonates:['mass','attraction','relativistic'],                     desc:'A stable curved path maintained by the balance of velocity and gravitational pull. One of the longest-range tags in the system — affects targets at astronomical distances.'},
  compression:  {type:'Scale',   intensity:2, polarity:'negative', stat:'pow', resonates:['mass','force','density'],                               desc:'The reduction of volume under applied force — matter concentrated into smaller space. At extreme values triggers density collapse and nuclear-level events.'},
  attraction:   {type:'Scale',   intensity:1, polarity:'positive', stat:'rng', resonates:['orbit','mass','connection'],                            desc:'The tendency of masses, charges, or minds to draw toward one another. Expands the effective reach of any power that pulls or gathers.'},
  velocity:     {type:'Scale',   intensity:2, polarity:'neutral',  stat:'rng', opposes:'stillness',   resonates:['momentum','kinetic','relativistic'],                    desc:'Speed with direction — the full description of motion through space. At extreme values begins interfering with temporal tags due to relativistic effects.'},
  momentum:     {type:'Scale',   intensity:1, polarity:'neutral',  stat:'pow', resonates:['velocity','kinetic','force'],                           desc:'The product of mass and velocity — a quantity that resists change and transfers fully on impact. Makes powers harder to stop mid-effect.'},
  kinetic:      {type:'Scale',   intensity:1, polarity:'neutral',  stat:'pow', resonates:['velocity','momentum','force'],                          desc:'Energy held in the state of motion — the power of things in movement. Translates speed directly into destructive potential.'},
  relativistic: {type:'Scale',   intensity:3, polarity:'neutral',  stat:'rng', resonates:['velocity','temporal','causality'],                     desc:'Operating at scales where time dilation, length contraction, and mass increase become significant. Naturally bridges velocity and temporal tag chains.'},
  geological:   {type:'Scale',   intensity:2, polarity:'neutral',  stat:'dur', resonates:['ancient','solid','endurance','mass'],                   desc:'Operating at the scale of planetary processes — forces measured in millennia and continents. Makes a power\'s effects effectively permanent.'},
  density:      {type:'Scale',   intensity:1, polarity:'neutral',  stat:'pow', resonates:['cold','compression','mass','solid'],                    desc:'The concentration of mass within a given volume. Combined with compression, approaches material collapse. With cold, produces ultra-dense crystalline structures.'},
  primal:       {type:'Polarity',intensity:1, polarity:'neutral',  stat:'pow', resonates:['heat','destruction','volatile'],                        desc:'Existing before refinement — raw, foundational, and untouched by complex structure. Amplifies base-state tags by stripping away their complexity.'},
  ancient:      {type:'Polarity',intensity:2, polarity:'positive', stat:'dur', resonates:['geological','solid','memory','endurance'],               desc:'Carrying the accumulated weight of time — old enough that history becomes physical property. Boosts durability of any power chain it enters.'},
  solid:        {type:'Polarity',intensity:1, polarity:'positive', stat:'dur', resonates:['ancient','geological','density'],                       desc:'The state of matter with fixed form — resistant to deformation, stable under load. Provides structural stability to otherwise volatile combinations.'},
  endurance:    {type:'Polarity',intensity:2, polarity:'positive', stat:'dur', resonates:['ancient','resilience','biological','life'],              desc:'The capacity to sustain function under prolonged stress without structural failure. The strongest durability-boosting tag in non-legendary tiers.'},

  temporal:     {type:'Polarity',intensity:3, polarity:'neutral',  stat:'vrs', resonates:['causality','past','future','entropy','relativistic'],    desc:'Pertaining to the dimension of time — the axis along which causality flows. The highest-intensity non-legendary tag. Connects every time-adjacent chain.'},

  // ── NEW ELEMENTS ──────────────────────────────────────────────────────────
  luminance:    {type:'Element', intensity:2, polarity:'positive', stat:'rng', opposes:'void',        resonates:['signal','energy','frequency','perception'],          desc:'The essence of visible light as a fundamental force — not merely photons but the principle of illumination itself. In fusions, luminance reveals what is hidden and burns away what exists in darkness.'},
  radiation:    {type:'Element', intensity:2, polarity:'negative', stat:'pow', opposes:'biological',  resonates:['charge','frequency','energy','entropy'],             desc:'Electromagnetic emission at wavelengths that damage organic structure — ionizing radiation that disrupts molecular bonds in living tissue. In fusions, radiation introduces a corrosive energy that biological systems must overcome or be destroyed by.'},

  pressure:     {type:'Element', intensity:1, polarity:'neutral',  stat:'pow', resonates:['force','compression','density','mass'],                                    desc:'Mechanical force distributed across a surface or volume — the omnidirectional cousin of directional force. In fusions, pressure converts focused impacts into area effects and intensifies containment mechanics.'},
  magnetism:    {type:'Element', intensity:1, polarity:'neutral',  stat:'ctl', resonates:['charge','current','force','attraction'],                                   desc:'The attractive and repulsive force between charged particles and magnetic domains. In fusions, magnetism provides fine-grained directional control over metallic and conductive matter.'},

  // ── NEW CONCEPTS ──────────────────────────────────────────────────────────
  harmony:      {type:'Concept', intensity:2, polarity:'positive', stat:'ctl', opposes:'discord',     resonates:['connection','frequency','neural','mind'],            desc:'Synchronization between systems — resonant alignment of oscillation, thought, or purpose. In fusions, harmony stabilizes volatile interactions and produces coherent output from chaotic inputs.'},
  discord:      {type:'Concept', intensity:2, polarity:'negative', stat:'pow', opposes:'harmony',     resonates:['destruction','frequency','volatile','turbulent'],    desc:'Dissonance and disruption — the active breaking of synchronization between systems. In fusions, discord destabilizes controlled processes and converts precision into raw destructive interference.'},
  isolation:    {type:'Concept', intensity:2, polarity:'negative', stat:'ctl', opposes:'connection',  resonates:['void','absence','stealth','hidden'],                 desc:'Severance from all external systems — total informational and relational disconnection. In fusions, isolation severs links, blocks communication, and creates pockets of absolute separation.'},
  corruption:   {type:'Concept', intensity:2, polarity:'negative', stat:'pow', opposes:'restoration', resonates:['entropy','destruction','biological','growth'],       desc:'The progressive degradation of structure into dysfunction — not destruction but perversion of form. In fusions, corruption warps healing into harm and turns growth against itself.'},
  synthesis:    {type:'Concept', intensity:2, polarity:'positive', stat:'vrs', opposes:'destruction', resonates:['biological','growth','connection','adaptation'],     desc:'The creation of novel structures by combining existing components into emergent wholes. In fusions, synthesis builds where destruction tears down, producing new forms from the collision of parent principles.'},
  ordered:      {type:'Concept', intensity:2, polarity:'positive', stat:'ctl', opposes:'chaotic',     resonates:['mind','causality','crystalline','perception'],       desc:'Perfect structural regularity — every element in its predicted position, every outcome following from its premises. In fusions, ordered tags impose discipline on chaotic systems and maximize precision at the cost of adaptability.'},
  chaotic:      {type:'Concept', intensity:2, polarity:'negative', stat:'vrs', opposes:'ordered',     resonates:['volatile','turbulent','entropy','discord'],          desc:'True unpredictability — sensitivity to initial conditions so extreme that deterministic prediction becomes impossible. In fusions, chaotic tags break patterns, defeat prediction, and generate outcomes that surprise even the user.'},
  instinct:     {type:'Concept', intensity:1, polarity:'positive', stat:'ctl', resonates:['biological','reflex','perception','primal'],                               desc:'Unconscious biological intelligence — the body knowing what the mind has not yet computed. In fusions, instinct accelerates response time and produces optimal reactions without conscious processing.'},

  {id:'speed',   name:'Super Speed',    icon:'◈', powerClass:'Physical',color:'#34d399',rgb:'52,211,153',  gen:0,tags:['velocity','momentum','kinetic','relativistic','reflex'],  stats:{pow:8,rng:5,ctl:6,dur:8,vrs:7}, desc:'Move and process information at superhuman velocity. At peak output the user approaches relativistic thresholds, generating kinetic force that can shatter reinforced structures with a glancing impact.'},
  {id:'gravity', name:'Gravity Control',icon:'⊕', powerClass:'Cosmic',  color:'#94a3b8',rgb:'148,163,184', gen:0,tags:['mass','force','orbit','compression','attraction','celestial'],         stats:{pow:10,rng:10,ctl:7,dur:8,vrs:10},desc:'Bend gravitational fields at will — from personal-scale levitation to planetary-level tidal forces. Gravity Control is one of the most universally powerful abilities, touching every physical object in existence.'},
  {id:'shadow',  name:'Shadow Form',    icon:'◑', powerClass:'Void',    color:'#818cf8',rgb:'129,140,248', gen:0,tags:['void','intangibility','liminal','absence','stealth','isolation'],      stats:{pow:5,rng:7,ctl:9,dur:9,vrs:8}, desc:'Merge with darkness and become intangible, invisible, and capable of traversing shadows as spatial shortcuts. Shadow Form exists in a liminal state between presence and absence.'},
  {id:'heal',    name:'Healing Factor', icon:'✦', powerClass:'Physical',color:'#4ade80',rgb:'74,222,128',  gen:0,tags:['life','restoration','biological','resilience','growth'],  stats:{pow:3,rng:2,ctl:9,dur:10,vrs:6},desc:'Regenerate tissue, bone, and neural pathways at accelerated rates. At peak performance the healing factor repairs near-fatal injuries within seconds, essentially making the user immune to permanent damage.'},
  {id:'earth',   name:'Earth Mastery',  icon:'◆', powerClass:'Elemental',color:'#d4a96a',rgb:'212,169,106',gen:0,tags:['geological','ancient','solid','memory','endurance','primordial'],       stats:{pow:9,rng:8,ctl:7,dur:9,vrs:8}, desc:'Command stone, soil, metal ore, and geological forces. Earth Mastery extends from lifting individual stones to reshaping continental shelves, channeling the ancient and inexhaustible power of the planet itself.'},
  {id:'time',    name:'Time Perception',icon:'◎', powerClass:'Cosmic',  color:'#f472b6',rgb:'244,114,182', gen:0,tags:['temporal','causality','past','future','entropy'],          stats:{pow:7,rng:10,ctl:8,dur:5,vrs:9}, desc:'Sense, navigate, and subtly alter the flow of temporal events. Time Perception grants awareness of causality chains — the ability to see how present actions ripple into futures and trace backwards through pasts.'},
  {id:'sono',     name:'Sonokinesis',            icon:'🔊',powerClass:'Elemental',color:'#fb923c',rgb:'251,146,60',  gen:0,tags:['frequency','velocity','destruction','signal','momentum','discord'],  stats:{pow:7,rng:8,ctl:6,dur:5,vrs:8}, desc:'Command sound waves across the full frequency spectrum — from targeted resonance pulses that shatter molecular bonds to omnidirectional infrasonic blasts that liquefy internal organs through solid armor. At low intensity, Sonokinesis reads structural weaknesses like sheet music and plays the note that breaks them.'},
  {id:'photo',    name:'Photokinesis',            icon:'💡',powerClass:'Elemental',color:'#fde047',rgb:'253,224,71',  gen:0,tags:['signal','frequency','velocity','energy','hidden','luminance'],          stats:{pow:7,rng:10,ctl:7,dur:5,vrs:9}, desc:'Generate, bend, and weaponize photons across the entire electromagnetic spectrum. Photokinesis warps visible light to create total invisibility or blinding strobes, focuses coherent beams into cutting lasers, and reads wavelengths human eyes never evolved to see — from radio emissions to gamma radiation.'},
  {id:'bio',      name:'Biomimicry',              icon:'🧬',powerClass:'Physical', color:'#86efac',rgb:'134,239,172', gen:0,tags:['biological','resilience','perception','growth','hidden','synthesis'],   stats:{pow:5,rng:3,ctl:8,dur:8,vrs:10},desc:'Observe any living organism and replicate its biological traits at the cellular level — mantis shrimp visual spectra, bombardier beetle chemical synthesis, tardigrade cryptobiosis, spider silk tensile restructuring. The body adapts while maintaining human form, layering dozens of simultaneous adaptations into a living Swiss army knife.'},
  {id:'teleport', name:'Teleportation',            icon:'🌀',powerClass:'Cosmic',   color:'#a855f7',rgb:'168,85,247',  gen:0,tags:['liminal','velocity','relativistic','absence','orbit'],      stats:{pow:6,rng:10,ctl:8,dur:6,vrs:9}, desc:'Displace matter instantaneously from one point in space to another with zero traversal of intervening distance. Short-range teleportation is instinctive and combat-viable. Long-range jumps require destination mapping — a clear mental image or prior visit. Living tissue and inert matter displace with equal fidelity.'},
  {id:'astral',   name:'Astral Projection',        icon:'👁',powerClass:'Void',     color:'#7dd3fc',rgb:'125,211,252', gen:0,tags:['liminal','absence','perception','mind','hidden','phase-shifted'],           stats:{pow:3,rng:10,ctl:9,dur:5,vrs:8}, desc:'Separate the conscious mind from the physical body entirely, projecting it as an invisible and intangible presence that traverses space unhindered. The astral form perceives all sensory data, interacts with other conscious minds, and passes through solid matter. The body remains in a vulnerable trance — a tethered anchor the mind must return to.'},
  {id:'prob',     name:'Probability Manipulation', icon:'🎲',powerClass:'Cosmic',   color:'#e879f9',rgb:'232,121,249', gen:0,tags:['causality','future','perception','entropy','temporal'],     stats:{pow:6,rng:9,ctl:9,dur:5,vrs:10},desc:'Perceive the branching probability field of any situation as a visible landscape of collapsing futures, then apply quantum-level pressure to weight outcomes toward a desired collapse. Not fate — statistics. At high mastery the weighting approaches determinism, making the improbable inevitable and the certain suddenly uncertain.'},
  {id:'strength', name:'Super Strength',            icon:'💪',powerClass:'Physical', color:'#f87171',rgb:'248,113,113', gen:0,tags:['force','mass','momentum','endurance','density','awakened'],            stats:{pow:10,rng:2,ctl:5,dur:9,vrs:5}, desc:'Exert physical force orders of magnitude beyond human structural limits. The skeletal system, connective tissue, and musculature are proportionally reinforced — the body withstands what it generates. A casual strike fractures reinforced concrete. A committed one reshapes geography. Raw, immediate, and decisive.'},
  {id:'chloro',   name:'Chlorokinesis',            icon:'🌿',powerClass:'Elemental',color:'#22c55e',rgb:'34,197,94',   gen:0,tags:['life','growth','ancient','biological','connection'],        stats:{pow:7,rng:8,ctl:7,dur:8,vrs:8}, desc:'Command plant life at any scale — accelerate a seed to ancient oak in seconds, weaponize root networks into crushing tendrils, extract and synthesize any botanical compound on demand. Senses propagate through mycorrhizal networks like a biological internet, reading the chemical alarm signals plants have traded for four hundred million years.'},
  {id:'portal',   name:'Portal Creation',          icon:'🌐',powerClass:'Cosmic',   color:'#22d3ee',rgb:'34,211,238',  gen:0,tags:['liminal','orbit','relativistic','connection','void','threshold'],       stats:{pow:6,rng:10,ctl:8,dur:6,vrs:9}, desc:'Open stable traversable wormholes between any two points in space. Unlike instant displacement, portals create persistent tunnels — anything and anyone can pass through in either direction. They can be held open indefinitely, used as defensive redirectors to swallow incoming attacks, or snapped shut mid-transit with surgical precision.'},
  {id:'intel',    name:'Super Intelligence',        icon:'🧠',powerClass:'Mental',   color:'#bfdbfe',rgb:'191,219,254', gen:0,tags:['mind','perception','causality','signal','connection','ordered'],      stats:{pow:4,rng:7,ctl:10,dur:6,vrs:10},desc:'Process information, recognize patterns, and model complex systems at a depth that makes conventional genius look like arithmetic. This is qualitatively different thinking — holding thousands of variables in active working memory, perceiving causal chains invisible to others, and deriving solutions that appear to violate the information available. Not faster. Deeper.'}
];

// ── PAIR FUSIONS ────────────────────────────────────────────────────────────
const PAIRS = {
  'cryo+pyro':      {name:'Thermal Paradox',        desc:'Command absolute temperature — from the heart of stars to the stillness of absolute zero — as a single unified force. The power oscillates between extremes in unstable equilibrium, each pole feeding the other in a thermodynamic loop that should not sustain itself but does, barely, like a scream held between two silences.',reason:'Heat and cold do not merely oppose — they consume each other. Where they meet at sufficient intensity, the conflict is not resolved but transcended; a third thermodynamic state emerges from their mutual annihilation that carries the memory of both extremes and the stability of neither.'},
  'electro+pyro':   {name:'Plasma Discharge',       desc:'Superheat air into ionized plasma, then launch it as bolts that burn and electrocute simultaneously. Matter struck passes through multiple states of existence at once.',reason:'Electrical charge superheats matter beyond gas into plasma — both powers share the same energetic substrate, and their fusion unlocks that threshold.'},
  'pyro+tele':      {name:'Psychic Immolation',     desc:'Broadcast the raw sensation of burning into a target\'s nervous system without touching them. Extreme emotion also manifests outward as real, uncontrolled fire.',reason:'Intense emotion and thermal energy share the same neurochemical pathway — the mind\'s heat and the body\'s fire become indistinguishable at fusion.'},
  'pyro+speed':     {name:'Combustion Dash',        desc:'Leave a trail of living fire with every burst of movement, igniting the atmosphere behind you like a rocket. The faster you move, the hotter the wake becomes.',reason:'Friction from superhuman movement generates thermal energy sufficient to trigger pyrokinetic ignition — speed and fire lock into a self-reinforcing loop.'},
  'gravity+pyro':   {name:'Stellar Forge',          desc:'Compress matter under crushing gravity until it ignites in nuclear fusion, creating miniature stellar cores. Objects collapse into burning, dense singularities.',reason:'Sufficient gravitational compression triggers nuclear fusion — the same physics that birth stars. Gravity and fire are linked at the fundamental level of matter.'},
  'pyro+shadow':    {name:'Darkfire',               desc:'Wield black flames that burn cold, consume light entirely, and phase through armor as if it were mist. Darkfire leaves no smoke, no heat, and no scar — only absence.',reason:'Shadow absorbs all electromagnetic radiation while fire emits it. Their collision creates a self-consuming dark-energy reaction between presence and destruction.'},
  'heal+pyro':      {name:'Phoenix Resurrection',   desc:'Die in flame and be reborn from your own ashes, injuries fully healed and cellular structure temporarily reinforced. Each rebirth cycles you to a stronger baseline.',reason:'The healing factor repurposes cellular death triggered by fire as a catalyst — destruction becomes the condition for total biological regeneration.'},
  'earth+pyro':     {name:'Magmaforging',           desc:'Melt stone and soil into lava on contact, then sculpt the molten rock into weapons, walls, or terrain. The boundary between forge and battlefield disappears.',reason:'Earth mastery naturally extends into molten earth. Lava is stone that crossed a temperature threshold — pyrokinesis provides that key.'},
  'pyro+time':      {name:'Entropy Vision',         desc:'See all things in their inevitable burned-out, decayed final state. Accelerate or reverse the thermodynamic decay of any matter with focused intent.',reason:'Fire is entropy made visible. Combined with temporal perception it grants direct sight into the thermodynamic future of any system.'},
  'cryo+electro':   {name:'Superconductor Form',    desc:'Generate zero-resistance electrical fields that carry current without loss, amplifying electrokinetic output to catastrophic, unbounded levels.',reason:'Extreme cold eliminates electrical resistance entirely. Electrokinetic power flows without dissipation and accumulates without ceiling.'},
  'cryo+tele':      {name:'Glacial Mind',           desc:'Freeze a target\'s thoughts mid-process — halting decisions before they form. Implant memories so cold they can never be altered or overwritten.',reason:'Cryokinesis can slow neurological processes to near-halt. Paired with telepathy, it allows direct manipulation of the electrochemical substrate of thought itself.'},
  'cryo+speed':     {name:'Absolute Zero Sprint',   desc:'Move faster than sound while freezing the atmosphere in your wake, shattering a crystallized trail of air behind you. Targets experience sudden cold before they see you arrive.',reason:'Moving at super speed through cold air generates a cryogenic wake. Speed and cold lock into a self-reinforcing loop — each amplifying the other\'s intensity.'},
  'cryo+gravity':   {name:'Neutron Frost',          desc:'Create zones of impossible cold and gravitational density — regions so compressed and frigid that light itself slows to a crawl inside them.',reason:'Cold increases matter density; gravity compresses it further. Together they approach theoretical matter-collapse states once reserved for neutron stars.'},
  'cryo+shadow':    {name:'Void Ice',               desc:'Crystallize darkness itself into black ice that is invisible, perfectly frictionless, and colder than the void between galaxies. It reflects no light and registers no temperature.',reason:'Shadow form can solidify the absence of light; cryokinesis gives that absence rigid structure — producing crystallized darkness with physically impossible properties.'},
  'cryo+heal':      {name:'Stasis Preservation',    desc:'Freeze biological processes indefinitely — suspend injuries exactly as they are, pause aging to near-zero, or place others in a perfect, reversible biological stasis.',reason:'Suspended animation is the extreme of cold\'s slowing effect on entropy. The healing factor redirects this to preserve cellular integrity across indefinite timeframes.'},
  'cryo+earth':     {name:'Permafrost Dominion',    desc:'Flash-freeze earth and soil on contact, converting entire landscapes into glacial tundra. Encase targets in glacial stone that grows from the ground up.',reason:'Earth contains moisture throughout its composition. Cryokinesis flash-freezes it at the molecular level, granting instant terrain conversion at geological scale.'},
  'cryo+time':      {name:'Temporal Stasis',        desc:'Freeze a single moment in time like an insect in amber — suspending people, events, or your own timeline in a perfect, indefinite pause.',reason:'Cold slows entropy; temporal perception navigates it. Together they identify and halt the causal flow of a specific moment, crystallizing it outside normal time.'},
  'electro+tele':   {name:'Neural Override',        desc:'Hijack nervous systems directly via bioelectrical signal, commandeering muscle control without touching the higher mind. Read thought-patterns as electromagnetic fields and rewrite them.',reason:'Thoughts are electrochemical signals. Electrokinesis reads and rewrites those signals at the physical layer — making telepathy a technical rather than psychic process.'},
  'electro+speed':  {name:'Lightning Form',         desc:'Transform your physical body into pure electrical current, travel through any conductive path at the speed of light, and re-solidify anywhere along the circuit.',reason:'Super speed at its relativistic limit converts matter to energy. Electrokinesis provides the channel and coherent form that makes this transformation survivable.'},
  'electro+gravity':{name:'Unified Field',          desc:'Bend light around electromagnetic fields, generate gravity wells powered by magnetic force, and unify the two into controlled macro-scale effects.',reason:'Electromagnetism and gravity are two of the four fundamental forces. Their resonance at sufficient intensity generates unified field effects previously only theorized.'},
  'electro+shadow': {name:'Void Current',           desc:'Draw electrical energy from the absence of light — generating unlimited power from pure, unilluminated darkness. The darker the space, the stronger the current.',reason:'Shadow form absorbs photons, which are electromagnetic energy. Electrokinesis converts that absorbed energy into usable current — darkness becomes an inexhaustible source.'},
  'electro+heal':   {name:'Bioelectric Crucible',    desc:'Channel electrical current through living tissue at amplitudes that should sterilize it — ionizing radiation tearing at cell membranes while regeneration rebuilds them mid-rupture. The body becomes a crucible where destruction and repair happen simultaneously at the cellular level, each cycle slightly different from the last, the healed tissue carrying ghost patterns from the radiation it survived.',reason:'Electrokinesis now channels ionizing electromagnetic radiation. The healing factor repairs biological damage. When radiation dismantles cells and regeneration immediately rebuilds them, the process becomes a controlled demolition-and-reconstruction loop — each cycle tempered by the damage, producing tissue that has been stress-tested against its own energy source.'},
  'earth+electro':  {name:'Magnetokinesis',         desc:'Command every vein of metal buried in the earth\'s crust — bend iron ore, rip copper from bedrock, reshape geological electromagnetic fields at continental scale.',reason:'Earth contains vast deposits of conductive metals. Electrokinesis naturally extends to magnetokinetic control of buried ore — earth mastery provides the reach.'},
  'electro+time':   {name:'Temporal Signal',        desc:'Encode information as electromagnetic pulses and transmit them backwards or forwards along the timeline, receiving replies from your own future or past.',reason:'Electromagnetic waves can be quantum-shifted at the Planck scale. Temporal perception provides the navigational coordinates to aim and receive those signals accurately.'},
  'speed+tele':     {name:'Precognitive Rush',      desc:'Read the environmental minds around you — sensing committed intent, not just current thoughts — and react to attacks before the body even initiates them.',reason:'Super speed creates cognitive overload from raw sensory input. Telepathy processes environmental awareness at a level that matches the body\'s velocity.'},
  'gravity+tele':   {name:'Psychokinesis',          desc:'Move any object with pure thought — gravity control provides the force, telepathy provides the targeting intent and extends that force to all physical matter.',reason:'Gravity Control already manipulates mass at a distance. Telepathy extends this from gravitational bodies to all matter through directed mental will — true telekinesis.'},
  'shadow+tele':    {name:'Dream Weaving',          desc:'Enter sleeping minds and construct layered realities indistinguishable from waking experience — but the shadow\'s isolation warps the connection. The dreamscapes drift toward solitude, trapping the target in architectures of loneliness that the telepathic link keeps feeding. The weaver feels the tether between isolation and connection straining with each layer.',reason:'Shadow form accesses the liminal space where dreaming occurs — the subconscious gap between presence and absence. Telepathy provides the connection to write content there. But shadow now carries isolation, which opposes the telepathic connection itself — the link that builds the dream is the same link the shadow tries to sever, producing dreamscapes defined by their aching disconnection.'},
  'heal+tele':      {name:'Empathic Surgery',       desc:'Feel the exact location, nature, and severity of any injury within a target\'s body, then channel healing energy to that precise point with zero wasted tissue.',reason:'Telepathy maps neural pain signals with perfect accuracy. The healing factor follows those maps to repair with unprecedented precision.'},
  'earth+tele':     {name:'Geomantic Memory',       desc:'Perceive the emotions and experiences embedded in stone — reading the full history of any location by touching the ground, witnessing past events as vivid impressions.',reason:'Earth records seismic and thermal events across millennia at the molecular level. Telepathy reads the informational imprint those events leave in crystalline matter.'},
  'tele+time':      {name:'Temporal Empathy',        desc:'Feel the precise emotional state of any person at any point in their personal timeline — but past and future pull the experience in opposite directions simultaneously. You inhabit their grief and their joy across decades, but the temporal tension makes the experience non-linear; you feel the cause after the effect, the healing before the wound, chronology scrambled by the collision of temporal directions within the empathic link.',reason:'Temporal perception navigates time as a traversable landscape. Telepathy reads what exists there. But time carries both past and future as opposing essences — every temporal-telepathic link vibrates with the tension between what was and what will be, producing emotional data that arrives out of sequence because the timeline itself is under stress.'},
  'gravity+speed':  {name:'Orbital Strike',         desc:'Accelerate to orbital velocity, tether a gravitational line to any surface target, and deliver a kinetic impact equivalent to a small asteroid from above.',reason:'At sufficient velocity, momentum and gravity become interchangeable forces. The two powers merge into a unified kinetic equation — speed provides mass-energy, gravity provides the vector.'},
  'shadow+speed':   {name:'Ghost Sprint',           desc:'Move so fast that photon interaction nearly ceases — becoming functionally invisible and able to phase through soft obstacles at full velocity.',reason:'Exceeding certain velocity thresholds dramatically reduces photon interaction with matter. Shadow form extends this into selective intangibility, completing the effect.'},
  'heal+speed':     {name:'Unbreakable Momentum',   desc:'Heal faster than damage can accumulate. At peak velocity, regeneration outpaces any conceivable rate of harm — making you functionally invincible while in motion.',reason:'The healing factor accelerates proportionally to metabolic rate, which peaks during super speed. At maximum velocity, regeneration enters a state no sustained damage can overcome.'},
  'earth+speed':    {name:'Seismic Step',           desc:'Run fast enough that each footfall delivers earthquake-magnitude shockwaves into the bedrock, reshaping terrain purely through the transfer of kinetic energy.',reason:'Force equals mass times acceleration. At superhuman speed, footfalls exceed the tensile strength of bedrock — earth mastery directs where that energy goes.'},
  'speed+time':     {name:'Temporal Velocity',      desc:'Move through time as fluidly as through space — accelerating forward into the future, decelerating backward toward the past, or simply outrunning the present moment entirely. But past and future pull in opposite directions while velocity demands a single vector, and the experience of temporal speed is vertiginous, disorienting, the traveler perceiving both directions of time simultaneously while their body commits to one.',reason:'Super Speed operates through velocity — directional kinetic motion. Time carries past and future as opposing vectors. The fusion must choose a temporal direction while being pulled in both, and the faster the user moves through time, the more violently the opposing temporal pole resists. Temporal speed is not free; it costs equilibrium.'},
  'gravity+shadow': {name:'Event Horizon',          desc:'Generate gravitational singularities of pure darkness — regions from which nothing escapes, not even light. Matter spirals in and undergoes complete informational erasure.',reason:'Black holes are gravity so extreme light cannot escape. Shadow form provides the photon-absorption mechanism needed to complete the phenomenon at a human scale.'},
  'gravity+heal':   {name:'Gravitational Density',  desc:'Increase your own cellular density using internal gravity fields — becoming nearly indestructible, distributing any incoming force across a reinforced gravitational lattice.',reason:'The healing factor redirects gravitational control inward. Increasing cellular density absorbs external force across the entire field rather than any single point.'},
  'earth+gravity':  {name:'Tectonic Authority',      desc:'Command the gravitational relationship between the planet and its own mass — redirect tectonic plates, lift mountain ranges into orbit, or compress geological formations with stellar-core pressures. The power spans two scales that resist unification, celestial forces treating the ground as insignificant and geological forces treating the sky as irrelevant. Wielding both feels like standing with one foot on each side of a widening crack.',reason:'Celestial-scale gravity operates on orbital mechanics — planets as point masses, geology as rounding error. Geological-scale earth operates on material science — crystal lattices, fault lines, sedimentary layers. The fusion forces cosmic abstraction and material specificity into the same frame, producing control that oscillates between planetary and granular with unsettling discontinuity.'},
  'gravity+time':   {name:'Gravitational Epoch',     desc:'Manipulate the relationship between gravity and time — dilating temporal flow through gravitational intensity, aging targets through localized time-gravity wells, or freezing moments in spacetime amber through concentrated mass. Near the extremes, the distinction between spatial compression and temporal dilation vanishes entirely, and what you\'re actually doing stops being describable in three dimensions.',reason:'General relativity unifies gravity and time — massive objects dilate time, and sufficient gravitational intensity stops it entirely. The fusion operates directly on this spacetime curvature, and the past↔future tension in time\'s own tag structure means the temporal dilation is never stable; it oscillates between compressing toward the past and stretching toward the future.'},
  'heal+shadow':    {name:'Necrotic Vitality',       desc:'Regenerate through darkness — wounds heal not with clean new tissue but with shadow-stuff that functions as flesh while remaining fundamentally void. The restored limb works, flexes, feels — but it is cold to the touch and drinks light at the edges. Something in the repair process is deeply, fundamentally at war with itself.',reason:'Shadow form exists in the space between presence and absence. The healing factor demands presence — full biological existence, every cell accounted for. Forcing regeneration through the void substrate produces tissue that is simultaneously alive and absent, functional matter woven from the fabric of non-existence.'},
  'earth+shadow':   {name:'Shadow Strata',            desc:'Command geological formations through darkness — stone that moves unseen, sinkholes that open beneath shadows, walls of obsidian that rise from the ground without warning. The earth responds to shadow as a signal, reshaping terrain in the spaces between visibility. Darkness becomes a construction zone.',reason:'Earth Mastery commands geological material. Shadow Form operates through absence of light. The fusion treats darkness as a blueprint layer — geological commands are issued through shadow, allowing terrain manipulation that cannot be seen until it has already happened. The earth builds in the dark.'},
  'shadow+time':    {name:'Temporal Ghost',         desc:'Exist as a perceptible presence in a past or future moment — visible enough to observe and interact, absent enough to leave no causal trace in the timeline.',reason:'Shadow form exists in liminal states between presence and absence. Temporal perception extends this into liminal moments between past and present.'},
  'earth+heal':     {name:'Biome Restoration',      desc:'Extend the healing factor outward from your body to entire ecosystems — regrow forests, reverse desertification, purify poisoned water tables, and revive extinct flora.',reason:'The healing factor\'s biological repair mechanism can propagate through any connected living system. Earth mastery provides the scale — the planet becomes the patient.'},
  'heal+time':      {name:'Chrono-Regeneration',    desc:'Rewind biological damage by navigating the body\'s timeline to a prior healthy state — but the process fights against itself at the fundamental level, entropy pulling one direction while life pulls the other. Healing feels less like repair and more like arm-wrestling with thermodynamics, the outcome never quite settled until the wound either closes or doesn\'t.',reason:'The healing factor maps the body\'s optimal state; temporal perception navigates to it. But entropy is time\'s natural direction — rewinding biology means forcing life upstream against the current that defines time itself. The two forces tear at each other, and the fusion exists in the tension between them.'},
  'earth+time':     {name:'Deep Memory',            desc:'Witness geological events millions of years in the past as vivid, fully embodied experiences — standing inside eruptions, extinctions, and the slow collision of continents.',reason:'Stone and soil hold the physical record of every geological era at the atomic level. Temporal perception decodes that encoded record into fully experienced memory.'},
  // ── NEW × NEW PAIRS ──────────────────────────────────────────────────────
  'astral+bio':       {name:'Essence Reader',          desc:'Project your consciousness into any living organism and experience its complete biological reality from the inside — its senses, its instincts, its cellular processes. Return to your body carrying a perfect physiological blueprint that Biomimicry can replicate without ever having observed the creature externally.',reason:'Astral projection accesses consciousness; biological organisms run on electrochemical consciousness. The astral form can inhabit that substrate directly, reading the organism\'s genetic expression as lived experience rather than observed data.'},
  'astral+chloro':    {name:'Verdant Spirit',          desc:'Project your consciousness into the mycorrhizal network itself — experiencing the forest as a single distributed organism. Issue commands from within the root web, coordinating plant growth across miles with the intimacy of moving your own fingers.',reason:'Plants communicate through chemical signaling across fungal networks — a form of distributed consciousness. Astral projection interfaces with consciousness directly, allowing it to merge with and command this ancient biological internet from the inside.'},
  'astral+intel':     {name:'Omniscient Witness',      desc:'Project an astral form with superhuman analytical capacity into any location, processing every observable detail simultaneously — reading documents through walls, modeling conversations from lip movements three rooms away, reconstructing events from dust displacement patterns.',reason:'Astral projection removes physical limitations on observation. Super Intelligence removes cognitive limitations on processing. Together they produce an invisible analyst that perceives everything and understands all of it.'},
  'astral+photo':     {name:'Spectral Luminance',      desc:'The astral form becomes visible as a blinding apparition of pure light, capable of projecting focused beams and reading the full electromagnetic spectrum from its disembodied vantage. A ghost that sees everything and can burn what it chooses.',reason:'The astral form normally cannot interact with the physical world. Photokinesis provides the mechanism — photon generation and manipulation requires no physical mass, only energy, giving the disembodied consciousness a way to project force as coherent light.'},
  'astral+portal':    {name:'Rift Walking',            desc:'Open portals from the astral plane directly into physical space — stepping your consciousness through a wormhole and manifesting a semi-tangible presence at the destination without your body ever leaving its trance. Multiple rift-points can exist simultaneously.',reason:'Portals bridge two points in space. The astral plane is functionally a parallel spatial layer. Portal creation can anchor one terminus in the astral and one in the physical, creating cross-planar gateways that bypass the body entirely.'},
  'astral+prob':      {name:'Fate Sight',              desc:'Project your consciousness forward along probability branches, experiencing the most likely futures as fully immersive visions with perfect sensory fidelity. Return to the present carrying experiential knowledge of events that have not yet occurred — and the ability to weight them.',reason:'Probability manipulation perceives branching futures as a quantum landscape. Astral projection allows consciousness to travel through non-physical spaces. The probability field is precisely such a space — traversable by a mind unbound from the body.'},
  'astral+sono':      {name:'Ghost Frequency',         desc:'Emit sound waves from the astral form — disembodied voices, infrasonic terror pulses, targeted resonance attacks from an invisible and intangible source. The sound has no traceable origin point in physical space.',reason:'Sound is mechanical wave propagation through a medium. The astral form vibrates at frequencies below physical detection but above absolute stillness — Sonokinesis amplifies these vibrations into the audible and destructive range, weaponizing a ghost.'},
  'astral+strength':  {name:'Phantom Force',           desc:'Project an astral form that carries the full kinetic output of Super Strength — an invisible and intangible presence that strikes with tonnage force. Objects shatter under blows from nothing. Walls crack from empty air.',reason:'Super Strength generates force through reinforced biological systems. Astral projection separates consciousness from the body. The force output — encoded as willpower rather than muscle contraction — projects with the astral form as kinetic intent made manifest.'},
  'astral+teleport':  {name:'Soul Displacement',       desc:'Teleport your astral form independently of your body, then pull the body to the astral form\'s location — or send the astral form ahead as a scout before committing to displacement. Eliminates teleportation\'s blind-jump risk entirely.',reason:'Teleportation requires destination mapping. Astral projection provides the perfect reconnaissance mechanism — an intangible scout that can verify the destination before the body displaces. The tether between body and astral form becomes the teleportation vector.'},
  'bio+chloro':       {name:'Symbiotic Genesis',       desc:'Merge plant biology with animal biology at the cellular level — grow photosynthetic skin, sprout thorned dermal armor, generate plant-based toxins from human glands, or root yourself into the earth to tap the mycorrhizal network as a sensory organ.',reason:'Biomimicry replicates observed biological traits. Chlorokinesis commands plant biology directly. Together they erase the kingdom boundary — plant cellular machinery becomes available for integration into the human body, producing hybrid organisms that evolution never attempted.'},
  'bio+intel':        {name:'Evolutionary Calculus',   desc:'Analyze any organism and instantly compute optimal biological adaptations without needing to observe them in nature — designing novel trait combinations that no living creature has ever evolved. The body becomes a laboratory for theoretical biology.',reason:'Biomimicry copies what exists. Super Intelligence models what could exist. Together they bypass observation entirely — the mind calculates the ideal protein fold, membrane structure, or neural architecture, and the body expresses it as engineered adaptation.'},
  'bio+photo':        {name:'Bioluminescent Arsenal',  desc:'Generate and control light biologically — from deep-sea anglerfish lures and firefly signaling to weaponized photonic discharge channeled through modified chromatophore arrays. The body becomes a living laser, converting metabolic energy directly into coherent light.',reason:'Bioluminescence exists across hundreds of species as a biological light-generation mechanism. Biomimicry replicates the chemistry; Photokinesis amplifies the output from bioluminescent flickers to weapon-grade coherent beams by imposing electromagnetic discipline on the biological source.'},
  'bio+portal':       {name:'Chimeric Transit',        desc:'Open portals into any biome and absorb the biological traits of organisms on the other side without physically traveling there. Reach through a wormhole into a deep-ocean trench and pull back pressure resistance. Open a window to the canopy and steal a raptor\'s visual acuity.',reason:'Biomimicry requires observation of living organisms. Portal Creation eliminates the distance constraint — any biome on Earth becomes immediately adjacent, transforming the power from opportunistic adaptation into a curated biological catalogue accessible on demand.'},
  'bio+prob':         {name:'Adaptive Foresight',      desc:'The body pre-adapts to threats before they materialize — growing armored keratin plating seconds before an ambush, synthesizing antivenoms before the bite, developing heat resistance before the explosion. Danger triggers biological precognition.',reason:'Probability manipulation perceives incoming threats as collapsing wavefunctions. Biomimicry restructures the body in response. The probability field becomes a biological early warning system — the body reads the future and evolves to survive it in real time.'},
  'bio+sono':         {name:'Resonance Anatomy',       desc:'Restructure your vocal and skeletal systems to produce and withstand extreme sonic output — echolocation with architectural-scan resolution, vocal-cord-generated infrasonic blasts, and bone structures that amplify rather than absorb vibration.',reason:'Many organisms use biological sonar — bats, dolphins, shrews. Biomimicry replicates and enhances these structures. Sonokinesis provides the frequency control and amplitude that biological systems alone cannot achieve, turning adapted anatomy into a precision weapon.'},
  'bio+strength':     {name:'Apex Predator',           desc:'Layer biological reinforcements onto Super Strength\'s existing frame — mantis shrimp striking mechanisms, rhinoceros beetle proportional force multiplication, spider silk tensile integration through connective tissue. Every biological advantage evolution produced for raw physical dominance, stacked.',reason:'Super Strength provides the base force output and structural reinforcement. Biomimicry adds four billion years of evolved force-multiplication solutions — hydraulic striking chambers, chitin-composite armor, elastic energy storage tendons — amplifying already superhuman force through biological engineering.'},
  'bio+teleport':     {name:'Displacement Adaptation', desc:'Teleport into any environment and instantly adapt to survive it — displacing into deep ocean and developing pressure resistance mid-transit, arriving in vacuum with sealed skin and oxygen-storing hemoglobin. The body reads the destination and rewrites itself before materialization completes.',reason:'Teleportation displaces matter across space. Biomimicry adapts the body to environmental conditions. When fused, the displacement event itself triggers adaptive response — the body samples the destination environment during the liminal transit phase and restructures accordingly.'},
  'chloro+intel':     {name:'Botanical Architect',     desc:'Design and grow plant structures of impossible complexity — living buildings with vascular plumbing, photosynthetic solar arrays, root-network computers that process information through chemical signaling. Engineering through biology instead of steel.',reason:'Chlorokinesis accelerates and directs plant growth. Super Intelligence provides the architectural and systems-engineering knowledge to direct that growth into functional structures — computing optimal branch angles, nutrient distribution, and structural load paths that plants would never develop naturally.'},
  'chloro+photo':     {name:'Photosynthetic Overdrive',desc:'Supercharge plant life with amplified light across the full spectrum — accelerating photosynthesis to explosive growth rates, weaponizing the oxygen output as combustion fuel, or starving specific plants by bending light away from them. Control the energy source that all plant life depends on.',reason:'Photosynthesis converts light into chemical energy. Photokinesis controls light delivery with precision — amplifying specific wavelengths that maximize chlorophyll absorption, focusing concentrated beams to hypercharge growth, or cutting light entirely to trigger rapid senescence.'},
  'chloro+portal':  {name:'World Garden',            desc:'Open portals into any ecosystem and extend root networks through them — a garden that spans the planet through connected doorways. But the portals carry void and the plants carry life, and every root that passes through a wormhole exists briefly in the liminal space between them. The plants that grow through portals are subtly altered — their cells carry trace signatures of the void they traversed, and they connect ecosystems while introducing something foreign to each.',reason:'Chlorokinesis extends living root systems. Portal creation tunnels through void-adjacent space. The roots pass through the void↔life boundary during every traversal, and the isolation inherent in portal space resists the biological connection the root network is trying to establish — producing plants that bridge distant ecosystems while carrying the mark of the nothing they grew through.'},
  'chloro+prob':      {name:'Bloom Cascade',           desc:'Weight probability toward explosive botanical events — a dormant seed happens to find the perfect moisture, the perfect soil chemistry, the perfect angle of light, all at once. Gardens erupt from barren ground as improbable coincidences chain together into a wall of green.',reason:'Plant growth depends on hundreds of probabilistic environmental variables — rainfall, soil pH, pollinator timing, mycorrhizal colonization. Probability manipulation collapses all of them favorably simultaneously, producing growth conditions so perfect they border on miraculous.'},
  'chloro+sono':      {name:'Verdant Resonance',       desc:'Communicate with and command plant life through precise sonic frequencies — vibrations that trigger growth hormones, ultrasonic pulses that direct root pathfinding, and infrasonic booms that weaponize tree trunks as battering rams by vibrating them at their resonant frequency.',reason:'Plants respond to mechanical vibration — studies show sound exposure affects growth rates and gene expression. Sonokinesis provides precisely calibrated frequencies that exploit these pathways, while Chlorokinesis amplifies the biological response from subtle growth changes to dramatic structural commands.'},
  'chloro+strength':  {name:'Ironwood Titan',          desc:'Grow living wood armor of supernatural density around the body and wield weaponized plant matter reinforced to match steel. Lignocellulose structures compress under chlorokinetic control to hardnesses exceeding metal — a walking siege engine sheathed in ancient timber.',reason:'Wood\'s tensile strength approaches steel at the molecular level but is limited by porosity and grain structure. Chlorokinesis can direct cellulose growth to eliminate these weaknesses. Super Strength provides the force to wield structures that would otherwise be immovably heavy.'},
  'chloro+teleport':  {name:'Spore Gate',              desc:'Teleport to any location where plant life exists by locking onto its biological signal — mycorrhizal networks become a planetary waypoint system. Arrive wreathed in accelerated growth, the local flora surging to greet and armor you on materialization.',reason:'Teleportation requires destination mapping. Plant root networks span nearly every landmass on Earth and communicate chemically. Chlorokinesis reads these signals as location beacons, providing an organic GPS that gives Teleportation billions of pre-mapped destinations.'},
  'intel+photo':      {name:'Spectrum Analysis',       desc:'Read the full electromagnetic spectrum with superhuman analytical depth — deducing chemical composition from absorption spectra, detecting lies from micro-expressions in infrared, reconstructing past events from residual photon scatter patterns with forensic precision.',reason:'Photokinesis perceives the full EM spectrum. Super Intelligence processes that data with perfect pattern recognition. Together they transform raw photon data into total environmental omniscience — every wavelength tells a story the mind can read instantly.'},
  'intel+portal':     {name:'Tactical Geometry',       desc:'Compute optimal portal placement in real time during combat — calculating angles of reflection for redirected attacks, opening portals that turn an opponent\'s momentum against them, and maintaining dozens of simultaneous wormholes in a precise spatial web.',reason:'Portal Creation opens spatial shortcuts. Super Intelligence models three-dimensional geometry and trajectory calculation with perfect precision. The mind computes ideal portal positions faster than opponents can react — turning combat into a solved spatial equation.'},
  'intel+prob':     {name:'Laplacian Mind',           desc:'Model probability with computational precision so extreme that prediction becomes indistinguishable from determination — but the deeper the model runs, the more it encounters the universe\'s fundamental resistance to being fully known. Ordered cognition pressing against causal chaos produces a mind that computes futures with terrifying accuracy while sensing, at the edges, the thermodynamic certainty that perfect knowledge is thermodynamically forbidden.',reason:'Super Intelligence imposes order on information. Probability manipulation navigates causal entropy. The fusion pushes ordered cognition to its absolute theoretical limit — Laplace\'s demon realized. The tension between the mind\'s order and reality\'s entropy is the engine that drives the power.'},
  'intel+sono':       {name:'Harmonic Calculus',        desc:'Compute the precise resonant frequency of any structure, material, or system from passive observation — then deliver it with surgical sonic precision. Bridges, buildings, molecular bonds, even neural oscillation patterns become solvable equations with audible solutions.',reason:'Every physical structure has a resonant frequency determined by its mass, elasticity, and geometry. Super Intelligence computes this frequency from observation alone. Sonokinesis delivers it with lethal precision — structural failure reduced to applied mathematics.'},
  'intel+strength':   {name:'Calculated Impact',       desc:'Apply superhuman force with superhuman precision — striking the exact structural weak point at the exact angle to bring down a building with a single punch, or delivering a blow calibrated to the joule to incapacitate without killing. Brute force becomes surgery.',reason:'Super Strength provides force without precision. Super Intelligence provides precision without force. Combined, every strike is informed by complete structural analysis — the mind identifies the load-bearing failure point and the body delivers exactly enough force to exploit it.'},
  'intel+teleport':   {name:'Spatial Calculus',        desc:'Compute teleportation coordinates with mathematical precision from minimal data — a photograph, a coordinate set, a verbal description. Eliminates the need for prior visits entirely. Calculate the exact position of a moving target and displace to intercept.',reason:'Teleportation\'s range limit is destination mapping, not distance. Super Intelligence constructs precise spatial models from indirect data — satellite imagery, architectural plans, described landmarks — providing the mental image that teleportation requires without physical reconnaissance.'},
  'photo+portal':     {name:'Light Gate',              desc:'Open portals made of coherent light — photonic wormholes that redirect any electromagnetic radiation passing through them. Bend a laser around a corner through a light-gate. Channel sunlight from the far side of the planet through a portal into a focused beam. Redirect any energy-based attack back at its source.',reason:'Portals redirect matter and energy through spatial shortcuts. Photokinesis controls electromagnetic radiation. Light Gates specialize the portal mechanism for the electromagnetic spectrum — creating wormholes optimized for photon transmission with zero signal loss.'},
  'photo+prob':       {name:'Prismatic Fortune',       desc:'Bend light to reveal probability fields as visible prismatic patterns — futures shimmer as color-coded halos around people and objects. Favorable outcomes glow gold; catastrophic ones burn red. Then reshape both the light and the odds simultaneously.',reason:'Probability fields are quantum phenomena. Photons are quantum objects whose behavior probability manipulation already influences. Photokinesis renders these quantum probability states as visible interference patterns — making the invisible math of chance into something the eyes can read and the will can edit.'},
  'photo+sono':       {name:'Full Spectrum',           desc:'Command both the electromagnetic and mechanical wave spectrums simultaneously — light and sound as a unified weapon system. Create disorienting strobes synced with infrasonic nausea pulses. Deliver silent laser strikes and sonic booms from the same gesture.',reason:'Light and sound are both wave phenomena operating on different substrates — electromagnetic and mechanical respectively. Mastery of both wave types grants total control over signal propagation, enabling synchronized attacks across the full energy transmission spectrum.'},
  'photo+strength':   {name:'Solar Fist',              desc:'Convert absorbed solar radiation directly into physical force — punches that discharge stored photonic energy as thermal shockwaves on impact. In direct sunlight the power reservoir is functionally limitless. The body glows with barely contained radiance at full charge.',reason:'Super Strength generates mechanical force from biological energy. Photokinesis absorbs and stores electromagnetic energy. The fusion uses photonic energy as fuel for physical force output — each strike converts absorbed light into kinetic and thermal discharge at the point of impact.'},
  'photo+teleport':   {name:'Lightspeed',              desc:'Convert your body into a coherent beam of light, traverse any distance at 299,792 km/s, and reassemble at the destination. Unlike standard teleportation, you experience the journey — riding a photon stream with full awareness. Line-of-sight teleportation becomes literally instantaneous.',reason:'Teleportation displaces matter without traversal. Photokinesis converts matter-state to energy-state. The fusion takes the intermediate step — converting the body to light, traveling at lightspeed, then reconverting to matter. The displacement is no longer instantaneous but is instead physically traveled at maximum universal velocity.'},
  'portal+prob':      {name:'Convergence Gate',        desc:'Open portals to the most probabilistically favorable location for any given objective — the portal destination is computed by the probability field itself. Need an escape? A portal opens to safety. Need a weapon? A portal opens to an armory. The wormhole finds what you need.',reason:'Portal creation requires a destination. Probability manipulation perceives all possible outcomes and identifies the optimal one. The fusion lets probability itself select the portal\'s terminus — collapsing the destination from all possible locations to the one that maximizes the desired outcome.'},
  'portal+sono':      {name:'Thunder Gate',            desc:'Fire sonic blasts through portals for untraceable acoustic attacks from impossible angles. A whisper enters a wormhole and exits as a concussive detonation. Sound can be looped through recursive portals, amplifying with each pass until it reaches destructive resonance.',reason:'Sound is mechanical wave propagation. Portals transmit matter and energy. Sonic waves entering a portal exit from the other terminus with preserved amplitude — and recursive portal loops create a feedback amplification chamber that multiplies acoustic energy with each cycle.'},
  'portal+strength':  {name:'Infinite Momentum',       desc:'Punch through a portal placed inches in front of your fist and exit from a portal placed behind the target — strikes arrive from impossible directions with full force. Fall through recursive portals to build terminal velocity, then redirect the accumulated momentum into a single impact.',reason:'Super Strength generates enormous force vectors. Portal Creation redirects those vectors through space. A fist entering a portal exits at any point in space with preserved momentum — and falling through recursive vertical portals converts gravitational acceleration into ever-increasing kinetic energy with no terminal limit.'},
  'portal+teleport':  {name:'Spatial Supremacy',       desc:'Combine instant displacement with persistent wormholes for total mastery over spatial geometry. Teleport inside a collapsing portal to escape. Open a portal to a location you\'ve only visited via teleportation. Displace objects through portals or displace portals around objects. Space becomes a tool, not a constraint.',reason:'Teleportation and Portal Creation are fundamentally different spatial manipulations — one displaces matter, the other displaces space itself. Mastering both grants complete control over the relationship between objects and the space they occupy, rendering distance and position fully mutable.'},
  'prob+sono':        {name:'Resonance Cascade',       desc:'Every sonic emission hits the exact frequency needed to produce the desired outcome — structural collapse, neural disruption, or perfect acoustic cancellation. Sound becomes probabilistically guided, always finding the resonant frequency on the first attempt.',reason:'Finding a target\'s resonant frequency normally requires scanning through the spectrum. Probability manipulation collapses that search to a single attempt — the first frequency emitted is weighted to be the correct one, producing immediate resonance without trial and error.'},
  'prob+strength':    {name:'Lucky Strike',            desc:'Every blow lands at the worst possible point for the target — the hairline fracture in the armor, the overloaded support column, the off-balance moment. Superhuman force applied with probabilistic perfection. The universe conspires to make every punch a critical hit.',reason:'Super Strength provides force. Probability manipulation ensures that force is applied at the statistically optimal point of maximum effect. The probability field identifies structural weaknesses and collapses timing so that the strike arrives at the precise moment of greatest vulnerability.'},
