      encounterHistory,
      storyArcs,
      worldEventLog,
      teams,
      crisisLog,
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(save));
    showSaveIndicator();
    return true;
  }catch(e){
    console.error('Save failed:',e);
    return false;
  }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const save=JSON.parse(raw);
    if(!save||save.version!==SAVE_VERSION)return false;

    // Restore powers — base powers + saved fused powers
    powers=[...BASE_POWERS,...save.fusedPowers];

    // Restore mutant tags
    Object.keys(MUTANT_TAGS).forEach(k=>delete MUTANT_TAGS[k]);
    Object.assign(MUTANT_TAGS,save.mutantTags||{});

    // Restore convergences
    discoveredConvergences.clear();
    (save.convergences||[]).forEach(id=>discoveredConvergences.add(id));

    // Restore chronicle
    sessionChronicle.length=0;
    (save.chronicle||[]).forEach(e=>sessionChronicle.push(e));

    // Restore counters
    fuseCount=save.fuseCount||0;
    mutantCount=save.mutantCount||0;

    // Restore dynamic convergence flags
    const f=save.flags||{};
    AWAKENING_EP_THRESHOLD=f.AWAKENING_EP_THRESHOLD??65;
    BLEED_CHANCE=f.BLEED_CHANCE??0.12;
    SPONTANEOUS_THRESHOLD=f.SPONTANEOUS_THRESHOLD??90;
    DOUBLE_AWAKENING=f.DOUBLE_AWAKENING??false;
    LEGENDARY_QUALITY_BONUS=f.LEGENDARY_QUALITY_BONUS??0;
    VOID_INSTAB_REDUCTION=f.VOID_INSTAB_REDUCTION??0;
    TEMPORAL_EVO_BOOST=f.TEMPORAL_EVO_BOOST??false;
    LIFE_ENTROPY_BOOST=f.LIFE_ENTROPY_BOOST??false;
    COSMIC_EXTRA_NOUNS=f.COSMIC_EXTRA_NOUNS??false;
    BONUS_TECH_FAMILIES.clear();
    (f.BONUS_TECH_FAMILIES||[]).forEach(fam=>BONUS_TECH_FAMILIES.add(fam));

    // Re-inject Tectonic Rage reaction if it was active
    if(save.hasEarthReaction&&!REACTIONS.some(r=>r.name==='Tectonic Rage')){
      REACTIONS.push({tags:['primordial','volatile'],name:'Tectonic Rage',unlock:'berserker',banner:'The ancient and the volatile found each other in the earth\'s memory. What emerged is the planet\'s own rage — patient for eons, instantaneous in expression.'});
      REACTIONS.sort((a,b)=>b.tags.length-a.tags.length);
    }

    // Clear caches and re-render
    invalidateAbilityCache();
    selected.clear();
    activeFilter='all';

    // Restore heroes
    heroes.length=0;
    (save.heroes||[]).forEach(h=>heroes.push(h));
    heroCount=save.heroCount||heroes.length;

    // Restore relationships
    relationships.length=0;
    (save.relationships||[]).forEach(r=>relationships.push(r));

    // Restore encounter history
    encounterHistory.length=0;
    (save.encounterHistory||[]).forEach(e=>encounterHistory.push(e));

    // Restore story arcs
    storyArcs.length=0;
    (save.storyArcs||[]).forEach(a=>storyArcs.push(a));

    // Restore world events
    worldEventLog.length=0;
    (save.worldEventLog||[]).forEach(w=>worldEventLog.push(w));

    // Restore teams
    teams.length=0;
    (save.teams||[]).forEach(t=>teams.push(t));

    // Restore crisis log
    crisisLog.length=0;
    (save.crisisLog||[]).forEach(c=>crisisLog.push(c));
    // Restore world event flags
    if(worldEventLog.some(w=>w.id==='first_light'))window._worldBondBonus=true;
    if(worldEventLog.some(w=>w.id==='the_network'))window._worldNetworkComplete=true;
    if(worldEventLog.some(w=>w.id==='the_pantheon'))window._worldPantheon=true;
    if(worldEventLog.some(w=>w.id==='age_of_growth'))window._worldArcBoost=true;
    if(worldEventLog.some(w=>w.id==='legacy_era'))window._worldLegacyEra=true;

    return true;
  }catch(e){
    console.error('Load failed:',e);
    return false;
  }
}

function resetGame(){
  localStorage.removeItem(SAVE_KEY);
  // Reset all state to defaults
  powers=[...BASE_POWERS];
  Object.keys(MUTANT_TAGS).forEach(k=>delete MUTANT_TAGS[k]);
  mutantCount=0;fuseCount=0;
  discoveredConvergences.clear();
  sessionChronicle.length=0;
  currentArchetype=null;
  selected.clear();activeFilter='all';
  AWAKENING_EP_THRESHOLD=65;BLEED_CHANCE=0.12;SPONTANEOUS_THRESHOLD=90;
  DOUBLE_AWAKENING=false;BONUS_TECH_FAMILIES.clear();LEGENDARY_QUALITY_BONUS=0;
  VOID_INSTAB_REDUCTION=0;TEMPORAL_EVO_BOOST=false;LIFE_ENTROPY_BOOST=false;
  COSMIC_EXTRA_NOUNS=false;
  heroes.length=0;heroCount=0;
  relationships.length=0;
  encounterHistory.length=0;
  storyArcs.length=0;
  worldEventLog.length=0;
  teams.length=0;
  crisisLog.length=0;_crisisCooldown=0;
  window._worldBondBonus=false;window._worldNetworkComplete=false;
  window._worldPantheon=false;window._worldArcBoost=false;window._worldLegacyEra=false;
  // Remove injected Tectonic Rage
  const trIdx=REACTIONS.findIndex(r=>r.name==='Tectonic Rage');
  if(trIdx!==-1)REACTIONS.splice(trIdx,1);
  invalidateAbilityCache();
  renderFilters();renderGrid();renderHUD();renderArchetype();updateStats();updateHeroBtn();updateEncBtn();updateTeamsBtn();
  showSaveToast('Progress reset');
}

function confirmReset(){
  const root=document.getElementById('modal-root');
  root.innerHTML=`
    <div class="codex-backdrop" onclick="if(event.target===event.currentTarget){document.getElementById('modal-root').innerHTML='';}">
      <div class="codex-modal" style="max-width:400px">
        <div class="codex-header">
          <div class="codex-title-row">
            <span class="codex-title">↺ Reset Progress</span>
            <button class="codex-close" onclick="document.getElementById('modal-root').innerHTML=''">&#x2715;</button>
          </div>
        </div>
        <div class="codex-body" style="padding:20px 24px">
          <div style="color:var(--text2);font-size:13px;line-height:1.6;margin-bottom:16px">
            This will delete all fused powers, mutant tags, convergence events, and awakenings. Your collection will be reset to the 20 base powers.
          </div>
          <div style="color:#f87171;font-size:12px;margin-bottom:20px">This cannot be undone.</div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="save-btn" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button>
            <button class="save-btn danger" style="border-color:rgba(248,113,113,.4);color:#f87171" onclick="document.getElementById('modal-root').innerHTML='';resetGame();">Reset Everything</button>
          </div>
        </div>
      </div>
    </div>`;
}

function showSaveIndicator(){
  const el=document.getElementById('save-indicator');
  if(!el)return;
  el.classList.add('visible');
  setTimeout(()=>el.classList.remove('visible'),2000);
}

function showSaveToast(msg){
  const t=document.createElement('div');
  t.className='save-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function autoSave(){saveGame();}

// ── TITLE SCREEN ────────────────────────────────────────────────────────────
function showTitleScreen(){
  const hasSave=!!localStorage.getItem(SAVE_KEY);
  const orbColors=['rgba(167,139,250,.35)','rgba(244,114,182,.3)','rgba(251,191,36,.25)','rgba(56,189,248,.3)','rgba(74,222,128,.25)','rgba(240,171,252,.3)'];
  let orbs='';
  for(let i=0;i<12;i++){
    const c=orbColors[i%orbColors.length];
    const size=60+Math.random()*120;
    const left=Math.random()*100;
    const dur=12+Math.random()*18;
    const delay=Math.random()*-20;
    orbs+=`<div class="title-orb" style="background:${c};width:${size}px;height:${size}px;left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }

  document.getElementById('title-screen-root').innerHTML=`
    <div class="title-screen" id="title-screen">
      <div class="title-particles">${orbs}</div>
      <div class="title-content">
        <div class="title-icon">⚗</div>
        <div class="title-logo">POWER FUSION LAB</div>
        <div class="title-tagline">Select · Fuse · Emerge</div>
        <div class="title-buttons">
          ${hasSave?`<button class="title-btn primary" onclick="continueGame()">Continue</button>`:''}
          <button class="title-btn ${hasSave?'secondary':'primary'}" onclick="startNewGame()">New Game</button>
          <button class="title-btn secondary" onclick="showTitleCredits()">Credits</button>
        </div>
      </div>
      <div class="title-version">v1.0 · Beta</div>
      <div id="title-credits-root"></div>
    </div>`;
}

function dismissTitle(){
  const el=document.getElementById('title-screen');
  if(!el)return;
  el.style.transition='opacity .6s ease';
  el.style.opacity='0';
  setTimeout(()=>{document.getElementById('title-screen-root').innerHTML='';},650);
}

function continueGame(){
  dismissTitle();
  setTimeout(()=>{
    const fp=powers.filter(p=>p.gen>0).length;
    const parts=[fp+' power'+(fp!==1?'s':'')];
    if(heroes.length)parts.push(heroes.length+' hero'+(heroes.length!==1?'es':''));
    if(encounterHistory.length)parts.push(encounterHistory.length+' encounter'+(encounterHistory.length!==1?'s':''));
    if(storyArcs.length)parts.push(storyArcs.length+' arc'+(storyArcs.length!==1?'s':''));
    if(teams.length)parts.push(teams.length+' team'+(teams.length!==1?'s':''));
    showSaveToast('Welcome back — '+parts.join(', ')+' loaded');
  },700);
}

function startNewGame(){
  // Clear existing save
  localStorage.removeItem(SAVE_KEY);
  // Reset game state
  powers.length=0;
  BASE_POWERS.forEach(p=>powers.push({...p,stats:{...p.stats},tags:[...p.tags]}));
  heroes.length=0;heroCount=0;
  relationships.length=0;
  encounterHistory.length=0;
  storyArcs.length=0;
  worldEventLog.length=0;
  teams.length=0;
  crisisLog.length=0;_crisisCooldown=0;
  window._worldBondBonus=false;window._worldNetworkComplete=false;
  window._worldPantheon=false;window._worldArcBoost=false;window._worldLegacyEra=false;
  renderFilters();renderGrid();renderHUD();renderArchetype();updateStats();updateHeroBtn();updateEncBtn();updateTeamsBtn();
  dismissTitle();
  // Show tutorial for new players
  setTimeout(openTutorial,800);
}

// ── INIT ───────────────────────────────────────────────────────────────────────
const hadSave=loadGame();
renderFilters();renderGrid();renderHUD();
