<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Fusion Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#070710;--bg2:#0c0c1d;--bg3:#111128;
  --card-bg:rgba(255,255,255,.027);--card-h:rgba(255,255,255,.052);
  --border:rgba(255,255,255,.07);--border-m:rgba(255,255,255,.13);
  --text:#eeeef8;--text2:#7878a0;--text3:#3e3e5e;
  --gold:#fbbf24;--gold-dim:rgba(251,191,36,.13);--gold-bdr:rgba(251,191,36,.22);
  --c-fused:#c084fc;--r:16px;--r-sm:10px;--hud:76px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);background-size:52px 52px;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(99,102,241,.07) 0%,transparent 70%);}
.noise{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px;}
.site-header,.page-wrap{position:relative;z-index:1;}

.site-header{position:sticky;top:0;z-index:100;background:rgba(7,7,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.header-inner{max-width:1600px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.logo-area{display:flex;align-items:center;gap:12px;}
.logo-icon{font-size:24px;filter:drop-shadow(0 0 12px rgba(167,139,250,.7));animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.1em;line-height:1;background:linear-gradient(135deg,#fff 0%,#c084fc 60%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.site-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.header-stats{display:flex;gap:28px;}
.stat{text-align:center;}
.stat-num{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;line-height:1;color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.4);}
.stat-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:block;margin-top:1px;}

.tier-sp{color:#fbbf24;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);}
.tier-s {color:#c084fc;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.3);}
.tier-a {color:#38bdf8;background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3);}
.tier-b {color:#4ade80;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3);}
.tier-c {color:#94a3b8;background:rgba(148,163,184,.12);border-color:rgba(148,163,184,.3);}
.tier-d {color:#f87171;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3);}

.page-wrap{max-width:1600px;margin:0 auto;padding:20px 20px calc(var(--hud) + 24px);}
.grid-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.panel-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:8px;}
.count-badge{background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--text2);font-weight:400;letter-spacing:0;text-transform:none;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.filter-btn:hover{border-color:var(--border-m);color:var(--text2);}
.filter-btn.active{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.filter-sep{width:1px;height:20px;background:var(--border);align-self:center;}

.power-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}

.power-card{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 10px;cursor:pointer;overflow:hidden;user-select:none;transition:background .2s,border-color .25s,transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;display:flex;flex-direction:column;}
.power-card::before{content:'';position:absolute;top:0;left:0;right:0;height:var(--bar-h,2.5px);background:var(--power-color,rgba(255,255,255,.08));border-radius:var(--r) var(--r) 0 0;opacity:.6;transition:opacity .2s;}
.power-card::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(var(--power-rgb,255,255,255),.04) 0%,transparent 70%);opacity:0;transition:opacity .25s;}
.power-card:hover{background:var(--card-h);border-color:rgba(var(--power-rgb,255,255,255),.2);transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.45),0 0 0 1px rgba(var(--power-rgb,255,255,255),.09),0 0 28px rgba(var(--power-rgb,255,255,255),.1);}
.power-card:hover::before,.power-card:hover::after{opacity:1;}
.power-card.selected{background:var(--card-h);border-color:var(--power-color);transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 2px var(--power-color),0 0 40px rgba(var(--power-rgb,255,255,255),.2);}
.power-card.selected::before,.power-card.selected::after{opacity:1;}
.power-card[data-tier="S+"]::before,.power-card[data-tier="S"]::before{animation:topPulse 2s ease-in-out infinite;}
@keyframes topPulse{0%,100%{filter:brightness(1);opacity:.7}50%{filter:brightness(1.6);opacity:1;}}

.card-orb{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--power-color);box-shadow:0 0 8px var(--power-color);animation:orbIdle 3s ease-in-out infinite;}
.power-card.selected .card-orb{animation:orbActive .9s ease-in-out infinite;box-shadow:0 0 16px var(--power-color);width:11px;height:11px;top:11px;right:11px;}
@keyframes orbIdle{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.25)}}
@keyframes orbActive{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

.card-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-right:18px;}
.class-badge{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid transparent;}
.tier-pill{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:5px;border:1px solid transparent;}
.card-icon{font-size:22px;margin-bottom:6px;display:block;line-height:1;transition:filter .2s;}
.power-card:hover .card-icon,.power-card.selected .card-icon{filter:drop-shadow(0 0 8px var(--power-color));}
.card-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--text);margin-bottom:2px;line-height:1.2;padding-right:4px;}
.card-pl-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.card-pl{font-size:10px;color:var(--text3);letter-spacing:.04em;}
.card-ep{font-size:10px;color:var(--gold);letter-spacing:.02em;opacity:.8;}
.card-desc{font-size:11px;color:var(--text2);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-bars{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.card-bar-row{display:flex;align-items:center;gap:5px;}
.card-bar-lbl{font-size:8px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;width:22px;flex-shrink:0;}
.card-bar-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.card-bar-fill{height:100%;border-radius:2px;}
.card-bar-val{font-size:9px;color:var(--text3);width:12px;text-align:right;flex-shrink:0;}
.card-info-btn{position:absolute;bottom:10px;right:10px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:2;line-height:1;}
.card-info-btn:hover{background:rgba(255,255,255,.14);color:var(--text);border-color:var(--border-m);}
.fused-meta{margin-bottom:7px;}
.fused-gen-tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:3px;}
.fused-badge{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c-fused);background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.22);border-radius:5px;padding:2px 7px;display:inline-block;}

.hud{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--hud);background:rgba(7,7,16,.93);backdrop-filter:blur(20px);border-top:1px solid var(--border-m);display:flex;align-items:center;padding:0 24px;gap:16px;}
.hud::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.4) 30%,rgba(244,114,182,.4) 70%,transparent);}
.hud-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.hud-chips{flex:1;display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:120px;}
.hud-tools{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.hud-tools button{height:30px;padding:0 8px;font-size:11px;}
.hud-more-wrap{position:relative;}
.hud-more-btn{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.hud-more-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.hud-dropdown{position:absolute;bottom:calc(100% + 8px);right:0;background:var(--bg2);border:1px solid var(--border-m);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:150px;z-index:250;box-shadow:0 -4px 20px rgba(0,0,0,.4);animation:mdin .2s ease;}
.hud-dropdown button{width:100%;text-align:left;height:34px;padding:0 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.hud-dropdown button:hover{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--text);}

/* TUTORIAL */
.tut-overlay{position:fixed;inset:0;z-index:600;background:rgba(7,7,16,.96);display:flex;align-items:center;justify-content:center;padding:20px;animation:tutOverlayIn .5s ease;}
@keyframes tutOverlayIn{from{opacity:0}to{opacity:1}}
.tut-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:tutModalIn .5s cubic-bezier(.22,1,.36,1) .1s both;}
@keyframes tutModalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* TITLE SCREEN */
.title-screen{position:fixed;inset:0;z-index:9999;background:#07071a;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;}
.title-particles{position:absolute;inset:0;pointer-events:none;}
.title-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:0;animation:orbFloat linear infinite;}
@keyframes orbFloat{0%{opacity:0;transform:translateY(100vh) scale(.5)}20%{opacity:.6}80%{opacity:.6}100%{opacity:0;transform:translateY(-100vh) scale(1.2)}}
.title-content{position:relative;z-index:2;text-align:center;animation:titleIn 1.2s cubic-bezier(.22,1,.36,1) .3s both;}
@keyframes titleIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.title-icon{font-size:48px;margin-bottom:16px;animation:titlePulse 3s ease-in-out infinite;}
@keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 20px rgba(167,139,250,.4))}50%{filter:drop-shadow(0 0 40px rgba(244,114,182,.6))}}
.title-logo{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:.2em;line-height:1;background:linear-gradient(135deg,#fff 0%,#c084fc 40%,#f472b6 70%,#fbbf24 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.title-tagline{font-size:11px;font-weight:700;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:48px;}
.title-buttons{display:flex;flex-direction:column;gap:12px;align-items:center;animation:titleIn 1.2s cubic-bezier(.22,1,.36,1) .8s both;}
.title-btn{width:240px;height:48px;border-radius:12px;border:1px solid;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;letter-spacing:.04em;}
.title-btn.primary{background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(244,114,182,.12));border-color:rgba(167,139,250,.4);color:#e2d4f0;}
.title-btn.primary:hover{background:linear-gradient(135deg,rgba(167,139,250,.2),rgba(244,114,182,.2));border-color:rgba(167,139,250,.6);transform:translateY(-2px);box-shadow:0 4px 20px rgba(167,139,250,.2);}
.title-btn.secondary{background:transparent;border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.4);}
.title-btn.secondary:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7);transform:translateY(-1px);}
.title-version{position:absolute;bottom:20px;right:24px;font-size:10px;color:rgba(255,255,255,.15);letter-spacing:.1em;}
.title-credits{position:absolute;inset:0;z-index:3;background:rgba(7,7,26,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;animation:tutOverlayIn .4s ease;}
.title-credits-text{text-align:center;color:var(--text2);font-size:13px;line-height:2;max-width:400px;}
.tut-header{padding:20px 24px 0;flex-shrink:0;}
.tut-body{padding:20px 24px;flex:1;overflow-y:auto;min-height:0;}
.tut-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tut-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;background:linear-gradient(135deg,#fff 0%,#c084fc 50%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tut-subtitle{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.tut-text{font-size:13px;color:var(--text2);line-height:1.8;}
.tut-text strong{color:var(--text);font-weight:600;}
.tut-text .tut-key{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text);margin:0 2px;}
.tut-dots{display:flex;gap:6px;flex:1;justify-content:center;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .2s;}
.tut-dot.active{background:var(--gold);box-shadow:0 0 6px rgba(251,191,36,.4);}
.tut-nav-btn{height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.tut-nav-btn:hover{border-color:var(--border-m);color:var(--text);background:rgba(255,255,255,.03);}
.tut-nav-btn.primary{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#fbbf24;}
.tut-fade-in{animation:tutFade .25s ease;}
@keyframes tutFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hud-chips::-webkit-scrollbar{display:none;}
.hud-hint{font-size:12px;color:var(--text3);font-style:italic;white-space:nowrap;}
.sel-chip{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 13px 5px 9px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--text);cursor:pointer;transition:opacity .15s;}
.sel-chip:hover{opacity:.6;}
.chip-orb{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.fuse-btn{flex-shrink:0;padding:0 28px;height:48px;border-radius:var(--r-sm);border:1px solid var(--border-m);background:var(--bg3);color:var(--text3);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;cursor:not-allowed;display:flex;align-items:center;gap:10px;transition:all .3s;position:relative;overflow:hidden;white-space:nowrap;}
.fuse-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 60%);pointer-events:none;}
.fuse-btn:not(:disabled){cursor:pointer;color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--fuse-a,#a78bfa) 0%,var(--fuse-b,#f472b6) 100%);box-shadow:0 0 24px var(--fuse-glow,rgba(167,139,250,.5)),0 4px 16px rgba(0,0,0,.5);animation:fpulse 2s ease-in-out infinite;}
.fuse-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 0 65px var(--fuse-glow,rgba(167,139,250,.7)),0 8px 28px rgba(0,0,0,.5);}
.fuse-btn:not(:disabled):active{transform:scale(.97);}
@keyframes fpulse{0%,100%{box-shadow:0 0 24px var(--fuse-glow,rgba(167,139,250,.5)),0 4px 16px rgba(0,0,0,.5);}50%{box-shadow:0 0 40px var(--fuse-glow,rgba(167,139,250,.7)),0 4px 16px rgba(0,0,0,.5);}}
.hud-sep{width:1px;height:36px;background:var(--border);flex-shrink:0;}

.modal-backdrop{position:fixed;inset:0;z-index:300;background:rgba(7,7,16,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;animation:bdin .2s ease;}
@keyframes bdin{from{opacity:0}to{opacity:1}}
.result-modal{background:var(--bg2);border:1px solid var(--gold-bdr);border-radius:20px;padding:28px 32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;overflow-x:hidden;position:relative;animation:mdin .45s cubic-bezier(.34,1.56,.64,1);scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
.result-modal::-webkit-scrollbar{width:4px;}
.result-modal::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
@keyframes mdin{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.result-modal::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 130% 90% at 10% 0%,rgba(251,191,36,.08) 0%,transparent 55%),radial-gradient(ellipse 90% 110% at 90% 100%,rgba(192,132,252,.06) 0%,transparent 55%);}
.result-modal::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,.6),transparent);}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:1;}
.modal-close:hover{background:rgba(255,255,255,.12);color:var(--text);}
.result-badge{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-bdr);border-radius:6px;padding:3px 9px;display:inline-block;margin-bottom:14px;}
.result-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.08em;line-height:1.05;color:var(--text);margin-bottom:12px;text-shadow:0 0 30px rgba(251,191,36,.25);}
.result-desc{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:14px;}
.result-why{font-size:12px;color:var(--text3);line-height:1.65;border-left:2px solid var(--gold-bdr);padding-left:12px;font-style:italic;}
.result-why strong{color:rgba(251,191,36,.6);font-style:normal;font-weight:500;}
.result-from{font-size:11px;color:var(--text3);margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}

/* REACTION BANNER */
.reaction-banner{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.28);border-radius:12px;padding:14px 16px;margin:14px 0;position:relative;overflow:hidden;}
.reaction-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,.7),transparent);}
.reaction-label{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.reaction-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--text);margin-bottom:5px;}
.reaction-desc{font-size:12px;color:var(--text2);line-height:1.55;}
.reaction-unlock{font-size:11px;color:var(--gold);margin-top:8px;font-weight:500;}

/* INFO MODAL */
.info-backdrop{position:fixed;inset:0;z-index:300;background:rgba(7,7,16,.82);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:bdin .2s ease;}
.info-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:20px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:mdin .4s cubic-bezier(.34,1.56,.64,1);scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
.info-modal::-webkit-scrollbar{width:4px;}
.info-modal::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
.info-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.info-header::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 100% 120% at 0% 0%,rgba(var(--power-rgb,255,255,255),.08) 0%,transparent 60%);}
.info-header::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--power-color,#888);border-radius:20px 20px 0 0;}
.info-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:1;}
.info-close:hover{background:rgba(255,255,255,.14);color:var(--text);}
.info-icon{font-size:32px;margin-bottom:10px;display:block;filter:drop-shadow(0 0 10px var(--power-color));}
.info-badges{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.info-name{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.08em;line-height:1.05;color:var(--text);margin-bottom:6px;}
.info-tier-row{display:flex;align-items:center;gap:10px;margin-top:4px;}
.info-tier-badge{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;padding:4px 14px;border-radius:8px;border:1px solid transparent;}
.info-pl{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--text2);}
.info-body{padding:20px 28px 24px;display:flex;flex-direction:column;gap:18px;}
.info-section-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.info-desc{font-size:13px;color:var(--text2);line-height:1.75;}
.info-reason{font-size:12px;color:var(--text3);line-height:1.6;border-left:2px solid rgba(var(--power-rgb,255,255,255),.15);padding-left:12px;font-style:italic;margin-top:10px;}
.info-reason strong{color:var(--power-color);font-style:normal;opacity:.8;}

.stat-rows{display:flex;flex-direction:column;gap:9px;}
.stat-row{display:flex;align-items:center;gap:10px;}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text2);width:80px;flex-shrink:0;}
.stat-track{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.stat-fill{height:100%;border-radius:3px;background:var(--power-color,#888);width:0;animation:statGrow .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes statGrow{to{width:var(--w,0%);}}
.stat-val{font-size:12px;font-weight:500;color:var(--text);width:18px;text-align:right;flex-shrink:0;}

/* TAG PILLS */
.tag-pills{display:flex;flex-wrap:wrap;gap:6px;}
.tag-pill{font-size:11px;letter-spacing:.02em;padding:4px 10px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:5px;}
.tag-dots{font-size:8px;opacity:.7;letter-spacing:1px;}
.tag-pill.legendary{font-weight:700;letter-spacing:.04em;}

/* ELITE POTENTIAL */
.ep-section{display:flex;flex-direction:column;gap:8px;}
.ep-top{display:flex;align-items:center;justify-content:space-between;}
.ep-diamonds{font-size:16px;letter-spacing:3px;}
.ep-unrealized{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.ep-track{height:8px;background:rgba(255,255,255,.06);border-radius:4px;position:relative;overflow:hidden;}
.ep-ceiling{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:rgba(251,191,36,.22);transition:width .6s ease;}
.ep-current{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:var(--power-color);opacity:.85;transition:width .6s ease;}
.ep-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);}
.ep-note{font-size:11px;color:var(--text3);font-style:italic;}

/* LEGENDARY CALLOUT */
.legendary-callout{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:10px;padding:12px 14px;}
.legendary-callout-header{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#ffd700;margin-bottom:8px;}
.legendary-tag-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid rgba(255,215,0,.1);}
.legendary-tag-row:first-child{border-top:none;}
.legendary-tag-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:#ffd700;white-space:nowrap;}
.legendary-tag-desc{font-size:11px;color:var(--text2);line-height:1.4;}

.ancestry-chips{display:flex;flex-wrap:wrap;gap:7px;}
.ancestry-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:4px 11px 4px 8px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:var(--text2);}
.ancestry-orb{width:7px;height:7px;border-radius:50%;}
.compat-list{display:flex;flex-wrap:wrap;gap:7px;}
.compat-chip{font-size:11px;color:var(--text2);padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.compat-chip:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.info-footer{padding:0 28px 24px;display:flex;gap:10px;}
.info-add-btn{flex:1;padding:11px 20px;border-radius:var(--r-sm);border:none;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.12em;cursor:pointer;transition:all .25s;}
.info-add-btn.add{background:var(--power-color);color:#000;}
.info-add-btn.add:hover{filter:brightness(1.1);}
.info-add-btn.remove{background:rgba(255,255,255,.06);border:1px solid var(--border-m);color:var(--text2);}
.info-add-btn.remove:hover{background:rgba(255,255,255,.1);}
.info-close-btn{padding:11px 18px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
.info-close-btn:hover{border-color:var(--border-m);color:var(--text);}

.converge-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(7,7,16,.96);animation:cfade .85s ease forwards;pointer-events:none;}
@keyframes cfade{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.converge-text{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:.18em;line-height:1;text-align:center;background:linear-gradient(135deg,#fff 0%,#c084fc 50%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:cscale .85s cubic-bezier(.34,1.56,.64,1);}
.converge-sub{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--text3);margin-top:10px;text-align:center;}
@keyframes cscale{0%{opacity:0;transform:scale(.4) translateY(10px)}60%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
/* TAG TOOLTIP */
#tag-tooltip{
  position:fixed;z-index:9999;pointer-events:none;
  max-width:260px;padding:10px 13px;
  background:#0a0a1e;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);
  opacity:0;transform:translateY(4px);
  transition:opacity .12s ease,transform .12s ease;
}
#tag-tooltip.visible{opacity:1;transform:translateY(0);}
#tag-tooltip .tt-header{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
#tag-tooltip .tt-name{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;color:#fff;}
#tag-tooltip .tt-type{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid transparent;}
#tag-tooltip .tt-dots{font-size:10px;letter-spacing:2px;opacity:.7;}
#tag-tooltip .tt-desc{font-size:12px;color:rgba(238,238,248,.7);line-height:1.55;}
#tag-tooltip .tt-meta{display:flex;gap:8px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.07);}
#tag-tooltip .tt-chip{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(238,238,248,.4);padding:2px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.07);}

/* QUALITY SCORE */
.quality-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.quality-grade{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.1em;line-height:1;padding:4px 14px;border-radius:8px;border:1px solid transparent;flex-shrink:0;}
.quality-grade.qs{color:#c084fc;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.3);}
.quality-grade.qa{color:#38bdf8;background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3);}
.quality-grade.qb{color:#4ade80;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3);}
.quality-grade.qc{color:#94a3b8;background:rgba(148,163,184,.12);border-color:rgba(148,163,184,.3);}
.quality-grade.qd{color:#f87171;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3);}
.quality-info{flex:1;min-width:0;}
.quality-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;}
.quality-bar-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.quality-bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.quality-desc{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.45;}

/* CODEX MODAL */
.codex-backdrop{position:fixed;inset:0;z-index:300;background:rgba(7,7,16,.88);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;animation:bdin .2s ease;}
.codex-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:20px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;position:relative;animation:mdin .4s cubic-bezier(.34,1.56,.64,1);}
.codex-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(192,132,252,.5),transparent);border-radius:20px 20px 0 0;}
.codex-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.codex-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.codex-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.1em;color:var(--text);}
.codex-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.codex-close:hover{background:rgba(255,255,255,.12);color:var(--text);}
.codex-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.codex-search{flex:1;min-width:160px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;}
.codex-search::placeholder{color:var(--text3);}
.codex-search:focus{outline:none;border-color:var(--border-m);}
.codex-filter-btn{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.codex-filter-btn:hover{border-color:var(--border-m);color:var(--text2);}
.codex-filter-btn.active{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.codex-body{flex:1;overflow-y:auto;padding:8px 16px 16px;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
.codex-body::-webkit-scrollbar{width:4px;}
.codex-body::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
.codex-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:13px;font-style:italic;}
.codex-entry{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);margin-bottom:8px;transition:background .15s,border-color .15s;position:relative;overflow:hidden;}
.codex-entry::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--entry-color,#888);border-radius:12px 0 0 12px;}
.codex-entry:hover{background:var(--card-h);border-color:var(--border-m);}
.codex-icon{font-size:22px;flex-shrink:0;width:36px;text-align:center;filter:drop-shadow(0 0 6px var(--entry-color,#888));}
.codex-info{flex:1;min-width:0;}
.codex-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.codex-meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.codex-pl{font-size:10px;color:var(--text3);letter-spacing:.04em;}
.codex-desc{font-size:11px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.codex-view-btn{flex-shrink:0;padding:6px 14px;border-radius:8px;border:1px solid var(--border-m);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.codex-view-btn:hover{border-color:var(--entry-color,#888);color:var(--text);background:rgba(255,255,255,.05);}
.codex-footer{padding:12px 24px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.codex-count{font-size:11px;color:var(--text3);}

/* CODEX HUD BUTTON */
.codex-hud-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.codex-hud-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.codex-hud-btn.has-entries{color:var(--c-fused);border-color:rgba(192,132,252,.3);}
.codex-hud-btn.has-entries:hover{background:rgba(192,132,252,.08);}

/* MUTANT TAGS */
.tag-pill.mutant{font-weight:600;letter-spacing:.03em;animation:mutantPulse 2.5s ease-in-out infinite;}
@keyframes mutantPulse{
  0%,100%{border-color:#f0abfc;box-shadow:0 0 5px rgba(240,171,252,.35);color:#f0abfc;}
  50%{border-color:#818cf8;box-shadow:0 0 12px rgba(240,171,252,.6);color:#c084fc;}
}
/* MUTATION BANNER */
.mutation-banner{background:rgba(240,171,252,.07);border:1px solid rgba(240,171,252,.28);border-radius:12px;padding:14px 16px;margin:14px 0;position:relative;overflow:hidden;}
.mutation-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,171,252,.7),transparent);}
.mutation-label{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#f0abfc;margin-bottom:5px;}
.mutation-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--text);margin-bottom:5px;}
.mutation-detail{font-size:12px;color:var(--text2);line-height:1.55;}
.mutation-annihilated{font-size:11px;color:rgba(240,171,252,.7);margin-top:6px;font-weight:500;}

/* ECOSYSTEM BLEED */
.ecosystem-banner{background:rgba(34,211,238,.05);border:1px solid rgba(34,211,238,.22);border-radius:12px;padding:14px 16px;margin:14px 0;position:relative;overflow:hidden;}
.ecosystem-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);}
.ecosystem-label{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#22d3ee;margin-bottom:5px;}
.ecosystem-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.1em;color:var(--text);margin-bottom:5px;}
.ecosystem-detail{font-size:12px;color:var(--text2);line-height:1.55;}
.ecosystem-source{font-size:11px;color:rgba(34,211,238,.6);margin-top:6px;font-weight:500;}
/* MUTANT CALLOUT in info modal */
.mutant-callout{background:rgba(240,171,252,.07);border:1px solid rgba(240,171,252,.25);border-radius:10px;padding:12px 14px;}
.mutant-callout-header{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#f0abfc;margin-bottom:8px;}
.mutant-tag-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid rgba(240,171,252,.1);}
.mutant-tag-row:first-child{border-top:none;}
.mutant-tag-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:#f0abfc;white-space:nowrap;}
.mutant-tag-origin{font-size:11px;color:var(--text3);line-height:1.4;}
.mutant-tag-desc{font-size:11px;color:var(--text2);line-height:1.4;margin-top:2px;}

/* ═══ SYSTEM 1: RESONANCE SCORING ═══ */
.resonance-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.18);border-radius:10px;}
.resonance-ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(99,102,241,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
.resonance-ring::before{content:'';position:absolute;inset:2px;border-radius:50%;background:conic-gradient(from 0deg,rgba(99,102,241,.3) var(--res-pct,0%),transparent var(--res-pct,0%));opacity:.6;}
.resonance-pct{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:#818cf8;position:relative;z-index:1;}
.resonance-info{flex:1;min-width:0;}
.resonance-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;}
.resonance-links{font-size:11px;color:var(--text3);line-height:1.45;}
.resonance-row.harmonic{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);}
.resonance-row.harmonic .resonance-ring{border-color:rgba(251,191,36,.5);}
.resonance-row.harmonic .resonance-ring::before{background:conic-gradient(from 0deg,rgba(251,191,36,.5) var(--res-pct,0%),transparent var(--res-pct,0%));}
.resonance-row.harmonic .resonance-pct{color:#fbbf24;}
.harmonic-banner{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);border-radius:5px;padding:2px 8px;display:inline-block;margin-left:8px;}

/* ═══ SYSTEM 2: FUSION MODE SELECTOR ═══ */
.mode-group{display:flex;gap:4px;flex-shrink:0;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:3px;}
.mode-btn{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.2;}
.mode-btn:hover{color:var(--text2);background:rgba(255,255,255,.04);}
.mode-btn.active-mode{color:#fff;font-weight:600;}
.mode-btn.active-mode[data-mode="aggressive"]{background:rgba(248,113,113,.2);color:#f87171;box-shadow:0 0 10px rgba(248,113,113,.15);}
.mode-btn.active-mode[data-mode="balanced"]{background:rgba(167,139,250,.2);color:#a78bfa;box-shadow:0 0 10px rgba(167,139,250,.15);}
.mode-btn.active-mode[data-mode="precise"]{background:rgba(56,189,248,.2);color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.15);}
.mode-indicator{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:2px;text-align:center;}

/* ═══ SYSTEM 3: AWAKENING ═══ */
.power-card.awakened{box-shadow:0 0 0 1px rgba(251,191,36,.15);}
.power-card.awakened::before{background:linear-gradient(90deg,var(--power-color),#fbbf24,var(--power-color))!important;animation:awakenBar 3s linear infinite!important;opacity:1!important;}

.power-card.grade-s{box-shadow:0 0 12px rgba(192,132,252,.2),0 0 0 1px rgba(192,132,252,.25);}
.power-card.grade-s .card-name::after{content:' ★';color:#c084fc;font-size:10px;}
@keyframes awakenBar{0%{background-position:0% 0}100%{background-position:200% 0}}
.power-card.awakened::before{background-size:200% 100%;}
.awakened-badge{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:4px;padding:2px 6px;display:inline-block;animation:awakenPulse 2.5s ease-in-out infinite;}
@keyframes awakenPulse{0%,100%{opacity:.8;text-shadow:none}50%{opacity:1;text-shadow:0 0 8px rgba(251,191,36,.5)}}
.awaken-btn{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.08);color:#fbbf24;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.12em;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.awaken-btn:hover{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.5);box-shadow:0 0 24px rgba(251,191,36,.2);transform:translateY(-1px);}
.awaken-btn:active{transform:scale(.98);}
.awaken-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.awaken-section{margin-top:4px;padding:14px;background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:12px;}
.awaken-section .info-section-label{color:rgba(251,191,36,.6);}
.awaken-result{font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px;}
.awaken-result strong{color:#fbbf24;font-weight:600;}

/* ═══ SYSTEM 4: TAG EVOLUTION ═══ */
.tag-pill.evolved{position:relative;font-weight:600;}
.tag-pill.evolved::after{content:'⬆';font-size:7px;margin-left:3px;opacity:.7;}
.evolved-callout{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:12px 14px;}
.evolved-callout-header{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#34d399;margin-bottom:8px;}
.evolved-tag-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid rgba(52,211,153,.1);}
.evolved-tag-row:first-child{border-top:none;}
.evolved-tag-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:#34d399;white-space:nowrap;}
.evolved-tag-detail{font-size:11px;color:var(--text2);line-height:1.4;}

/* ═══ SYSTEM 5: LINEAGE TREE ═══ */
.lineage-tree{display:flex;flex-direction:column;gap:2px;font-size:12px;}
.lineage-node{display:flex;align-items:center;gap:6px;padding:4px 0 4px calc(var(--depth,0) * 18px);position:relative;}
.lineage-node::before{content:'';position:absolute;left:calc(var(--depth,0) * 18px - 12px);top:0;bottom:50%;width:1px;border-left:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);width:8px;height:50%;}
.lineage-node[style*="--depth:0"]::before,.lineage-node[style*="--depth: 0"]::before{display:none;}
.lineage-orb{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lineage-name{color:var(--text2);font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:color .15s;}
.lineage-name:hover{color:var(--text);}
.lineage-gen{font-size:9px;color:var(--text3);letter-spacing:.06em;padding:1px 5px;border:1px solid var(--border);border-radius:3px;margin-left:4px;}
.lineage-base{font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;opacity:.6;}


/* ═══ INSTABILITY SYSTEM ═══ */
.power-card.unstable-low{animation:unstableLow 3s ease-in-out infinite;outline-offset:-1px;}
.power-card.unstable-high{animation:unstableHigh 1.4s ease-in-out infinite;outline-offset:-1px;}
.power-card.unstable-critical{animation:unstableCrit 0.8s ease-in-out infinite;outline-offset:-2px;}
@keyframes unstableLow{0%,100%{outline:1px solid rgba(251,146,60,.2)}50%{outline:1px solid rgba(251,146,60,.5)}}
@keyframes unstableHigh{0%,100%{outline:1px solid rgba(248,113,113,.4)}50%{outline:2px solid rgba(248,113,113,.8)}}
@keyframes unstableCrit{0%,100%{outline:1px solid rgba(248,113,113,.6)}33%{outline:2px solid rgba(248,113,113,.9)}66%{outline:1px solid rgba(240,171,252,.7)}}
.instability-bar-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:4px;}
.instability-bar-fill{height:100%;border-radius:2px;transition:width .6s ease;}

/* ═══ GENERATED ABILITIES ═══ */
.abilities-grid{display:flex;flex-direction:column;gap:8px;}
.ability-card{position:relative;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:hidden;transition:border-color .15s,background .15s;}
.ability-card:hover{background:rgba(255,255,255,.045);border-color:var(--border-m);}
.ability-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ab-color,#888);border-radius:10px 0 0 10px;opacity:.6;}
.ability-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.ability-name{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--text);}
.ability-type-badge{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid;flex-shrink:0;}
.ability-type-badge.ab-offensive{color:#f87171;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25);}
.ability-type-badge.ab-defensive{color:#38bdf8;background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.25);}
.ability-type-badge.ab-utility{color:#a78bfa;background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.25);}
.ability-type-badge.ab-passive{color:#4ade80;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.25);}
.ability-desc{font-size:11px;color:var(--text2);line-height:1.55;}
.ability-tag-row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.ability-tag-chip{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text3);}
.ability-cost{font-size:9px;letter-spacing:.06em;color:var(--text3);margin-left:auto;padding-left:8px;white-space:nowrap;}
.ability-cost.cost-light{color:#4ade80;}
.ability-cost.cost-medium{color:#fbbf24;}
.ability-cost.cost-heavy{color:#f87171;}

/* Signature technique */
.ability-card.ability-signature{background:rgba(251,191,36,.04);border-color:rgba(251,191,36,.2);}
.ability-card.ability-signature::before{background:linear-gradient(180deg,#fbbf24,#f472b6);opacity:1;}
.ability-card.ability-signature:hover{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35);}
.ability-card.ability-signature .ability-name{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.3);}
.ability-type-badge.ab-signature{color:#fbbf24;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);font-weight:700;}

/* Awakened technique */
.ability-card.ability-awakened{background:rgba(251,191,36,.03);border-color:rgba(251,191,36,.15);border-style:dashed;}
.ability-card.ability-awakened::before{background:#fbbf24;animation:awakenPulse 2.5s ease-in-out infinite;}
.ability-card.ability-awakened .ability-name{color:#e2c87a;}
.ability-type-badge.ab-awakened{color:#fbbf24;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25);}

/* Signature name on grid card */
.card-sig{font-size:9px;color:rgba(251,191,36,.6);letter-spacing:.03em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ═══ TECHNIQUE CODEX ═══ */
.tc-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:20px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;position:relative;animation:mdin .4s cubic-bezier(.34,1.56,.64,1);}
.tc-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(248,113,113,.4),rgba(251,191,36,.4),transparent);border-radius:20px 20px 0 0;}
.tc-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.tc-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.tc-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.1em;color:var(--text);}
.tc-analytics{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px;}
.tc-stat-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center;}
.tc-stat-num{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;line-height:1;display:block;}
.tc-stat-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:block;margin-top:2px;}
.tc-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tc-search{flex:1;min-width:140px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;}
.tc-search::placeholder{color:var(--text3);}
.tc-search:focus{outline:none;border-color:var(--border-m);}
.tc-body{flex:1;overflow-y:auto;padding:8px 16px 16px;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
.tc-body::-webkit-scrollbar{width:4px;}
.tc-body::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
.tc-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:13px;font-style:italic;}
.tc-group{margin-bottom:16px;}
.tc-group-header{display:flex;align-items:center;gap:8px;padding:6px 0;margin-bottom:6px;border-bottom:1px solid var(--border);}
.tc-group-icon{font-size:12px;flex-shrink:0;}
.tc-group-name{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--text);}
.tc-group-count{font-size:10px;color:var(--text3);margin-left:auto;}
.tc-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);margin-bottom:6px;transition:background .15s,border-color .15s;position:relative;overflow:hidden;cursor:pointer;}
.tc-entry:hover{background:var(--card-h);border-color:var(--border-m);}
.tc-entry::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc-color,#888);border-radius:10px 0 0 10px;}
.tc-entry-body{flex:1;min-width:0;}
.tc-entry-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
.tc-entry-name{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--text);}
.tc-entry-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.tc-entry-desc{font-size:11px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tc-entry-source{font-size:10px;color:var(--text3);margin-top:4px;display:flex;align-items:center;gap:5px;}
.tc-source-orb{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tc-footer{padding:12px 24px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.tc-footer-stat{font-size:11px;color:var(--text3);}
.tc-tag-freq{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tc-freq-chip{font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--text2);background:var(--card-bg);display:flex;align-items:center;gap:4px;}
.tc-freq-bar{width:32px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;display:inline-block;}
.tc-freq-fill{height:100%;border-radius:2px;background:var(--text2);}

/* Inherited technique */
.ability-card.ability-inherited{background:rgba(34,211,238,.03);border-color:rgba(34,211,238,.18);}
.ability-card.ability-inherited::before{background:linear-gradient(180deg,#22d3ee,#a78bfa);opacity:.8;}
.ability-card.ability-inherited:hover{background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.3);}
.ability-card.ability-inherited .ability-name{color:#67e8f9;}
.ability-type-badge.ab-inherited{color:#22d3ee;background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.25);}
.ability-lineage{font-size:10px;color:rgba(34,211,238,.5);margin-top:4px;font-style:italic;}

/* Evolved technique marker */
.ability-card.ability-evolved{box-shadow:inset 0 0 0 1px rgba(52,211,153,.1);}
.ability-evolved-pip{font-size:8px;color:#34d399;margin-left:5px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);}

/* Chamber preview button */
.preview-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.06em;cursor:pointer;transition:all .2s;display:none;align-items:center;gap:5px;white-space:nowrap;}
.preview-btn.visible{display:flex;}
.preview-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}

/* Preview modal */
.preview-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;position:relative;animation:mdin .35s cubic-bezier(.34,1.56,.64,1);scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;padding:24px;}
.preview-modal::-webkit-scrollbar{width:4px;}
.preview-modal::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
.preview-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.4),transparent);border-radius:16px 16px 0 0;}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.preview-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.1em;color:var(--text);}
.preview-sub{font-size:11px;color:var(--text3);margin-bottom:16px;line-height:1.5;}

/* ═══ ARCHETYPE SYSTEM ═══ */
.archetype-badge{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:8px;border:1px solid;cursor:default;}
.archetype-icon{font-size:14px;}
.archetype-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;}
.archetype-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:1px;}

/* ═══ CONVERGENCE EVENT ═══ */
.convergence-event{position:fixed;inset:0;z-index:600;background:rgba(7,7,16,.95);display:flex;align-items:center;justify-content:center;animation:bdin .3s ease;flex-direction:column;gap:0;}
.convergence-event-inner{max-width:620px;width:100%;padding:0 28px;text-align:center;}
.convergence-event-label{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin-bottom:16px;animation:fadeUp .6s .1s both;}
.convergence-event-name{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.1em;line-height:1;margin-bottom:16px;animation:fadeUp .6s .2s both;}
.convergence-event-desc{font-size:14px;line-height:1.75;margin-bottom:24px;animation:fadeUp .6s .3s both;color:rgba(238,238,248,.75);}
.convergence-event-effects{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px;animation:fadeUp .6s .4s both;}
.convergence-effect-chip{font-size:11px;padding:5px 13px;border-radius:999px;border:1px solid;font-weight:500;}
.convergence-dismiss{font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:10px 24px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(238,238,248,.5);font-family:'DM Sans',sans-serif;animation:fadeUp .6s .5s both;transition:all .2s;}
.convergence-dismiss:hover{color:var(--text);border-color:rgba(255,255,255,.35);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.convergence-log-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.convergence-log-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.convergence-log-btn.has-events{color:#fbbf24;border-color:rgba(251,191,36,.3);}

/* ═══ RESONANCE NETWORK ═══ */
.network-backdrop{position:fixed;inset:0;z-index:300;background:rgba(7,7,16,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;animation:bdin .2s ease;}
.network-modal{background:var(--bg2);border:1px solid var(--border-m);border-radius:20px;width:100%;max-width:880px;max-height:92vh;display:flex;flex-direction:column;animation:mdin .4s cubic-bezier(.34,1.56,.64,1);}
.network-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.network-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.1em;color:var(--text);}
.network-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.network-modes{display:flex;gap:6px;padding:8px 24px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.net-mode-btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.net-mode-btn:hover{border-color:var(--border-m);color:var(--text);}
.net-mode-btn.active{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4);color:#38bdf8;}
.network-body{flex:1;overflow:hidden;position:relative;}
#network-canvas{width:100%;height:100%;min-height:420px;display:block;}
.network-legend{padding:8px 24px;border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;flex-shrink:0;}
.net-leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);}
.net-dot{width:8px;height:8px;border-radius:50%;}
.net-line{width:18px;height:2px;border-radius:1px;}
.network-tooltip{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid var(--border-m);border-radius:10px;padding:10px 14px;font-size:11px;color:var(--text2);max-width:240px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.network-tooltip .tt-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--text);margin-bottom:4px;}
.network-tooltip .tt-gen{font-size:10px;color:var(--text3);}
.network-tooltip .tt-stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.network-tooltip .tt-stat{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.05);color:var(--text3);}
.network-tooltip .tt-tags{margin-top:6px;font-size:10px;color:var(--text3);line-height:1.5;}
.network-hud-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.network-hud-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.network-hud-btn.has-nodes{color:#38bdf8;border-color:rgba(56,189,248,.3);}

/* SAVE SYSTEM */
.save-group{display:flex;gap:6px;align-items:center;}
.save-btn{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.save-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.save-btn.danger:hover{border-color:rgba(248,113,113,.4);color:#f87171;background:rgba(248,113,113,.08);}
.save-indicator{font-size:10px;color:var(--text3);opacity:0;transition:opacity .3s;}
.save-indicator.visible{opacity:1;}
.save-toast{position:fixed;bottom:calc(var(--hud) + 16px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid rgba(74,222,128,.3);border-radius:10px;padding:10px 18px;font-size:13px;color:#4ade80;z-index:500;white-space:nowrap;animation:bdin .2s ease;pointer-events:none;}

/* HERO SYSTEM */
.hero-hud-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.hero-hud-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.hero-hud-btn.has-heroes{color:#fbbf24;border-color:rgba(251,191,36,.3);}
.hero-roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:4px 0;}
.hero-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.hero-card:hover{border-color:var(--border-m);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--hero-color,#888);opacity:.6;}
.hero-portrait{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--hero-color,#888);background:rgba(var(--hero-rgb,128,128,128),.1);margin-bottom:10px;}
.hero-alias{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:var(--text);line-height:1.2;}
.hero-realname{font-size:12px;color:var(--text3);margin-top:2px;}
.hero-traits{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.hero-trait{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text3);}
.hero-power-tag{font-size:10px;margin-top:8px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.hero-power-dot{width:6px;height:6px;border-radius:50%;}
.enlist-btn{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.08);color:#38bdf8;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.12em;cursor:pointer;transition:all .2s;margin-top:8px;}
.enlist-btn:hover{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.5);box-shadow:0 0 24px rgba(56,189,248,.2);transform:translateY(-1px);}
.hero-profile-header{display:flex;gap:20px;align-items:flex-start;margin-bottom:16px;}
.hero-profile-portrait{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.hero-profile-identity{flex:1;}
.hero-profile-alias{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;line-height:1.1;}
.hero-profile-name{font-size:13px;color:var(--text3);margin-top:3px;}
.hero-backstory{font-size:13px;color:var(--text2);line-height:1.7;margin:14px 0;padding:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;font-style:italic;}
.hero-section-label{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin:14px 0 8px;}

/* HERO PROFILE UPGRADE */
.hp-banner{position:relative;padding:28px 28px 20px;overflow:hidden;}
.hp-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(var(--hp-rgb),0.08) 0%,transparent 60%);pointer-events:none;}
.hp-banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--hp-rgb),.4),transparent);}
.hp-top{display:flex;gap:20px;align-items:flex-start;position:relative;z-index:1;}
.hp-portrait{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;border:3px solid var(--hp-color);background:rgba(var(--hp-rgb),.1);box-shadow:0 0 30px rgba(var(--hp-rgb),.15),inset 0 0 20px rgba(var(--hp-rgb),.05);}
.hp-identity{flex:1;min-width:0;}
.hp-alias{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.1em;line-height:1;color:var(--hp-color);}
.hp-name{font-size:13px;color:var(--text3);margin-top:4px;letter-spacing:.02em;}
.hp-family-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 10px;border-radius:5px;margin-top:8px;background:rgba(var(--hp-rgb),.08);border:1px solid rgba(var(--hp-rgb),.2);color:var(--hp-color);letter-spacing:.06em;font-weight:600;}
.hp-meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.hp-meta{font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);color:var(--text3);display:inline-flex;align-items:center;gap:4px;}
.hp-body{padding:20px 28px 24px;}
.hp-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;}
.hp-divider::before,.hp-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.hp-divider-label{font-size:9px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--text3);white-space:nowrap;}
.hp-backstory{font-size:13px;color:var(--text2);line-height:1.75;white-space:pre-line;border-left:2px solid rgba(var(--hp-rgb),.3);padding:14px 18px;background:rgba(255,255,255,.015);border-radius:0 10px 10px 0;}
.hp-psych-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hp-psych-card{padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.6;color:var(--text2);}
.hp-psych-card .hp-psych-title{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.hp-psych-drive{background:rgba(56,189,248,.04);border:1px solid rgba(56,189,248,.12);}
.hp-psych-drive .hp-psych-title{color:rgba(56,189,248,.7);}
.hp-psych-flaw{background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.12);}
.hp-psych-flaw .hp-psych-title{color:rgba(248,113,113,.7);}
.hp-stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.hp-stat{text-align:center;padding:10px 4px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border);}
.hp-stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.04em;line-height:1;}
.hp-stat-label{font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.hp-stat-bar{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden;}
.hp-stat-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.hp-tech-card{padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.015);margin-bottom:8px;transition:border-color .2s;}
.hp-tech-card:hover{border-color:var(--border-m);}
.hp-tech-card.sig{border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.03);}
.hp-tech-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.hp-tech-badge{font-size:8px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.06em;white-space:nowrap;}
.hp-tech-name{font-size:13px;color:var(--text);font-weight:500;}
.hp-tech-desc{font-size:11px;color:var(--text3);line-height:1.5;}
.hp-footer{display:flex;gap:10px;padding:16px 28px;border-top:1px solid var(--border);}
@media(max-width:700px){
  .hp-psych-grid{grid-template-columns:1fr;}
  .hp-stat-grid{grid-template-columns:repeat(3,1fr);}
  .hp-top{flex-direction:column;align-items:center;text-align:center;}
}

/* RELATIONSHIP WEB */
.rel-card{padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.015);margin-bottom:8px;cursor:pointer;transition:all .2s;}
.rel-card:hover{border-color:var(--border-m);background:rgba(255,255,255,.03);}
.rel-header{display:flex;align-items:center;gap:8px;}
.rel-type-badge{font-size:8px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:4px;white-space:nowrap;}
.rel-hero-name{font-size:13px;color:var(--text);font-weight:500;}
.rel-intensity{display:flex;gap:2px;margin-left:auto;}
.rel-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);}
.rel-dot.active{background:var(--rel-color,#888);}
.rel-narrative{font-size:11px;color:var(--text3);line-height:1.55;margin-top:6px;display:none;}
.rel-card.expanded .rel-narrative{display:block;}

/* POWER EVOLUTION */
.power-card.drained{opacity:.55;filter:saturate(.4);}
.power-card.drained::before{content:'DRAINED';position:absolute;top:6px;right:8px;font-size:7px;font-weight:700;letter-spacing:.12em;color:rgba(248,113,113,.6);z-index:2;}
.evo-source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0;}
.evo-source{padding:14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.evo-source:hover{border-color:var(--border-m);background:rgba(255,255,255,.04);transform:translateY(-1px);}
.evo-source.selected{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.06);}
.evo-source::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--src-color,#888);opacity:.5;}
.evo-preview{padding:16px;border-radius:12px;border:1px solid rgba(74,222,128,.2);background:rgba(74,222,128,.03);margin-top:14px;}
.evo-preview-title{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4ade80;margin-bottom:10px;}
.evo-change{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;}
.evo-change .gain{color:#4ade80;}
.evo-change .loss{color:#f87171;}
.evo-change .neutral{color:var(--text3);}
.evo-arc-bonus{margin-top:10px;padding:8px 12px;border-radius:8px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);font-size:11px;color:rgba(251,191,36,.8);}

/* WORLD EVENTS */
.we-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(7,7,16,.96);animation:bdin .4s ease forwards;}
.we-icon{font-size:64px;animation:cscale .85s cubic-bezier(.34,1.56,.64,1);}
.we-title{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.18em;line-height:1;text-align:center;background:linear-gradient(135deg,#fff 0%,#fbbf24 50%,#fb923c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:cscale .85s cubic-bezier(.34,1.56,.64,1);}
.we-subtitle{font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(251,191,36,.5);animation:bdin .6s ease .2s both;}
.we-narrative{font-size:14px;color:var(--text2);text-align:center;max-width:480px;line-height:1.7;animation:bdin .6s ease .4s both;}
.we-effect{font-size:11px;color:#4ade80;text-align:center;padding:6px 14px;border-radius:6px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.15);animation:bdin .6s ease .6s both;}
.we-log-card{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.015);margin-bottom:8px;}
.we-log-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.we-log-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--gold);}
.we-log-effect{font-size:10px;color:#4ade80;}

/* CRISIS PROMPTS */
.crisis-overlay{position:fixed;inset:0;z-index:550;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(7,7,16,.97);padding:20px;animation:crisisIn .6s ease forwards;}
@keyframes crisisIn{from{opacity:0}to{opacity:1}}
.crisis-badge{font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(248,113,113,.6);animation:crisisIn 1s ease forwards;}
.crisis-icon{font-size:56px;animation:cscale .85s cubic-bezier(.34,1.56,.64,1);}
.crisis-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:.14em;text-align:center;background:linear-gradient(135deg,#fff 0%,#f87171 50%,#fbbf24 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:crisisIn .8s ease forwards;}
.crisis-narrative{font-size:13px;color:var(--text2);text-align:center;max-width:500px;line-height:1.75;animation:crisisIn 1.2s ease forwards;}
.crisis-options{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;animation:crisisIn 1.6s ease forwards;}
.crisis-option{padding:14px 18px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;transition:all .25s;text-align:left;}
.crisis-option:hover{border-color:var(--border-m);background:rgba(255,255,255,.05);transform:translateY(-1px);}
.crisis-opt-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.crisis-opt-desc{font-size:11px;color:var(--text3);line-height:1.5;}
.crisis-opt-cost{font-size:10px;color:rgba(248,113,113,.7);margin-top:4px;}
.crisis-opt-gain{font-size:10px;color:rgba(74,222,128,.7);}
.crisis-result{text-align:center;padding:20px;animation:crisisIn .4s ease forwards;}
.crisis-result-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.08em;color:var(--gold);margin-bottom:8px;}
.crisis-result-text{font-size:12px;color:var(--text2);line-height:1.7;max-width:400px;margin:0 auto;}

/* ARENA */
.arena-pick-grid{display:grid;grid-template-columns:1fr 50px 1fr;gap:12px;align-items:center;margin:12px 0;}
.arena-slot{padding:20px 14px;border-radius:14px;border:2px dashed var(--border);background:rgba(255,255,255,.02);cursor:pointer;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.arena-slot:hover{border-color:var(--border-m);background:rgba(255,255,255,.04);}
.arena-slot.filled{border-style:solid;border-color:var(--slot-color,var(--border-m));}
.arena-vs{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text3);text-align:center;letter-spacing:.1em;}
.arena-mode-toggle{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:12px 0;}
.arena-mode-btn{flex:1;padding:8px 12px;font-size:11px;font-weight:600;background:transparent;color:var(--text3);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.arena-mode-btn.active{background:rgba(251,191,36,.1);color:#fbbf24;}
.arena-mode-btn:first-child.active{background:rgba(74,222,128,.1);color:#4ade80;}
.combat-log{padding:16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.015);max-height:50vh;overflow-y:auto;}
.combat-round{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text2);line-height:1.65;}
.combat-round:last-child{border-bottom:none;}
.combat-round.crit{color:#fbbf24;font-size:13px;line-height:1.7;}
.combat-round.sig{color:#f0abfc;font-size:13px;line-height:1.7;}
.combat-round.finisher{color:#4ade80;font-size:14px;line-height:1.8;font-weight:500;}
.combat-round.evade{color:var(--text3);font-style:italic;}
.combat-hp{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:10px;color:var(--text3);}
.combat-hp-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
.combat-hp-fill{height:100%;border-radius:2px;transition:width .3s;}
.arena-result{text-align:center;padding:20px;margin-top:12px;border-radius:14px;}
.arena-result.win-a{background:rgba(74,222,128,.04);border:1px solid rgba(74,222,128,.15);}
.arena-result.win-b{background:rgba(56,189,248,.04);border:1px solid rgba(56,189,248,.15);}
.arena-winner{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.1em;}
.arena-record{font-size:10px;color:var(--text3);margin-top:4px;}

/* TEAM SYSTEM */
.team-card{padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.015);margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.team-card:hover{border-color:var(--border-m);background:rgba(255,255,255,.03);}
.team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--t1,#888),var(--t2,#888),var(--t3,#888));}
.team-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;}
.team-members{display:flex;gap:8px;margin:8px 0;}
.team-member{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.02);}
.team-chem{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:4px;}
.team-chem-s{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2);}
.team-chem-a{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);}
.team-chem-b{background:rgba(56,189,248,.1);color:#38bdf8;border:1px solid rgba(56,189,248,.2);}
.team-chem-c{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2);}
.team-chem-d{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2);}
.team-chem-breakdown{font-size:10px;color:var(--text3);line-height:1.8;margin-top:8px;}
.team-chem-line{display:flex;align-items:center;justify-content:space-between;}
.team-slot{width:100%;padding:16px;border-radius:10px;border:2px dashed var(--border);text-align:center;cursor:pointer;font-size:11px;color:var(--text3);transition:all .2s;}
.team-slot:hover{border-color:var(--border-m);background:rgba(255,255,255,.03);}
.team-slot.filled{border-style:solid;border-color:var(--slot-color,var(--border));}

/* ENCOUNTER SYSTEM */
.enc-hud-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.enc-hud-btn:hover{border-color:var(--border-m);color:var(--text);background:var(--card-h);}
.enc-hud-btn.has-encounters{color:#f0abfc;border-color:rgba(240,171,252,.3);}
.enc-select-grid{display:grid;grid-template-columns:1fr 60px 1fr;gap:16px;align-items:center;margin-bottom:16px;}
.enc-hero-pick{padding:14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;text-align:center;transition:all .2s;}
