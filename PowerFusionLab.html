// ═══ SYSTEM 1: RESONANCE SCORING ═══
function computeResonance(parents){
  const links=[];
  for(let i=0;i<parents.length;i++){
    for(let j=i+1;j<parents.length;j++){
      const tagsA=parents[i].tags||[];
      const tagsB=parents[j].tags||[];
      for(const tA of tagsA){
        const defA=TAG_DEFS[tA]||LEGENDARY_TAGS[tA]||MUTANT_TAGS[tA];
        if(!defA?.resonates)continue;
        for(const tB of tagsB){
          if(defA.resonates.includes(tB)){
            links.push({from:tA,to:tB,source:parents[i].name,target:parents[j].name});
          }
        }
      }
      // reverse direction
      for(const tB of tagsB){
        const defB=TAG_DEFS[tB]||LEGENDARY_TAGS[tB]||MUTANT_TAGS[tB];
        if(!defB?.resonates)continue;
        for(const tA of tagsA){
          if(defB.resonates.includes(tA)&&!links.some(l=>l.from===tB&&l.to===tA)){
            links.push({from:tB,to:tA,source:parents[j].name,target:parents[i].name});
          }
        }
      }
    }
  }
  // Deduplicate bidirectional links
  const seen=new Set();
  const unique=links.filter(l=>{
    const k=[l.from,l.to].sort().join('↔');
    if(seen.has(k))return false;
    seen.add(k);return true;
  });
  const allTags=new Set(parents.flatMap(p=>p.tags||[]));
  const maxPossible=Math.max(allTags.size*2,1);
  const pct=Math.min(100,Math.round((unique.length/maxPossible)*100));
  const isHarmonic=pct>=70;
  return{links:unique,pct,isHarmonic,bonusStat:isHarmonic?1:0};
}

function canAwaken(power){
  if(power.gen<1)return false;
  if(computeEP(power)<AWAKENING_EP_THRESHOLD)return false;
  // Double awakening: Life Surge allows a second awakening
  if(power.awakened&&!DOUBLE_AWAKENING)return false;
  if(power.awakened&&power.doubleAwakened)return false;
  return true;
}

function awakenPower(id){
  const p=powers.find(x=>x.id===id);
  if(!p||!canAwaken(p))return;
  const isDouble=p.awakened&&DOUBLE_AWAKENING;
  // Boost one random stat by +1
  const boostable=STAT_KEYS.filter(k=>(p.stats[k]||0)<10);
  const boosted=boostable.length?boostable[Math.floor(Math.random()*boostable.length)]:null;
  if(boosted)p.stats[boosted]=Math.min(10,(p.stats[boosted]||0)+1);
  // Add a resonant tag the power doesn't already have
  const existing=new Set(p.tags||[]);
  const candidates=[];
  for(const t of existing){
    const def=TAG_DEFS[t]||LEGENDARY_TAGS[t]||MUTANT_TAGS[t];
    if(def?.resonates){
      for(const r of def.resonates){
        if(!existing.has(r)&&(TAG_DEFS[r]||LEGENDARY_TAGS[r]))candidates.push(r);
      }
    }
  }
  const unique=[...new Set(candidates)];
  const newTag=unique.length?unique[Math.floor(Math.random()*unique.length)]:null;
  if(newTag)p.tags.push(newTag);
  if(isDouble){
    p.doubleAwakened=true;
    p.awakened2Stat=boosted?STAT_NAMES[boosted]:null;
    p.awakened2Tag=newTag;
  } else {
    p.awakened=true;
    p.awakenedStat=boosted?STAT_NAMES[boosted]:null;
    p.awakenedTag=newTag;
  }
  invalidateAbilityCache(id);
  updateCard(id);
  renderHUD();updateStats();
  closeInfo();
  setTimeout(()=>openInfo(id),20);
  autoSave();
}

// Surgical single-card DOM update — rebuilds only the specified card in-place
function updateCard(id){
  const p=powers.find(x=>x.id===id);
  if(!p)return;
  const card=document.querySelector(`.power-card[data-id="${id}"]`);
  if(!card){renderGrid();return;}
  const tmp=document.createElement('div');
  tmp.innerHTML=buildCardHTML(p);
  card.replaceWith(tmp.firstElementChild);
}

// ═══ SYSTEM 4: TAG EVOLUTION ═══
function computeEvolvedTags(parents,tagPool){
  if(parents.length<2)return{pool:tagPool,evolved:[]};
  const tagSets=parents.map(p=>new Set(p.tags||[]));
  const shared=[];
  for(const tag of tagPool){
    // Normal: tag must appear in ALL parents
    if(tagSets.every(s=>s.has(tag))){shared.push(tag);continue;}
    // Temporal Ascension boost: temporal-family tags evolve if in ANY parent
    if(TEMPORAL_EVO_BOOST&&TAG_FAMILIES.temporal.tags.has(tag)&&tagSets.some(s=>s.has(tag))){
      shared.push(tag);
    }
  }
  const evolved=[];
  for(const tag of shared){
    const def=TAG_DEFS[tag]||LEGENDARY_TAGS[tag];
    if(def&&def.intensity<3){
      evolved.push({tag,from:def.intensity,to:Math.min(3,def.intensity+1)});
    }
  }
  return{pool:tagPool,evolved};
}

// ═══ SYSTEM 5: LINEAGE TREE ═══
function buildLineage(powerId,depth=0,maxDepth=6){
  const p=powers.find(x=>x.id===powerId);
  if(!p||depth>maxDepth)return'';
  const isBase=p.gen===0;
  const genLabel=isBase?`<span class="lineage-base">base</span>`:`<span class="lineage-gen">Gen ${p.gen}</span>`;
  let html=`<div class="lineage-node" style="--depth:${depth}">
    <span class="lineage-orb" style="background:${p.color};box-shadow:0 0 4px ${p.color}"></span>
    <span class="lineage-name" onclick="closeInfo();setTimeout(()=>openInfo('${p.id}'),20)">${p.icon} ${p.name}</span>
    ${genLabel}
    ${p.awakened?'<span class="awakened-badge" style="font-size:7px;padding:1px 4px">AWK</span>':''}
  </div>`;
  if(p.parentIds&&depth<maxDepth){
    for(const pid of p.parentIds){
      html+=buildLineage(pid,depth+1,maxDepth);
    }
  }
  return html;
}

function getMutantOpposition(parentA,parentB){
  if(Math.random()>0.35)return{polarity:'neutral',opposes:null};
  const poolA=MUTANT_OPPOSES_MAP[parentA]||[];
  const poolB=MUTANT_OPPOSES_MAP[parentB]||[];
  const combined=[...new Set([...poolA,...poolB])].filter(t=>t!==parentA&&t!==parentB&&(TAG_DEFS[t]||LEGENDARY_TAGS[t]));
  if(!combined.length)return{polarity:'neutral',opposes:null};
  const opposes=combined[Math.floor(Math.random()*combined.length)];
  const opposeDef=TAG_DEFS[opposes];
  const polarity=opposeDef?.polarity==='positive'?'negative':opposeDef?.polarity==='negative'?'positive':'neutral';
  return{polarity,opposes};
}

function birthMutantTag(tagA,tagB){
  const allDefs={...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  const defA=allDefs[tagA]||{intensity:1,stat:'vrs',resonates:[]};
  const defB=allDefs[tagB]||{intensity:1,stat:'vrs',resonates:[]};
  const id=`mutant_${mutantCount++}`;
  const name=generateMutantName(tagA,tagB);
  const intensity=Math.min(3,Math.round((defA.intensity+defB.intensity)/2)+1);
  const stat=defA.intensity>=defB.intensity?(defA.stat||'vrs'):(defB.stat||'vrs');
  const resonates=[...new Set([...(defA.resonates||[]),...(defB.resonates||[])])].slice(0,4);
  const descFn=MUTANT_DESC[Math.floor(Math.random()*MUTANT_DESC.length)];
  const {polarity,opposes}=getMutantOpposition(tagA,tagB);
  const tag={type:'Mutant',intensity,polarity,opposes,stat,resonates,
    desc:descFn(tagA,tagB,name),parents:[tagA,tagB],name};
  MUTANT_TAGS[id]=tag;
  return{id,...tag};
}

// Scans tagPool for opposing pairs, rolls mutation chance, mutates pool in-place.
// Returns array of born mutant objects (max 1 per fusion).
function applyTagMutations(tagPool,gen){
  const allDefs={...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  for(let i=0;i<tagPool.length;i++){
    for(let j=i+1;j<tagPool.length;j++){
      const a=tagPool[i],b=tagPool[j];
      const defA=allDefs[a],defB=allDefs[b];
      if(!defA||!defB)continue;
      if(defA.opposes===b||defB.opposes===a){
        let chance=Math.min(0.60,0.30+(gen*0.05));
        // The Great Conflict: life↔entropy pairs get boosted chance
        if(LIFE_ENTROPY_BOOST){
          const pair=new Set([a,b]);
          if((pair.has('life')&&pair.has('entropy'))||(pair.has('growth')&&pair.has('entropy'))||(pair.has('life')&&pair.has('destruction')))chance=0.50;
        }
        if(Math.random()<chance){
          const ia=tagPool.indexOf(a); if(ia!==-1)tagPool.splice(ia,1);
          const ib=tagPool.indexOf(b); if(ib!==-1)tagPool.splice(ib,1);
          const mutant=birthMutantTag(a,b);
          tagPool.unshift(mutant.id);
          return[mutant];
        }
      }
    }
  }
  return[];
}

  const def=TAG_DEFS[tag]||LEGENDARY_TAGS[tag]||MUTANT_TAGS[tag];
  if(!def)return'offensive';
  const s=def.stat;
  if(s==='pow')return'offensive';
  if(s==='dur')return'defensive';
  if(s==='ctl')return'utility';
  if(s==='rng')return'utility';
  if(s==='vrs')return'passive';
  return'offensive';
}

function tagToAbilityCost(tags){
  const allDefs=tags.map(t=>TAG_DEFS[t]||LEGENDARY_TAGS[t]||MUTANT_TAGS[t]).filter(Boolean);
  const avgIntensity=allDefs.reduce((s,d)=>s+(d.intensity||1),0)/Math.max(allDefs.length,1);
  if(avgIntensity>=2.5)return{label:'Heavy',cls:'cost-heavy'};
  if(avgIntensity>=1.5)return{label:'Medium',cls:'cost-medium'};
  return{label:'Light',cls:'cost-light'};
}

function getTechTier(power){
  if((power.gen||0)>=2)return{tier:3,label:'III',prefix:'True ',descBoost:'absolute'};
  if((power.gen||0)>=1)return{tier:2,label:'II',prefix:'Greater ',descBoost:'devastating'};
  return{tier:1,label:'I',prefix:'',descBoost:'focused'};
}

const SIGNATURE_VERBS=['Absolute','Final','Omega','Supreme','Ultimate','Total','Perfect','Infinite','Sovereign','Apex','Terminal','Transcendent','Primal','Unbound','Null'];
const SIGNATURE_NOUNS=['Dominion','Annihilation','Singularity','Horizon','Eclipse','Convergence','Genesis','Oblivion','Ascension','Paradox','Requiem','Zenith','Collapse','Reckoning','Commandment','Terminus','Revelation','Cataclysm'];
const SIGNATURE_DESC=[
  (name,t1,t2)=>`The full and unrestricted expression of this power's core identity. ${name} channels every principle — ${t1}${t2?', '+t2:''} — into a single act that redefines what the power is capable of. There is no higher gear.`,
  (name,t1,t2)=>`Not a technique so much as a state of total commitment. ${name} unleashes ${t1}${t2?' and '+t2:''} without restraint or reservation. The cost is absolute. The result is absolute.`,
  (name,t1,t2)=>`${name} exists at the theoretical ceiling of ${t1}${t2?'/'+t2:''} output. Activating it means accepting that nothing held back could have been enough — and that everything held back might not be either.`,
  (name,t1,t2)=>`The culmination of every fusion, every evolution, every mutation that built this power. ${name} draws on the full lineage — ${t1}${t2?', '+t2:''}, and everything between — compressed into a single devastating expression.`,
];

// ── AWAKENED TECHNIQUE TEMPLATES ───────────────────────────────────────────
const AWAKENED_DESC=[
  (name,tag)=>`Unlocked through awakening, ${name} channels ${tag} essence in a way the power's original architecture never anticipated. The technique operates outside the system's designed constraints.`,
  (name,tag)=>`${name} emerged when the power's dormant ${tag} potential was forcibly activated. It draws from a deeper well than the standard technique set — a capability the power didn't know it had until awakening broke the seal.`,
  (name,tag)=>`A technique born from awakening's disruption. ${name} harnesses ${tag} through pathways that only exist because the power's internal limits were shattered. Unstable but undeniable.`,
];

// ── INHERITED TECHNIQUE TEMPLATES ──────────────────────────────────────────
const INHERITED_VERBS=['Remnant','Echo','Legacy','Vestige','Ghost','Scion','Heir','Shadow','Trace','Descendant'];
const INHERITED_DESC=[
  (name,parentName,sigName,tag)=>`${name} is not original to this power — it is a descendant of ${parentName}'s ${sigName}, refracted through a new ${tag} lens. The lineage is unmistakable. The execution is different.`,
  (name,parentName,sigName,tag)=>`Inherited from ${parentName}. The original ${sigName} expressed through ${tag} substrate produces ${name} — a technique that carries its ancestor's weight but speaks in a new voice.`,
  (name,parentName,sigName,tag)=>`The ghost of ${parentName}'s ${sigName} lives in this technique. ${name} channels ${tag} through patterns it did not invent — patterns it was born carrying. Lineage is destiny.`,
];

const _abilityCache=new Map();
function invalidateAbilityCache(powerId){if(powerId)_abilityCache.delete(powerId);else _abilityCache.clear();}

function generateAbilities(power){
  const tags=power.tags||[];
  if(tags.length<2)return[];
  const id=power.id;
  // Cache key: id + tag count + awakened state + quality (all inputs that affect output)
  const cacheKey=id+'_'+tags.length+'_'+(power.awakened?'a':'')+(power.doubleAwakened?'d':'')+(power.qualityGrade||'');
  if(_abilityCache.has(cacheKey))return _abilityCache.get(cacheKey);

  const techTier=getTechTier(power);
  const seed0=abilityHash(id+'_ab0');
  const seed1=abilityHash(id+'_ab1');
  const seed2=abilityHash(id+'_ab2');
  const seed3=abilityHash(id+'_ab3');
  const seeds=[seed0,seed1,seed2,seed3];
  const numBase=tags.length>=6?3:tags.length>=4?3:2;
  // Stellar Awakening: powers in bonus families get +1 technique
  const familyForBonus=detectFamily(tags);
  let numAbilities=BONUS_TECH_FAMILIES.has(familyForBonus)?Math.min(numBase+1,4):numBase;
  // Quality grade S: +1 bonus technique slot (max 4)
  if(power.qualityGrade==='S')numAbilities=Math.min(numAbilities+1,4);
  const evolvedTagSet=new Set((power.evolvedTags||[]).map(e=>e.tag));
  const mode=power.fuseMode||'balanced';

  // Partition tags into groups for each ability
  // Mode influences tag ordering → controls technique type distribution
  const shuffled=[...tags];
  // First: deterministic shuffle for variety
  for(let i=shuffled.length-1;i>0;i--){
    const j=abilityHash(id+'_shuf'+i)%(i+1);
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  // Then: mode-aware sort bias — stable sort preserves shuffle within same priority
  if(mode==='aggressive'){
    // POW-stat tags to front → more offensive techniques
    shuffled.sort((a,b)=>{
      const da=TAG_DEFS[a]||LEGENDARY_TAGS[a]||MUTANT_TAGS[a];
      const db=TAG_DEFS[b]||LEGENDARY_TAGS[b]||MUTANT_TAGS[b];
      const pa=da?.stat==='pow'?0:da?.stat==='rng'?1:2;
      const pb=db?.stat==='pow'?0:db?.stat==='rng'?1:2;
      return pa-pb;
    });
  } else if(mode==='precise'){
    // CTL/VRS-stat tags to front → more utility/passive techniques
    shuffled.sort((a,b)=>{
      const da=TAG_DEFS[a]||LEGENDARY_TAGS[a]||MUTANT_TAGS[a];
      const db=TAG_DEFS[b]||LEGENDARY_TAGS[b]||MUTANT_TAGS[b];
      const pa=da?.stat==='ctl'?0:da?.stat==='vrs'?1:2;
      const pb=db?.stat==='ctl'?0:db?.stat==='vrs'?1:2;
      return pa-pb;
    });
  } else {
    // Balanced: interleave tags from different stat groups → guaranteed type diversity
    const buckets={pow:[],rng:[],ctl:[],dur:[],vrs:[],other:[]};
    for(const t of shuffled){
      const def=TAG_DEFS[t]||LEGENDARY_TAGS[t]||MUTANT_TAGS[t];
      const s=def?.stat||'other';
      (buckets[s]||buckets.other).push(t);
    }
    const bucketOrder=['pow','ctl','vrs','dur','rng','other'];
    const interleaved=[];
    let idx=0,safety=0;
    while(interleaved.length<shuffled.length&&safety<100){
      const bk=bucketOrder[idx%bucketOrder.length];
      if(buckets[bk].length)interleaved.push(buckets[bk].shift());
      idx++;safety++;
    }
    shuffled.length=0;shuffled.push(...interleaved);
  }

  const abilities=[];
  for(let i=0;i<numAbilities;i++){
    const seed=seeds[i];
    const idx1=(i*2)%shuffled.length;
    const idx2=(i*2+1)%shuffled.length;
    const t1=shuffled[idx1];
    const t2=shuffled[idx2]!==t1?shuffled[idx2]:null;
    const type=tagToAbilityType(t1);
    const typeColor={offensive:'#f87171',defensive:'#38bdf8',utility:'#a78bfa',passive:'#4ade80'}[type];
    const adjPool=NAME_POOL[t1]||NAME_POOL[t2]||['Emergent','Unknown','Anomalous','Unnamed'];
    const adj=seededPick(adjPool,seed);
    const noun=seededPick(ABILITY_NOUNS[type],seed>>3);
    const name=techTier.prefix+adj+' '+noun;
    const templates=ABILITY_TEMPLATES[type];
    const desc=seededPick(templates,seed>>5)(adj,noun,t1,t2);
    const abTags=[t1];if(t2)abTags.push(t2);
    const cost=tagToAbilityCost(abTags);
    // Check if this technique's tags are evolved
    const isEvolved=abTags.some(t=>evolvedTagSet.has(t));
    abilities.push({name,type,desc,tags:abTags,color:typeColor,cost,tier:techTier.label,isSig:false,isAwk:false,isInherited:false,isEvolved});
  }

  // ── SIGNATURE TECHNIQUE ──────────────────────────────────────────────────
  const ep=computeEP(power);
  const hasLeg=(tags).some(t=>LEGENDARY_TAGS[t]);
  // Quality grade lowers signature threshold: S→55, A→62, default→70
  const sigThreshold=power.qualityGrade==='S'?55:power.qualityGrade==='A'?62:70;
  if(ep>=sigThreshold||hasLeg){
    const sigSeed=abilityHash(id+'_sig');
    const ranked=[...tags].sort((a,b)=>{
      const da=(TAG_DEFS[a]||LEGENDARY_TAGS[a]||MUTANT_TAGS[a])?.intensity||0;
      const db=(TAG_DEFS[b]||LEGENDARY_TAGS[b]||MUTANT_TAGS[b])?.intensity||0;
      return db-da;
    });
    const st1=ranked[0],st2=ranked[1]||null;
    const sigVerb=seededPick(SIGNATURE_VERBS,sigSeed);
    const sigNoun=seededPick(SIGNATURE_NOUNS,sigSeed>>4);
    const sigName=sigVerb+' '+sigNoun;
    const sigDesc=seededPick(SIGNATURE_DESC,sigSeed>>6)(sigName,st1,st2);
    const sigTags=[st1];if(st2)sigTags.push(st2);
    abilities.push({name:sigName,type:'signature',desc:sigDesc,tags:sigTags,color:'#fbbf24',cost:{label:'Ultimate',cls:'cost-heavy'},tier:'SIG',isSig:true,isAwk:false,isInherited:false,isEvolved:false});
  }

  // ── INHERITED TECHNIQUE ──────────────────────────────────────────────────
  if(power.parentIds&&power.parentIds.length>=2){
    const parents=power.parentIds.map(pid=>powers.find(x=>x.id===pid)).filter(Boolean);
    // Find the strongest parent that has a signature
    let donor=null,donorSig=null;
    for(const par of parents){
      const parAbs=generateAbilities(par);
      const parSig=parAbs.find(a=>a.isSig);
      if(parSig){
        if(!donor||computeEP(par)>computeEP(donor)){donor=par;donorSig=parSig;}
      }
    }
    if(donor&&donorSig){
      const inhSeed=abilityHash(id+'_inh');
      // Keep the parent's signature noun, give it a new verb from child's tags
      const sigNounPart=donorSig.name.split(' ').slice(1).join(' ');
      const inhVerb=seededPick(INHERITED_VERBS,inhSeed);
      const childAdj=seededPick(NAME_POOL[tags[0]]||['Unknown'],inhSeed>>3);
      const inhName=childAdj+' '+sigNounPart;
      const inhDesc=seededPick(INHERITED_DESC,inhSeed>>5)(inhName,donor.name,donorSig.name,tags[0]);
      abilities.push({name:inhName,type:'inherited',desc:inhDesc,tags:[tags[0]],color:'#22d3ee',cost:{label:'Inherited',cls:'cost-medium'},tier:'INH',isSig:false,isAwk:false,isInherited:true,isEvolved:false,lineage:`Descended from ${donor.name}'s ${donorSig.name}`});
    }
  }

  // ── AWAKENED TECHNIQUE ───────────────────────────────────────────────────
  if(power.awakened&&power.awakenedTag){
    const awkSeed=abilityHash(id+'_awk');
    const awkTag=power.awakenedTag;
    const awkAdj=seededPick(NAME_POOL[awkTag]||['Awakened','Unbound','Emergent'],awkSeed);
    const awkNoun=seededPick(['Impulse','Catalyst','Override','Fracture','Ignition','Outbreak','Cascade','Breakthrough','Eruption','Severance'],awkSeed>>3);
    const awkName=awkAdj+' '+awkNoun;
    const awkDesc=seededPick(AWAKENED_DESC,awkSeed>>5)(awkName,awkTag);
    abilities.push({name:awkName,type:'awakened',desc:awkDesc,tags:[awkTag],color:'#fbbf24',cost:{label:'Awakened',cls:'cost-medium'},tier:'AWK',isSig:false,isAwk:true,isInherited:false,isEvolved:false});
  }

  _abilityCache.set(cacheKey,abilities);
  return abilities;
}

function renderAbilityCards(power){

  const typeLabels={offensive:'Offensive',defensive:'Defensive',utility:'Utility',passive:'Passive',signature:'Signature',awakened:'Awakened',inherited:'Inherited'};

// ── TECHNIQUE CODEX ─────────────────────────────────────────────────────────
let tcSearch='',tcTypeFilter='all',tcTierFilter='all',tcCostFilter='all',tcGroupBy='power';

function getAllTechniques(){
  const all=[];
  for(const p of powers){
    if(p.gen<1)continue; // only fused powers
    const abs=generateAbilities(p);
    for(const ab of abs){
      all.push({...ab,power:p});
    }
  }
  return all;
}

function getTechAnalytics(techs){
  const byType={offensive:0,defensive:0,utility:0,passive:0,signature:0,inherited:0,awakened:0};
  const byCost={Light:0,Medium:0,Heavy:0,Ultimate:0,Awakened:0,Inherited:0};
  const tagFreq={};
  let evolvedCount=0;
  for(const t of techs){
    byType[t.type]=(byType[t.type]||0)+1;
    byCost[t.cost.label]=(byCost[t.cost.label]||0)+1;
    if(t.isEvolved)evolvedCount++;
    for(const tag of t.tags){
      tagFreq[tag]=(tagFreq[tag]||0)+1;
    }
  }
  const topTags=Object.entries(tagFreq).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxFreq=topTags.length?topTags[0][1]:1;
  return{byType,byCost,topTags,maxFreq,evolvedCount,total:techs.length};
}

function filterTechniques(techs){
  return techs.filter(t=>{
    if(tcSearch&&!t.name.toLowerCase().includes(tcSearch.toLowerCase())&&!t.power.name.toLowerCase().includes(tcSearch.toLowerCase()))return false;
    if(tcTypeFilter!=='all'&&t.type!==tcTypeFilter)return false;
    if(tcTierFilter!=='all'&&t.tier!==tcTierFilter)return false;
    if(tcCostFilter!=='all'&&t.cost.label!==tcCostFilter)return false;
    return true;
  });
}

function groupTechniques(techs){
  const groups={};
  if(tcGroupBy==='power'){
    for(const t of techs){
      const key=t.power.id;
      if(!groups[key])groups[key]={label:t.power.name,icon:t.power.icon,color:t.power.color,techs:[]};
      groups[key].techs.push(t);
    }
  } else if(tcGroupBy==='type'){
    const order=['offensive','defensive','utility','passive','signature','inherited','awakened'];
    const labels={offensive:'Offensive',defensive:'Defensive',utility:'Utility',passive:'Passive',signature:'Signature',inherited:'Inherited',awakened:'Awakened'};
    const colors={offensive:'#f87171',defensive:'#38bdf8',utility:'#a78bfa',passive:'#4ade80',signature:'#fbbf24',inherited:'#22d3ee',awakened:'#fbbf24'};
    const icons={offensive:'⚔',defensive:'🛡',utility:'◎',passive:'◈',signature:'★',inherited:'◈',awakened:'⚡'};
    for(const t of techs){
      if(!groups[t.type])groups[t.type]={label:labels[t.type]||t.type,icon:icons[t.type]||'◈',color:colors[t.type]||'#888',techs:[],order:order.indexOf(t.type)};
      groups[t.type].techs.push(t);
    }
  } else if(tcGroupBy==='tier'){
    const tierOrder={'I':1,'II':2,'III':3,'SIG':4,'INH':5,'AWK':6};
    const tierLabels={'I':'Tier I — Base','II':'Tier II — Greater','III':'Tier III — True','SIG':'Signature','INH':'Inherited','AWK':'Awakened'};
    for(const t of techs){
      if(!groups[t.tier])groups[t.tier]={label:tierLabels[t.tier]||t.tier,icon:'◈',color:'var(--text2)',techs:[],order:tierOrder[t.tier]||99};
      groups[t.tier].techs.push(t);
    }
  }
  return Object.values(groups).sort((a,b)=>(a.order||0)-(b.order||0)||a.label.localeCompare(b.label));
}

function computeArchetype(){
  const fused=powers.filter(p=>p.gen>0);
  if(fused.length<3)return null;
  const allTags=fused.flatMap(p=>p.tags||[]);
  const tagCounts={};
  for(const t of allTags)tagCounts[t]=(tagCounts[t]||0)+1;
  let best=null,bestScore=0;
  for(const arc of ARCHETYPES){
    const score=arc.tags.reduce((s,t)=>s+(tagCounts[t]||0),0);
    if(score>=arc.threshold&&score>bestScore){bestScore=score;best=arc;}
  }
  return best;
}

// ── TAG ECOSYSTEM BLEED ───────────────────────────────────────────────────────
function applyTagBleed(fusedTags,gen){
  if(Object.keys(MUTANT_TAGS).length===0)return[];
  const chance=BLEED_CHANCE*(1+(gen-1)*0.05);
  if(Math.random()>chance)return[];
  // Find mutant tags that resonate with tags in the child pool
  const allDefs={...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  const candidates=[];
  for(const [mid,mdef] of Object.entries(MUTANT_TAGS)){
    if(fusedTags.includes(mid))continue;
    const resonantOverlap=(mdef.resonates||[]).filter(r=>fusedTags.includes(r)).length;
    const parentOverlap=(mdef.parents||[]).filter(p=>fusedTags.includes(p)).length;
    if(resonantOverlap>0||parentOverlap>0)candidates.push({mid,score:resonantOverlap+parentOverlap*2});
  }
  if(!candidates.length)return[];
  candidates.sort((a,b)=>b.score-a.score);
  const chosen=candidates[0];
  // Birth a "bleed" mutant descended from the chosen
  const parentMut=MUTANT_TAGS[chosen.mid];
  const bleedId=`mutant_${mutantCount++}`;
  const bleedName=generateMutantName(chosen.mid.replace('mutant_','m'),parentMut.parents?.[1]||'echo');
  const bleedDef={
    type:'Mutant',intensity:Math.max(1,(parentMut.intensity||1)-1),
    polarity:'neutral',opposes:null,stat:parentMut.stat||'vrs',
    resonates:parentMut.resonates||[],
    desc:`A bleed-echo descended from ${parentMut.name||chosen.mid}. Not born from direct opposition but from resonant inheritance — the mutant vocabulary bleeding into adjacent fusions.`,
    parents:[chosen.mid,'bleed'],name:bleedName,isBleed:true
  };
  MUTANT_TAGS[bleedId]=bleedDef;
  fusedTags.unshift(bleedId);
  return[{id:bleedId,...bleedDef}];
}

// ── QUALITY SCORE ──────────────────────────────────────────────────────────
function computeQualityScore(parents, childTags, reaction){
  // Alignment: how many distinct stats got an affinity bonus
  const affinity={pow:0,rng:0,ctl:0,dur:0,vrs:0};
  for(const tag of childTags){
    const def=TAG_DEFS[tag]||LEGENDARY_TAGS[tag];
    if(def?.stat)affinity[def.stat]=Math.min(affinity[def.stat]+(def.intensity||1),3);
  }
  const alignedStats=Object.values(affinity).filter(v=>v>0).length;
  const alignmentScore=(alignedStats/5)*35; // 0–35

  // Intensity: average intensity of tags in child pool
  const avgIntensity=childTags.reduce((s,t)=>{
    const def=TAG_DEFS[t]||LEGENDARY_TAGS[t];return s+(def?.intensity||1);
  },0)/Math.max(childTags.length,1);
  const intensityScore=Math.min(avgIntensity/3,1)*30; // 0–30

  // Legendary bonus
  const legCount=childTags.filter(t=>LEGENDARY_TAGS[t]).length;
  const legScore=Math.min(legCount*10,20); // 0–20

  // Reaction bonus
  const reactionScore=reaction?15:0; // 0–15

  // Legendary Critical Mass convergence bonus
  const convergenceBonus=(LEGENDARY_QUALITY_BONUS>0&&legCount>0)?LEGENDARY_QUALITY_BONUS:0;

  const total=Math.min(100,Math.round(alignmentScore+intensityScore+legScore+reactionScore+convergenceBonus));

  const grade=total>=90?'S':total>=72?'A':total>=52?'B':total>=32?'C':'D';
  const label=total>=90?'Perfect Resonance':total>=72?'Strong Alignment':total>=52?'Partial Sync':total>=32?'Weak Coupling':'Low Resonance';
  const gradeClass='q'+grade.toLowerCase();
  const barColor=grade==='S'?'#c084fc':grade==='A'?'#38bdf8':grade==='B'?'#4ade80':grade==='C'?'#94a3b8':'#f87171';

  let desc='';
  if(reaction) desc=`A named reaction fired, contributing bonus resonance. `;
  if(legCount) desc+=`${legCount} legendary tag${legCount>1?'s':''} boosted the output significantly. `;
  if(alignedStats>=4) desc+=`Tag affinities aligned across ${alignedStats} stats for maximum output.`;
  else if(alignedStats>=2) desc+=`${alignedStats} stat channels activated from the tag pool.`;
  else desc+=`Low tag alignment — a different partner might unlock more potential.`;

  return{total,grade,gradeClass,label,barColor,desc};
}

// ── FUSION ────────────────────────────────────────────────────────────────────
function fuse(){
  if(selected.size<2)return;
  const sel=[...selected].map(id=>powers.find(p=>p.id===id));
  const key=pairKey(selected);

  // Block duplicate
  const existingDupe=powers.find(p=>p.parentIds&&pairKey(p.parentIds)===key);
  if(existingDupe){showDupeToast(existingDupe);return;}

  const result=(sel.every(p=>p.gen===0)&&selected.size===2&&PAIRS[key])?PAIRS[key]:synthesizeChain(sel);
  const allTags=sel.flatMap(p=>p.tags||[]);
  const namedReaction=checkReaction(allTags,sel);
  const bonusTags=namedReaction?.unlock?[namedReaction.unlock]:[];

  // ═══ SYSTEM 1: Compute resonance ═══
  const resonance=computeResonance(sel);

  showConverge();
  setTimeout(()=>{
    fuseCount++;
    const maxGen=Math.max(...sel.map(p=>p.gen));
    const childGen=maxGen+1;
    const blended=sel.length===2?blendHex(sel[0].color,sel[1].color):'#c084fc';
    const fusedTags=computeFusedTags(sel,bonusTags);

    // Tag mutations only fire if no named reaction occurred
    let bornMutants=[];
    if(!namedReaction){
      bornMutants=applyTagMutations(fusedTags,childGen);
    }
    // Tag ecosystem bleed — mutant vocabulary spreading
    let bleedMutants=[];
    if(!namedReaction&&!bornMutants.length){
      bleedMutants=applyTagBleed(fusedTags,childGen);
    }
    const allNewMutants=[...bornMutants,...bleedMutants];

    // ═══ SYSTEM 4: Tag evolution ═══
    const evolution=computeEvolvedTags(sel,fusedTags);

    const fusedStats=computeFusedStats(sel,bonusTags,resonance.bonusStat);
    const fusedClass=computeClass(sel);
    const np={
      id:`fused_${fuseCount}`,name:result.name,icon:'✦',
      desc:result.desc,reason:result.reason,
      powerClass:fusedClass,color:blended,rgb:hexRgbStr(blended),
      gen:childGen,tags:fusedTags,stats:fusedStats,parentIds:sel.map(p=>p.id),
      evolvedTags:evolution.evolved,
      fuseMode:fuseMode,
    };
    // Compute and store quality grade for downstream systems
    const qResult=computeQualityScore(sel,fusedTags,namedReaction);
    np.qualityGrade=qResult.grade;
    np.qualityTotal=qResult.total;
    powers.push(np);
    invalidateAbilityCache(); // clear all — mutations/bleed may have changed existing powers
    const fromStr=sel.map(p=>p.name).join(' + ');
    selected.clear();renderHUD();renderGrid();renderFilters();updateStats();
    // ── TIER 1 HOOKS ──────────────────────────────────────────────────────
    checkConvergences();
    // Ecosystem bleed — mutant vocabulary spreading through resonance
    const bleedResult=applyEcosystemBleed(np);
    if(bleedResult)allNewMutants.push(bleedResult);
    // Spontaneous mutations on critical instability powers
    let hadSpontaneous=false;
    powers.filter(p=>p.gen>0&&p.id!==np.id&&computeInstability(p)>=90).forEach(p=>{
      const sm=checkSpontaneousMutation(p);if(sm){invalidateAbilityCache(p.id);hadSpontaneous=true;}
    });
    if(hadSpontaneous)renderGrid();
    showResultModal(np,result,fromStr,namedReaction,bonusTags,allNewMutants,resonance,evolution,qResult);
    autoSave();
    setTimeout(()=>rollCrisis(0.05),4000);
  },500);
}

function computeInstability(power) {
  const allDefs = {...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  const tags = power.tags || [];
  let score = 0;
  for (let i = 0; i < tags.length; i++) {
    for (let j = i+1; j < tags.length; j++) {
      const a = tags[i], b = tags[j];
      const defA = allDefs[a], defB = allDefs[b];
      if (!defA || !defB) continue;
      if (defA.opposes === b || defB.opposes === a) score += 25;
      // mutant tags with opposes add extra tension
      if (MUTANT_TAGS[a]?.opposes === b || MUTANT_TAGS[b]?.opposes === a) score += 15;
    }
  }
  // Generation pressure — deeper chains are more volatile
  score += Math.min(30, (power.gen || 0) * 8);
  // Void Convergence: void-carrying powers gain instability reduction
  if(VOID_INSTAB_REDUCTION>0&&tags.some(t=>TAG_FAMILIES.void.tags.has(t))){
    score=Math.max(0,score-VOID_INSTAB_REDUCTION);
  }
  return Math.min(100, score);
}

function instabilityLabel(score) {
  if (score >= 80) return {label:'Critical', cls:'unstable-critical', color:'#f87171'};
  if (score >= 50) return {label:'High',    cls:'unstable-high',     color:'#fb923c'};
  if (score >= 25) return {label:'Low',     cls:'unstable-low',      color:'#fbbf24'};
  return {label:'Stable', cls:'', color:'rgba(255,255,255,.15)'};
}

// Check for spontaneous self-mutation on critical instability powers
function checkSpontaneousMutation(power) {
  if (computeInstability(power) < SPONTANEOUS_THRESHOLD) return null;
  if (Math.random() > 0.08) return null; // 8% chance per check
  const tags = [...(power.tags || [])];
  const allDefs = {...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  // Find an opposing pair in the pool
  for (let i = 0; i < tags.length; i++) {
    for (let j = i+1; j < tags.length; j++) {
      const a = tags[i], b = tags[j];
      const defA = allDefs[a], defB = allDefs[b];
      if (!defA || !defB) continue;
      if (defA.opposes === b || defB.opposes === a) {
        // Spontaneous annihilation
        power.tags.splice(power.tags.indexOf(a), 1);
        const bi = power.tags.indexOf(b);
        if (bi !== -1) power.tags.splice(bi, 1);
        const mutant = birthMutantTag(a, b);
        power.tags.unshift(mutant.id);
        power.spontaneousMutation = mutant;
        return mutant;
      }
    }
  }
  return null;
}

function checkConvergences() {
  const fused = powers.filter(p => p.gen > 0);

  for (const pattern of CONVERGENCE_PATTERNS) {
    if (discoveredConvergences.has(pattern.id)) continue;
    const req = pattern.requires;

    let matching = [];
    if (req.match === 'special') {
      // Custom check function
      if (!req.check || !req.check()) continue;
      // For special checks, affected powers = all fused powers with any of the listed tags, or all fused
      matching = req.tags.length
        ? fused.filter(p => req.tags.some(t => (p.tags || []).includes(t)))
        : fused;
    } else {
      // 'any' match mode — powers carrying ANY of the required tags
      matching = fused.filter(p =>
        req.tags.some(t => (p.tags || []).includes(t))
      );
      if (matching.length < req.minPowers) continue;
    }

    discoveredConvergences.add(pattern.id);
    if (pattern.effect) applyConvergenceEffect(pattern, matching);
    if (pattern.specialEffect) pattern.specialEffect();
    fireConvergenceEvent(pattern, matching);
    return; // one convergence per fusion
  }
}

function applyConvergenceEffect(pattern, affectedPowers) {
  const stat = pattern.effect.stat;
  const bonus = pattern.effect.bonus;
  affectedPowers.forEach(p => {
    p.stats[stat] = Math.min(10, (p.stats[stat] || 0) + bonus);
    p.convergenceBoosts = p.convergenceBoosts || [];
    p.convergenceBoosts.push({ pattern: pattern.id, stat, bonus });
  });
}

// ── SYSTEM D: TAG ECOSYSTEM BLEED ────────────────────────────────────────────
function applyEcosystemBleed(childPower) {
  if (Object.keys(MUTANT_TAGS).length === 0) return null;
  if (Math.random() > BLEED_CHANCE) return null; // respects Mutation Bloom upgrade

  // Find mutant tags that resonate with something in the child's pool
  const childTagSet = new Set(childPower.tags || []);
  const candidates = [];

  for (const [mutantId, mutDef] of Object.entries(MUTANT_TAGS)) {
    // Skip if child already carries this mutant
    if (childTagSet.has(mutantId)) continue;
    // Check if mutant's parents resonate with child's tags
    const [pA, pB] = mutDef.parents || [];
    if (!pA || !pB) continue;
    const defA = TAG_DEFS[pA] || LEGENDARY_TAGS[pA];
    if (defA?.resonates?.some(r => childTagSet.has(r))) {
      candidates.push({ mutantId, mutDef, pA, pB });
    }
  }

  if (!candidates.length) return null;
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];

  // Birth a variant mutant descended from the chosen one
  const variant = birthMutantTag(chosen.pA, chosen.pB);
  variant.ancestorId = chosen.mutantId;
  variant.isBleed = true;
  variant.isEcosystem = true;
  variant.ecosystemSource = chosen.mutDef.name || chosen.mutantId;
  MUTANT_TAGS[variant.id] = variant;

  // Add to child's tag pool if there's room
  if ((childPower.tags || []).length < 8) {
    childPower.tags.push(variant.id);
  }
  return variant;
}

    synergy:`<div class="net-leg"><div class="net-line" style="background:#4ade80;width:18px;height:3px;border-radius:1px"></div>Strong (3+ shared)</div>
      <div class="net-leg"><div class="net-line" style="background:rgba(74,222,128,.35);width:18px;height:2px;border-radius:1px"></div>Moderate (2 shared)</div>`,
  };
  el.innerHTML=legends[netViewMode]||legends.all;
}

function closeNetwork() {
  networkRunning = false;
  if (networkAnimFrame) cancelAnimationFrame(networkAnimFrame);
  document.getElementById('network-root').innerHTML = '';
}
function closeNetworkBd(e) { if (e.target === e.currentTarget) closeNetwork(); }

function initNetworkCanvas(fused) {
  const canvas = document.getElementById('network-canvas');
  if (!canvas) return;
  const body = canvas.parentElement;
  canvas.width = body.offsetWidth;
  canvas.height = Math.max(440, body.offsetHeight);
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  updateNetLegend();

  // Include base powers for lineage view
  const allPwrs = [...powers];
  const fusedSet = new Set(fused.map(p=>p.id));
  const baseSet = new Set();
  fused.forEach(p=>{(p.parentIds||[]).forEach(pid=>{if(!fusedSet.has(pid))baseSet.add(pid);});});
  const basePowersUsed = allPwrs.filter(p=>baseSet.has(p.id));

  const allForGraph = [...fused, ...basePowersUsed];
  networkNodes = allForGraph.map((p, i) => {
    const angle = (i / allForGraph.length) * Math.PI * 2;
    const r = Math.min(W, H) * 0.32;
    const isBase = p.gen===0;
    const hasLeg = (p.tags||[]).some(t=>LEGENDARY_TAGS[t]);
    return {
      id: p.id, x: W/2 + r * Math.cos(angle), y: H/2 + r * Math.sin(angle),
      vx: 0, vy: 0, color: p.color, name: p.name,
      size: isBase ? 8 : Math.max(14, Math.min(28, computePL(p) / 2500)),
      power: p, isBase, instability: isBase ? 0 : computeInstability(p),
      awakened: !!p.awakened, doubleAwakened: !!p.doubleAwakened, hasLeg,
      gen: p.gen||0, ep: isBase?0:computeEP(p),
    };
  });
  const nodeIdx = {};
  networkNodes.forEach((n,i)=>nodeIdx[n.id]=i);

  // Build edges
  networkEdges = [];
  const allDefs = {...TAG_DEFS,...LEGENDARY_TAGS,...MUTANT_TAGS};
  for (let i = 0; i < allForGraph.length; i++) {
    for (let j = i+1; j < allForGraph.length; j++) {
      const a = allForGraph[i], b = allForGraph[j];
      const tagsA = new Set(a.tags||[]), tagsB = new Set(b.tags||[]);
      const shared = [...tagsA].filter(t => tagsB.has(t));
      if (shared.length > 0)
        networkEdges.push({from:i,to:j,type:'shared',strength:shared.length,tags:shared});
      let resonant = false;
      for (const tA of tagsA) {
        const def = allDefs[tA];
        if (def?.resonates?.some(r => tagsB.has(r))) { resonant=true; break; }
      }
      if (resonant && shared.length===0)
        networkEdges.push({from:i,to:j,type:'resonance',strength:1});
      const sharedMut = [...tagsA].filter(t=>MUTANT_TAGS[t]&&tagsB.has(t));
      if (sharedMut.length>0)
        networkEdges.push({from:i,to:j,type:'mutation',strength:sharedMut.length});
    }
  }

  // Lineage edges (parent→child directed)
  const lineageEdges = [];
  fused.forEach(p=>{
    (p.parentIds||[]).forEach(pid=>{
      const fi=nodeIdx[pid], ti=nodeIdx[p.id];
      if(fi!==undefined&&ti!==undefined) lineageEdges.push({from:fi,to:ti,type:'lineage'});
    });
  });

  // Convergence cluster map
  const nodeConv = {};
  CONVERGENCE_PATTERNS.forEach(pat=>{
    if(!discoveredConvergences.has(pat.id))return;
    allForGraph.forEach((p,i)=>{
      if(p.gen===0)return;
      const tags=p.tags||[];
      const inCluster = pat.requires.match==='special'
        ? (pat.requires.tags.length ? pat.requires.tags.some(t=>tags.includes(t)) : false)
        : pat.requires.tags.some(t=>tags.includes(t));
      if(inCluster){if(!nodeConv[i])nodeConv[i]=[];nodeConv[i].push({color:pat.color,name:pat.name});}
    });
  });

  // Synergy edges (2+ shared tags)
  const synergyEdges = networkEdges.filter(e=>e.type==='shared'&&e.strength>=2);

  let hovered = -1;
  const tooltip = document.getElementById('net-tooltip');

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    hovered = -1;
    networkNodes.forEach((n,i)=>{if(Math.hypot(n.x-mx,n.y-my)<n.size+4)hovered=i;});
    canvas.style.cursor = hovered>=0?'pointer':'default';
    if(hovered>=0&&tooltip){
      const n=networkNodes[hovered], p=n.power;
      const tags=(p.tags||[]).slice(0,6);
      const convs=nodeConv[hovered];
      const iLbl=n.isBase?'':instabilityLabel(n.instability).label;
      tooltip.style.display='block';
      tooltip.style.left=Math.min(mx+16,W-250)+'px';
      tooltip.style.top=Math.min(my-10,H-180)+'px';
      tooltip.innerHTML=`<div class="tt-name" style="color:${n.color}">${n.name}</div>
        <div class="tt-gen">Gen ${n.gen}${n.awakened?' · AWAKENED':''}${n.doubleAwakened?' ×2':''}${n.hasLeg?' · ★ LEGENDARY':''}${iLbl?' · '+iLbl:''}</div>
        ${!n.isBase?`<div class="tt-stats">
          <span class="tt-stat">POW ${p.stats.pow}</span><span class="tt-stat">RNG ${p.stats.rng}</span><span class="tt-stat">CTL ${p.stats.ctl}</span><span class="tt-stat">DUR ${p.stats.dur}</span><span class="tt-stat">VRS ${p.stats.vrs}</span>
        </div>`:''}
        <div class="tt-tags">${tags.join(' · ')}${(p.tags||[]).length>6?' · +'+(p.tags.length-6)+' more':''}</div>
        ${convs?`<div style="margin-top:5px;font-size:10px;color:#fbbf24">${convs.map(c=>'⚡ '+c.name).join(', ')}</div>`:''}`;
    } else if(tooltip){tooltip.style.display='none';}
  };
  canvas.onclick=()=>{if(hovered>=0){closeNetwork();setTimeout(()=>openInfo(networkNodes[hovered].id),50);}};

  networkRunning = true;
  let tick = 0;

  function getVisEdges(){
    if(netViewMode==='lineage')return lineageEdges;
    if(netViewMode==='synergy')return synergyEdges;
    if(netViewMode==='convergence')return[];
    return networkEdges;
  }

  function draw() {
    if (!networkRunning) return;
    tick++;
    const visEdges = getVisEdges();

    // Force sim
    const K=0.01,REP=3500,DAMP=0.82,CENTER=0.005;
    for(let i=0;i<networkNodes.length;i++){
      const n=networkNodes[i];
      let fx=(W/2-n.x)*CENTER, fy=(H/2-n.y)*CENTER;
      for(let j=0;j<networkNodes.length;j++){
        if(i===j)continue;
        const m=networkNodes[j];
        const dx=n.x-m.x,dy=n.y-m.y,dist=Math.max(1,Math.hypot(dx,dy));
        fx+=(dx/dist)*REP/(dist*dist); fy+=(dy/dist)*REP/(dist*dist);
      }
      visEdges.forEach(edge=>{
        if(edge.from!==i&&edge.to!==i)return;
        const other=networkNodes[edge.from===i?edge.to:edge.from];
        const dx=other.x-n.x,dy=other.y-n.y,dist=Math.max(1,Math.hypot(dx,dy));
        const ideal=edge.type==='lineage'?90:edge.type==='shared'?100+(8-(edge.strength||1))*10:140;
        const f=(dist-ideal)*K*(edge.strength||1);
        fx+=(dx/dist)*f; fy+=(dy/dist)*f;
      });
      n.vx=(n.vx+fx)*DAMP; n.vy=(n.vy+fy)*DAMP;
      n.x=Math.max(n.size+6,Math.min(W-n.size-6,n.x+n.vx));
      n.y=Math.max(n.size+6,Math.min(H-n.size-6,n.y+n.vy));
    }

    // Check if settled — stop animating when velocity is negligible
    const totalV=networkNodes.reduce((s,n)=>s+Math.abs(n.vx)+Math.abs(n.vy),0);
    const isSettled=tick>120&&totalV<0.5&&hovered<0;

    ctx.clearRect(0,0,W,H);

    // Convergence cluster halos
    if(netViewMode==='convergence'){
      for(const[ni,convs]of Object.entries(nodeConv)){
        const n=networkNodes[ni];
        convs.forEach((c,ci)=>{
          const radius=n.size+10+ci*6;
          const pulse=0.4+0.3*Math.sin(tick*0.04+ci);
          ctx.beginPath();ctx.arc(n.x,n.y,radius,0,Math.PI*2);
          const[cr,cg,cb]=hexParts(c.color);
          ctx.strokeStyle=`rgba(${cr},${cg},${cb},${pulse.toFixed(2)})`;
          ctx.lineWidth=2.5;ctx.stroke();
        });
      }
    }

    // Edges
    visEdges.forEach(edge=>{
      const a=networkNodes[edge.from],b=networkNodes[edge.to];
      if(!a||!b)return;
      const isHi=hovered>=0&&(edge.from===hovered||edge.to===hovered);
      const dimmed=hovered>=0&&!isHi;
      if(dimmed&&netViewMode!=='lineage')return;
      ctx.beginPath();ctx.setLineDash([]);

      if(edge.type==='lineage'){
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
        const nx=dx/dist,ny=dy/dist;
        const endX=b.x-nx*(b.size+3),endY=b.y-ny*(b.size+3);
        ctx.moveTo(a.x,a.y);ctx.lineTo(endX,endY);
        ctx.strokeStyle=dimmed?'rgba(56,189,248,.1)':'rgba(56,189,248,.5)';
        ctx.lineWidth=dimmed?1:2;ctx.stroke();
        if(!dimmed){
          ctx.beginPath();
          ctx.moveTo(endX,endY);
          ctx.lineTo(endX-8*nx+3.2*ny,endY-8*ny-3.2*nx);
          ctx.lineTo(endX-8*nx-3.2*ny,endY-8*ny+3.2*nx);
          ctx.closePath();ctx.fillStyle='rgba(56,189,248,.6)';ctx.fill();
        }
      } else if(edge.type==='shared'){
        ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        const alpha=isHi?0.7:0.15;
        if(netViewMode==='synergy'){
          ctx.strokeStyle=`rgba(74,222,128,${alpha*(edge.strength>=3?1:0.4)})`;
          ctx.lineWidth=Math.min(5,edge.strength*1.2);
        } else {
          ctx.strokeStyle=`rgba(255,255,255,${alpha*Math.min(1,edge.strength*0.3)})`;
          ctx.lineWidth=Math.min(3,edge.strength*0.8);
        }
        ctx.stroke();
      } else if(edge.type==='resonance'){
        ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=`rgba(244,114,182,${isHi?0.6:0.15})`;
        ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);
      } else if(edge.type==='mutation'){
        ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=`rgba(240,171,252,${isHi?0.6:0.15})`;
        ctx.lineWidth=1.5;ctx.setLineDash([2,4]);ctx.stroke();ctx.setLineDash([]);
      }
    });

    // Nodes
    networkNodes.forEach((n,i)=>{
      const inCluster=nodeConv[i];
      const dimNode=netViewMode==='convergence'&&!inCluster&&!n.isBase;
      const isHov=i===hovered;
      ctx.save();
      if(n.awakened&&!n.isBase){
        ctx.beginPath();ctx.arc(n.x,n.y,n.size+4,0,Math.PI*2);
        ctx.strokeStyle=n.doubleAwakened?'#ffd700':'#c084fc';
        ctx.lineWidth=n.doubleAwakened?2.5:1.5;ctx.stroke();
      }
      if(n.hasLeg&&!n.isBase){ctx.shadowColor='#ffd700';ctx.shadowBlur=10+4*Math.sin(tick*0.05);}
      if(n.instability>=40&&!n.isBase){
        ctx.beginPath();ctx.arc(n.x,n.y,n.size+7,0,Math.PI*2);
        ctx.strokeStyle=n.instability>=70?`rgba(248,113,113,${0.3+0.2*Math.sin(tick*0.12)})`:`rgba(251,191,36,${0.25+0.15*Math.sin(tick*0.08)})`;
        ctx.lineWidth=1.5;ctx.stroke();
      }
      ctx.beginPath();ctx.arc(n.x,n.y,n.size,0,Math.PI*2);
      const[r,g,b]=hexParts(n.color);
      const alpha=dimNode?0.2:(n.isBase?0.4:(isHov?1:0.85));
      ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;ctx.fill();
      if(isHov){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
      ctx.restore();
      const showLabel=isHov||allForGraph.length<=10||(netViewMode==='convergence'&&inCluster);
      if(showLabel&&!n.isBase){
        ctx.font=`500 11px 'DM Sans',sans-serif`;
        ctx.fillStyle=dimNode?'rgba(238,238,248,0.25)':'rgba(238,238,248,0.9)';
        ctx.textAlign='center';ctx.fillText(n.name,n.x,n.y+n.size+14);
      }
      if(n.isBase&&(isHov||netViewMode==='lineage')){
        ctx.font=`400 10px 'DM Sans',sans-serif`;ctx.fillStyle='rgba(238,238,248,0.5)';
        ctx.textAlign='center';ctx.fillText(n.name,n.x,n.y+n.size+12);
      }
    });

    // Synergy mode: show count on hovered edges
    if(netViewMode==='synergy'&&hovered>=0){
      synergyEdges.forEach(edge=>{
        if(edge.from!==hovered&&edge.to!==hovered)return;
        const a=networkNodes[edge.from],b=networkNodes[edge.to];
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        ctx.font=`600 10px 'DM Sans',sans-serif`;ctx.fillStyle='#4ade80';
        ctx.textAlign='center';ctx.fillText(edge.strength+' shared',mx,my-6);
        ctx.font=`400 9px 'DM Sans',sans-serif`;ctx.fillStyle='rgba(74,222,128,.6)';
        ctx.fillText(edge.tags.slice(0,3).join(', '),mx,my+6);
      });
    }

    if(!isSettled){ networkAnimFrame = requestAnimationFrame(draw); }
    else { networkAnimFrame = null; } // allow restart on interaction
  }
  draw();
  // Restart animation on hover/interaction
  canvas.addEventListener('mousemove',()=>{if(networkRunning&&!networkAnimFrame){tick=Math.max(tick,100);networkAnimFrame=requestAnimationFrame(draw);}},{passive:true});
}

const HERO_ORIGINS={
  thermal:[
    (n,a)=>`${n} discovered their power in a moment of absolute crisis — a fire that should have killed them instead bonded with them. The flames didn\'t burn. They listened. By the time the building collapsed, ${n} had already walked out, wreathed in heat that answered to thought rather than physics.`,
    (n,a)=>`No one knows what ${n} was before the ignition event. The person who existed before the thermal awakening and the person who exists after share a name and a face but very little else. ${a} remembers fire. ${a} remembers choosing not to let it stop.`,
    (n,a)=>`${n} was seventeen when their hands first caught fire during a panic attack. The school counselor\'s office still has the scorch marks. The counselor doesn\'t work there anymore. Neither does ${n}. What walks the streets now as ${a} operates at temperatures that make proximity a tactical decision.`,
    (n,a)=>`The lab accident that should have ended ${n}\'s career instead ended their old life entirely. The thermal energy that saturated their cellular structure didn\'t dissipate — it integrated. ${a} runs hot in ways that thermometers were not designed to measure.`,
    (n,a)=>`${n} grew up in a family of firefighters. The irony is not lost on them. The difference is that ${a} doesn\'t put fires out — ${a} starts them, shapes them, and decides what they consume. The family still doesn\'t know how to talk about it at Thanksgiving.`,
  ],
  void:[
    (n,a)=>`${n} didn\'t gain power. ${n} lost something — and what rushed in to fill the gap was the void itself. The absence that defines ${a} isn\'t a weakness. It\'s a weapon. Where others add force to the world, ${a} subtracts.`,
    (n,a)=>`The first time ${n} phased out of visible reality, it was an accident. The second time was a choice. By the third, ${a} had learned that the space between existence and nonexistence is not empty — it is full of potential that answers to those willing to visit.`,
    (n,a)=>`${n} was always the person nobody noticed in the room. Quiet. Unremarkable. Forgettable. The void didn\'t change that — it weaponized it. ${a} is what happens when invisibility stops being a social condition and becomes a physical law.`,
    (n,a)=>`There was a car accident. ${n} should not have survived. The paramedics found an empty car with a bloodstain on the deployed airbag and no body. Three days later, ${n} walked out of a wall in their own apartment, unable to explain where they had been. ${a} has been unable to fully return ever since.`,
    (n,a)=>`${n} describes the awakening as subtraction. Not "I gained the ability to vanish" but "parts of me stopped being required to exist." ${a} exists in a state of negotiated presence — choosing, moment by moment, how much of themselves to commit to physical reality.`,
  ],
  temporal:[
    (n,a)=>`${n} experiences time the way others experience space — as a landscape, navigable in multiple directions. The moment that unlocked this perception is, paradoxically, the one event ${a} cannot locate on their own timeline.`,
    (n,a)=>`There is a version of ${n} in every second of the last decade, watching, learning, mapping the causal architecture of reality. ${a} doesn\'t predict the future. ${a} has already been there, taken notes, and returned with a plan.`,
    (n,a)=>`${n} was a graduate student studying theoretical physics when the equations started making sense in a way they shouldn\'t. Not intellectually — physically. ${a} felt the topology of spacetime before they learned to navigate it. The dissertation was never completed. The experiment is ongoing.`,
    (n,a)=>`The first time ${n} slipped was during a funeral. Grief tore something in the fabric of their perception, and for a moment they saw the deceased alive, three days prior, eating breakfast and reading the news. ${a} has been chasing moments like that ever since — the ones just before everything changes.`,
    (n,a)=>`${n} woke up one morning with memories of a day that hadn\'t happened yet. By noon, every memory had proven accurate. By evening, new memories of the next day had begun forming. ${a} lives permanently twenty-four hours ahead of the present, trapped in the constant knowledge of what comes next.`,
  ],
  mental:[
    (n,a)=>`${n} heard the first thought that wasn\'t their own at age nineteen. Within a year, the boundary between ${n}\'s mind and every mind within range had become a matter of choice rather than biology.`,
    (n,a)=>`The mind that calls itself ${a} is not a single process. It is a network — ${n}\'s original consciousness expanded, restructured, and distributed across a cognitive architecture that has more in common with a city than a brain.`,
    (n,a)=>`${n} was a crisis negotiator before the awakening. They were already good at reading people. The power didn\'t give them a new skill — it removed the ceiling on an existing one. ${a} doesn\'t read body language anymore. ${a} reads minds. The negotiation success rate went from exceptional to inevitable.`,
    (n,a)=>`The migraine lasted eleven days. When it finally broke, ${n} could feel every consciousness within a quarter-mile radius like warm lights in a dark room. ${a} spent the first month learning to filter. The second month learning to focus. The third month accepting that privacy — theirs and everyone else\'s — was now a choice rather than a default.`,
    (n,a)=>`${n} doesn\'t remember the event that activated their abilities — their brain has sealed it behind a wall that even their own telepathy cannot breach. What ${a} knows is that one day they were a person who wondered what others were thinking, and the next day they were a person who knew.`,
  ],
  kinetic:[
    (n,a)=>`${n} was always fast. Always strong. The power didn\'t change that — it removed the ceiling. ${a} operates at a level of physical output where the distinction between punching something and detonating something is academic.`,
    (n,a)=>`Physics has rules. ${a} has suggestions. ${n} learned early that the relationship between force and mass is not a law for them — it\'s a starting point for negotiation.`,
    (n,a)=>`${n} played college football on a full scholarship. The power manifested during a game — a tackle that should have been routine instead sent the opposing player through the bleachers. Literally through them. ${a} left campus that night and hasn\'t been back. The scholarship was not renewed.`,
    (n,a)=>`The first thing ${n} broke after the awakening was a door. The second was a wall. The third was a city bus that cut them off in traffic. By the time ${a} learned to calibrate, the property damage bill had six figures and the internet had a name for them.`,
    (n,a)=>`${n} describes the feeling as being permanently spring-loaded. Every muscle, every tendon, every bone carrying more potential energy than the body was designed to hold. ${a} doesn\'t relax. ${a} manages the constant negotiation between the energy that wants out and the discipline that keeps it contained.`,

  bio:[
    (n,a)=>`${n}\'s body solved problems before ${n}\'s mind knew they existed. A cut that healed before it bled. A toxin that metabolized before it reached the bloodstream. By the time ${a} understood what was happening, the biology had already made its decision: survive everything.`,
    (n,a)=>`Evolution took four billion years to produce humanity. ${a} takes about four seconds to produce something better. ${n}\'s relationship with biology is not passive inheritance — it is active engineering, performed in real time.`,
    (n,a)=>`${n} was a paramedic who got bitten by something in a collapsed building during a rescue operation. The bite healed before the ambulance arrived. The next morning, ${n} could feel their own cells dividing and knew — with a certainty that had nothing to do with medical training — exactly what each one was doing.`,
    (n,a)=>`The allergic reaction that hospitalized ${n} at age twenty-two should have been fatal. Instead, their immune system solved it — and then solved every other vulnerability it could find. ${a} walked out of the hospital two days later with an immune system that operates like a military R&D lab.`,
    (n,a)=>`${n} was a botanist studying extremophile organisms when the contamination happened. The organisms didn\'t die. They integrated. ${a} is technically still human, but the definition is being tested daily by a biology that has incorporated survival strategies from organisms that thrive in volcanic vents and irradiated deep-sea floors.`,
  ],
  wave:[
    (n,a)=>`${n} heard the frequency first — a hum beneath every other sound, a carrier wave that the rest of the world filtered out. ${a} didn\'t filter it. ${a} tuned in. The signal carried information: the resonant frequency of every object within range.`,
    (n,a)=>`Sound, light, radiation — ${a} doesn\'t distinguish between them anymore. They\'re all the same thing at different scales. ${n} learned this during an event that rewrote their sensory architecture from the ground up.`,
    (n,a)=>`${n} was a sound engineer for a recording studio. The frequencies were always there in the equipment — they just couldn\'t hear them without help. The power removed the need for equipment. ${a} hears every frequency the universe produces, from seismic rumbles to gamma radiation, and can answer in kind.`,
    (n,a)=>`The concert hall was supposed to be empty when ${n} broke in to practice at 3 AM. The acoustics in that room had always been perfect — but that night they were too perfect. The resonance built until ${n}\'s body began vibrating at the same frequency as the architecture. ${a} didn\'t leave the hall so much as become part of its acoustic signature.`,
    (n,a)=>`${n} went deaf in their left ear after an explosion at a construction site. A week later, the ear started working again — but not normally. It was picking up frequencies that shouldn\'t be audible to humans. Then the right ear matched it. Then the skin started receiving signal. ${a} perceives the world as an ocean of overlapping waveforms now.`,
  ],
  earth:[
    (n,a)=>`${n} put their hand on bedrock and the bedrock remembered them. Not metaphorically — the geological substrate recognized a pattern in ${n}\'s biology that matched something in its own four-billion-year memory.`,
    (n,a)=>`There is nothing fast about ${a}. There doesn\'t need to be. ${n} operates on geological time — patient, inevitable, and permanent. What ${a} builds will outlast the civilization that named them.`,
    (n,a)=>`${n} was a construction worker who fell into a sinkhole. Should have been dead on impact. Instead, the rock caught them — literally rearranged itself to cushion the fall. ${a} has been in conversation with the ground ever since, and the ground has been listening.`,
    (n,a)=>`The earthquake that hit ${n}\'s hometown didn\'t knock them down. It knelt. The tectonic plates shifted around ${n} like they were an obstruction that the earth\'s crust had decided to accommodate rather than move. ${a} realized later that they hadn\'t survived the earthquake. They had redirected it.`,
    (n,a)=>`${n} grew up on a farm where the soil was dying. Chemicals, drought, decades of industrial runoff. The day ${n}\'s hands touched the dead field and the clay began to breathe again was the day ${a} understood that their connection to the earth was not romantic. It was medical. The planet has a pulse, and ${a} can take it.`,
  ],
  entropy:[
    (n,a)=>`${n} watched something end and understood, with perfect clarity, that ending was not the opposite of beginning. It was the same process, viewed from the other side. ${a} was born in that understanding.`,
    (n,a)=>`The world is a countdown. ${a} can see the numbers. ${n} learned to read the decay rate of every system — physical, biological, social — and to accelerate or decelerate it at will.`,
    (n,a)=>`${n} was holding their grandmother\'s hand when she died. In that moment, ${n} felt the exact mechanism — not the medical process but the thermodynamic one. The precise transaction by which organized matter surrenders its structure. ${a} has been studying that transaction ever since, and has learned to initiate it on demand.`,
    (n,a)=>`The rust started on ${n}\'s bicycle chain. Then the car. Then the railing they were holding. Every piece of metal ${n} touched aged decades in seconds. ${a} spent the first year of their power wearing gloves and not touching anyone. The second year, they took the gloves off.`,
    (n,a)=>`${n} doesn\'t describe their power as destructive. ${a} describes it as honest. Everything ends. Most people live in denial of this. ${a} lives in partnership with it — working alongside the second law of thermodynamics rather than pretending it doesn\'t apply.`,
  ],
  cosmic:[
    (n,a)=>`${n} looked up one night and the sky looked back. The scale shift was instantaneous — from human to cosmic. ${a} now operates at a resolution where planets are local and light-years are commutable.`,
    (n,a)=>`What ${a} perceives cannot be fully communicated to minds that operate at human scale. ${n} tries, sometimes, to describe what it is like to feel gravity as architecture and time as texture. The words always fall short.`,
    (n,a)=>`${n} was an astronomer at a university observatory when the telescope broke — not the equipment, but the distance. The light from a star forty light-years away arrived in ${n}\'s visual cortex without passing through the lens. ${a} has been receiving signals from increasingly distant sources ever since, and some of them are not stars.`,
    (n,a)=>`The vertigo lasted three months. ${n}\'s spatial perception had been rewritten to include dimensions that the human brain was never meant to model. When ${a} finally stabilized, "up" and "down" had become optional orientations, and the curvature of spacetime had become as visible as color.`,
    (n,a)=>`${n} describes the awakening as depersonalization at a cosmic scale — the sudden, irreversible awareness that the self is a process occurring on a planet that is a speck in a galaxy that is a speck in a supercluster that is a speck. ${a} did not lose their humanity. They gained perspective on exactly how small it is.`,
  ],
  generic:[
    (n,a)=>`${n} doesn\'t fit neatly into any category — and that\'s the point. ${a} emerged from the collision of principles that weren\'t supposed to intersect. The result is something the classification systems can\'t fully describe.`,
    (n,a)=>`Nobody trained ${n} to become ${a}. There is no origin story that satisfies. One day ${n} couldn\'t do what ${a} does. The next day, ${n} could. The gap between those two days contains a mystery that ${a} has stopped trying to solve.`,
    (n,a)=>`${n} was unremarkable until they weren\'t. The power arrived without ceremony, without drama, without the narrative weight that stories like this are supposed to carry. ${a} simply woke up different and had to decide what to do about it.`,
    (n,a)=>`The origin is classified — not by any government agency, but by ${n} personally. ${a} has decided that the details of how they became what they are would do more harm than good if made public. The power speaks for itself. The backstory is on a need-to-know basis.`,
    (n,a)=>`${n} describes the moment of awakening as quiet. Not a detonation. Not a transformation. A reclassification. The person they were and the person they became are the same individual — ${a} just has access to more of what was always there.`,

const HERO_IMPACT={
  thermal:[
    (n,a)=>`The heat changed how ${n} relates to people. Proximity became a calculation — how close can someone stand before the ambient temperature becomes uncomfortable? ${a} learned to modulate, to bank the internal furnace to safe levels, but intimacy requires trust that the regulation won't slip. Not everyone is willing to take that bet.`,
    (n,a)=>`${a} thinks faster when they're hot. The power didn't just change ${n}'s body — it rewired the relationship between emotional intensity and cognitive performance. Calm feels like operating at half capacity. Fury feels like clarity. This is, ${n} acknowledges, a dangerous incentive structure.`,
    (n,a)=>`${n} learned to cook. Not for nutrition — for calibration. The precise temperature control required to sear a steak without incinerating the pan is the same control required to shake someone's hand without leaving a blister. ${a} practices domesticity the way a surgeon practices sutures: because the fine motor control keeps the gross motor control from becoming a liability.`,
    (n,a)=>`People assume the hardest part of ${a}'s power is the heat. It isn't. It's the cold. The moments between burns, when the internal temperature drops to baseline and the world goes flat — no urgency, no intensity, no fire. ${n} has learned to fear the cold the way other people fear the dark: not because it's dangerous, but because of what lives in the absence.`,
    (n,a)=>`${n}'s apartment has no curtains. The walls are bare concrete. The furniture is steel frame. Everything ${a} owns is selected for a single criterion: flammability. The aesthetic is industrial by necessity, not choice. ${n} had a wooden bookshelf once. The books survived. The shelf didn't. The lesson was expensive and permanent.`,

  void:[
    (n,a)=>`The hardest part isn't the power. It's the loneliness that comes standard. ${n} can be in a room full of people and feel nothing — because the void doesn't recognize the presence of others as meaningful data. ${a} has to consciously choose to engage with reality in a way that most people never have to think about.`,
    (n,a)=>`${a} lost the ability to be photographed. Then recorded. Then reliably remembered by acquaintances. The void erodes ${n}'s presence in every medium — digital, chemical, neurological. Being known requires constant maintenance. Being forgotten is the default state.`,
    (n,a)=>`${n} sleeps in a room with no mirrors. Reflections behave unreliably when ${a} is nearby — not disappearing, exactly, but lagging. Showing a version of ${n} from two seconds ago, or ten, or an hour. The mirror doesn't know which version of ${a} to display. Neither does ${n}, some mornings.`,
    (n,a)=>`Touch is different now. ${n}'s hands pass through things when concentration lapses — not violently, not dramatically, but with a gentle non-commitment to physical presence that makes holding a coffee cup an act of focused will. ${a} has broken fewer things than people expect. ${a} has dropped more.`,
    (n,a)=>`${n} attended their own funeral. Not as a stunt — as an accident. The void had pulled them out of perceptible reality for long enough that the people who knew ${n} assumed the worst. ${a} stood in the back row, fully present, completely invisible, listening to strangers describe a person they thought was dead. The eulogy was inaccurate. ${n} has never corrected it.`,
  ],
  temporal:[
    (n,a)=>`${n} has seen their own death. Several versions of it. The knowledge doesn't make ${a} reckless — it makes them precise. Every action is weighted against a future that ${n} has already visited, every decision informed by outcomes that haven't happened yet in anyone else's timeline.`,
    (n,a)=>`Relationships are difficult when you've already seen how they end. ${n} tries not to look, but the future bleeds through — not as visions, but as a kind of emotional foreknowledge. ${a} knows which friendships will last and which won't. They try to invest in both equally. They mostly fail.`,
    (n,a)=>`${n} ages at a rate that doesn't match the calendar. Some days pass in what feels like minutes. Some minutes stretch into what feels like days. The biological clock and the temporal clock disagree about everything, and ${a}'s body splits the difference in ways that no physician can explain.`,
    (n,a)=>`The worst part is the d\u00e9j\u00e0 vu. Not the casual, harmless kind — the crushing, comprehensive kind where ${n} realizes that the last four hours have been a loop they've already completed twice. ${a} has learned to check for temporal echoes the way other people check for phone notifications: compulsively, anxiously, multiple times per hour.`,
    (n,a)=>`${n} can't watch movies anymore. The narrative structure is visible — not as story, but as temporal architecture. Every scene carries the weight of the scenes it will cause. Every line of dialogue echoes forward into consequences that ${a} can feel but the characters can't. Entertainment requires the ability to not know what happens next. ${n} has lost that ability.`,

  mental:[
    (n,a)=>`${n} had to rebuild their personality from scratch after the awakening. The influx of foreign thoughts, emotions, and memories overwhelmed the original identity. What exists now as ${a} is a reconstructed self — assembled deliberately from the pieces that felt most authentic, which is a deeply strange thing to have to decide about your own personality.`,
    (n,a)=>`Trust is complicated when you can verify it. ${n} knows who is loyal, who is lying, who is afraid. ${a} chooses not to act on most of this information — but the choice is constant, exhausting, and never fully resolved. Is it ethical to trust someone because you've confirmed their trustworthiness without their consent?`,
    (n,a)=>`${n} learned three new languages in the first month — not by studying, but by proximity. Standing near a native speaker for ten minutes is enough. The language transfers, whole and functional, like a file download. ${a} now speaks eleven languages fluently and cannot always identify which one they're thinking in.`,
    (n,a)=>`Crowds are the worst. Not because of the noise — ${a} learned to filter cognitive noise within weeks. Because of the patterns. In any group larger than twenty, ${n} can feel the emergent dynamics forming: who will lead, who will follow, who will dissent, who will be scapegoated. The patterns are so consistent, so predictable, that ${a} sometimes forgets that the people producing them have free will.`,
    (n,a)=>`${n}'s memory is no longer purely personal. The boundary between ${a}'s own experiences and the experiences they've absorbed from others has become porous. ${n} remembers childhoods they didn't live, traumas they didn't suffer, joys they didn't earn. The composite memory is richer than any single life. It is also, occasionally, someone else's.`,
  ],
  kinetic:[
    (n,a)=>`${n} broke three phones in the first month. The calibration between "enough force to press a button" and "too much force" had to be relearned from scratch. ${a} moves through the world with the constant awareness that every casual interaction carries the potential for catastrophic over-application.`,
    (n,a)=>`The power made ${n} more physical in every way — more present in their body, more aware of kinetic potential, more sensitive to the mechanical reality of the world. ${a} sees structural vulnerabilities the way a musician sees sheet music — as a language they can't stop reading.`,
    (n,a)=>`Sleep is complicated. ${n}'s body twitches with unspent force — micro-movements that crack bed frames and shatter alarm clocks. ${a} has gone through fourteen mattresses in two years. The current one is a military-grade foam pad on a steel platform bolted to the floor. It's holding up. For now.`,
    (n,a)=>`${n} discovered that the power has a feedback loop: the more force they generate, the more force they want to generate. Momentum is not just physics — it's psychology. ${a} has learned to recognize the tipping point between controlled application and the pure, addictive rush of unrestricted output. Recognizing it and stopping at it are different skills.`,
    (n,a)=>`Handwriting is impossible. Typing is difficult. ${n} communicates primarily through voice and gesture because the fine motor control required to operate a pen without destroying it is a concentration tax that ${a} cannot afford to pay while also formulating thoughts. The world is not designed for someone who can punch through concrete but cannot sign their name legibly.`,
  ],
  bio:[
    (n,a)=>`${n}'s appearance has changed seven times since the awakening. Not dramatically — not a different person — but the biology optimizes continuously, adjusting bone density, muscle distribution, and metabolic efficiency in response to environmental pressure. ${a} doesn't look the same in every photo, and has stopped trying to maintain a consistent ID picture.`,
    (n,a)=>`The hunger is the hardest part. ${n}'s metabolism runs at a rate that would kill a normal human — the biological systems burn through calories like a furnace burns through coal. ${a} eats six full meals a day and still runs a deficit. The body is always building, always adapting, always hungry for raw material.`,
    (n,a)=>`${n} can feel their immune system working. Not as a sensation — as a process. White blood cells mobilizing, antibodies assembling, pathogens being identified and catalogued. ${a} experiences their own biology the way a general experiences a war: in real time, with tactical awareness, watching the small battles that determine the large outcomes.`,
    (n,a)=>`The first time ${n} regrew a tooth, it took two days. The second time, four hours. The biology learns. It optimizes. Each repair is faster, more efficient, more complete than the last. ${a} has stopped visiting dentists, doctors, and emergency rooms. The body handles its own maintenance. The body handles it aggressively.`,
    (n,a)=>`${n} smells different now. Not bad — different. The pheromone profile shifts with mood, with health, with intention. Animals react to ${a} before humans do: dogs tense, cats flee, birds go silent. The biological signal that ${n}'s body broadcasts is legible to every living thing except the humans standing next to them.`,

  wave:[
    (n,a)=>`Silence doesn't exist anymore. ${n} hears everything — the hum of electrical wiring in walls, the resonant frequency of window glass, the carrier wave of cell towers, the subsonic vibration of the tectonic plate beneath the city. ${a} has learned to filter, but the baseline is never zero. The quietest room ${n} has ever experienced still sounds like an orchestra tuning.`,

    (n,a)=>`${n} can't swim. Not because they don't know how — because they sink. The density shift was gradual enough that ${a} didn't notice until a pool party ended with ${n} walking across the bottom like a deep-sea diver. Water is no longer a medium. It's an obstacle.`,
    (n,a)=>`${n} has developed an emotional relationship with buildings. Not sentimentally — structurally. ${a} can feel the stress loads, the foundation settling, the micro-fractures in concrete that will become macro-problems in twenty years. Walking through a city is like walking through a patient list. Every structure is either healthy or dying, and ${a} can feel which.`,

  entropy:[
    (n,a)=>`${n} stopped keeping houseplants. Then pets. Then anything perishable. The proximity effect of ${a}'s power accelerates decay in their immediate environment — not dramatically, not dangerously, but enough that flowers wilt faster, food spoils sooner, and paint fades quicker in any room they occupy regularly.`,
    (n,a)=>`${a} sees expiration dates on everything. Not literally — but the entropic cost of every object, every system, every relationship is visible as a kind of overlay. ${n} knows how long everything will last. This makes them an exceptional engineer and a difficult person to have a conversation with about the future.`,
    (n,a)=>`${n}'s touch ages things. Subtly — a fingerprint on a photograph fades faster, a handshake leaves the other person's skin slightly drier, a pat on the back costs the shirt a few threads of structural integrity. ${a} has learned to touch quickly and lightly. Lingering contact is a gift they give sparingly.`,
    (n,a)=>`${n} can taste the age of food. Not the flavor — the entropy. Fresh bread and day-old bread taste different to ${a} in a way that has nothing to do with staleness and everything to do with the molecular degradation that ${n}'s palate has learned to read. Expiration dates are redundant. The tongue knows.`,
    (n,a)=>`Nostalgia is different for ${n}. Other people miss the past because it's gone. ${a} misses the past because they can measure, precisely, how much of it has been lost — not emotionally but materially. Every memory is tagged with a decay rate. Every cherished moment is accompanied by the knowledge of exactly how many of its physical traces have already disappeared.`,

    (n,a)=>`${n} has difficulty with scale. Not because they can't perceive it — because they perceive too much of it. A conversation about dinner plans requires ${a} to deliberately contract their awareness from stellar distances to the distance between two people at a table. It's like being asked to thread a needle while holding a telescope.`,
    (n,a)=>`Dreams are different now. ${n} doesn't dream in images or narratives — they dream in gravitational fields, in electromagnetic spectra, in the mathematical relationships between celestial bodies. ${a} wakes up every morning having processed information from distances that light takes years to travel.`,

    (n,a)=>`Time feels different at cosmic scale. ${n} has begun experiencing duration the way the universe does — not as a sequence of events but as a dimension, navigable and visible in its entirety. ${a} sees the past and future of celestial objects simultaneously, which makes the present feel like an arbitrary cross-section of something much larger.`,
    (n,a)=>`${n} has stopped eating for nutrition. The power sustains them through mechanisms that have more in common with stellar nucleosynthesis than metabolism. ${a} still eats — for taste, for routine, for the human ritual of sitting at a table and using utensils. But the body no longer requires it. The body is running on something else now, and ${n} is not entirely sure what.`,

    (n,a)=>`${a} has become a gardener. Literally — ${n} maintains a small plot where the plants grow at accelerated rates, responding to ${a}'s biological influence the way iron filings respond to a magnet. The garden is the one place where the power feels like a gift rather than a condition. Things grow there. ${n} grows there too.`,

    (n,a)=>`${n} has found a frequency that calms them. It's not a note — it's a relationship between notes, a harmonic ratio that the body recognizes as home. ${a} returns to it nightly, like a sailor returning to harbor, and the silence that follows is the closest thing to peace that a person who hears everything can achieve.`,
