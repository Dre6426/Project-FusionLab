function generateHeroName(seed){
  const first=HERO_FIRST_NAMES[((seed%HERO_FIRST_NAMES.length)+HERO_FIRST_NAMES.length)%HERO_FIRST_NAMES.length];
  const last=HERO_LAST_NAMES[(((seed>>4)%HERO_LAST_NAMES.length)+HERO_LAST_NAMES.length)%HERO_LAST_NAMES.length];
  const name=first+' '+last;
  if(heroes.some(h=>h.name===name)){
    const alt=HERO_LAST_NAMES[(((seed>>8)%HERO_LAST_NAMES.length)+HERO_LAST_NAMES.length)%HERO_LAST_NAMES.length];
    return first+' '+alt;
  }
  return name;
}

function generatePersonality(tags){
  const family=detectFamily(tags);
  const traitPool=HERO_TRAITS[family]||HERO_TRAITS.generic;
  const drivePool=HERO_DRIVES[family]||HERO_DRIVES.generic;
  const flawPool=HERO_FLAWS[family]||HERO_FLAWS.generic;
  const seed=abilityHash(tags.join('_'));

  // Pick 3 unique traits
  const t1=traitPool[((seed%traitPool.length)+traitPool.length)%traitPool.length];
  const t2=traitPool[(((seed>>3)%traitPool.length)+traitPool.length)%traitPool.length];
  const t3=traitPool[(((seed>>6)%traitPool.length)+traitPool.length)%traitPool.length];
  const traits=[t1];
  if(t2!==t1)traits.push(t2);
  if(t3!==t1&&t3!==t2)traits.push(t3);

  // Pick drive and flaw
  const drive=drivePool[(((seed>>9)%drivePool.length)+drivePool.length)%drivePool.length];
  const flaw=flawPool[(((seed>>12)%flawPool.length)+flawPool.length)%flawPool.length];

  return{traits:traits.slice(0,3),drive,flaw};
}

function generateBackstory(heroName,alias,tags){
  const family=detectFamily(tags);
  const originPool=HERO_ORIGINS[family]||HERO_ORIGINS.generic;
  const impactPool=HERO_IMPACT[family]||HERO_IMPACT.generic;
  const presentPool=HERO_PRESENT[family]||HERO_PRESENT.generic;
  const seed=abilityHash(heroName+alias);

  const origin=originPool[((seed%originPool.length)+originPool.length)%originPool.length](heroName,alias);
  const impact=impactPool[(((seed>>5)%impactPool.length)+impactPool.length)%impactPool.length](heroName,alias);
  const present=presentPool[(((seed>>10)%presentPool.length)+presentPool.length)%presentPool.length](heroName,alias);

  return origin+'\n\n'+impact+'\n\n'+present;
}

function getHeroIcon(power){
  if(power.gen===0)return power.icon;
  const family=detectFamily(power.tags||[]);
  const icons={thermal:'🔥',void:'🌑',temporal:'⏳',mental:'🧠',kinetic:'💥',bio:'🧬',wave:'〰️',earth:'⛰️',entropy:'💀',cosmic:'🌌'};
  return icons[family]||'⚡';
}

function canEnlistHero(power){
  return power.gen>0&&!heroes.some(h=>h.powerId===power.id);
}

function getHeroForPower(powerId){
  return heroes.find(h=>h.powerId===powerId)||null;
}

function enlistHero(powerId){
  const power=powers.find(p=>p.id===powerId);
  if(!power||!canEnlistHero(power))return;
  const seed=abilityHash('hero_'+powerId+'_'+heroCount);
  const name=generateHeroName(seed);
  const alias=power.name;
  const tags=power.tags||[];

  const hero={
    id:'hero_'+heroCount++,
    name,
    alias,
    powerId,
    personality:generatePersonality(tags),
    backstory:generateBackstory(name,alias,tags),
    icon:getHeroIcon(power),
    created:Date.now(),
  };
  heroes.push(hero);
  // Form bonds with existing heroes
  const newBonds=formBonds(hero);
  updateHeroBtn();
  updateEncBtn();
  autoSave();
  // Close info modal and open hero profile
  closeInfo();
  setTimeout(()=>openHeroProfile(hero.id),50);
  // Toast for new bonds
  if(newBonds.length){
    const top=newBonds.sort((a,b)=>b.rel.intensity-a.rel.intensity)[0];
    const t=REL_TYPES[top.rel.type];
    setTimeout(()=>showSaveToast(`${t.icon} New bond: ${hero.alias} ↔ ${top.other.alias} — ${t.name}`),600);
  }
  setTimeout(()=>checkWorldEvents(),1500);
  setTimeout(()=>rollCrisis(0.08),2500);
}

function updateHeroBtn(){
  const btn=document.getElementById('hero-hud-btn');
  if(!btn)return;
  const n=heroes.length;
  btn.textContent=n>0?`🦸 Heroes (${n})`:'🦸 Heroes';
  btn.classList.toggle('has-heroes',n>0);
}

function getLineageRelatives(power){
  // Direct parents, children, and siblings (share at least one parent)
  const relatives=new Set();
  const myParents=new Set(power.parentIds||[]);
  // Parents
  myParents.forEach(pid=>relatives.add(pid));
  // Children (powers that have this power as a parent)
  powers.filter(p=>p.parentIds&&p.parentIds.includes(power.id)).forEach(p=>relatives.add(p.id));
  // Siblings (share at least one parent)
  if(myParents.size>0){
    powers.filter(p=>p.id!==power.id&&p.parentIds&&p.parentIds.some(pid=>myParents.has(pid))).forEach(p=>relatives.add(p.id));
  }
  return relatives;
}

function getEligibleEvolutionSources(heroPower){
  const relatives=getLineageRelatives(heroPower);
  return powers.filter(p=>{
    if(p.id===heroPower.id)return false;           // Can't absorb yourself
    if(p.gen<1)return false;                         // Must be fused
    if(!relatives.has(p.id))return false;             // Must be lineage relative
    if(heroes.some(h=>h.powerId===p.id))return false; // Can't drain a hero's power
    return true;
  });
}

function previewEvolution(heroPower,sourcePower,completedArcCount){
  const gains={stats:{},tags:[],genUp:true};
  const losses={stats:{},tags:[]};

  // Find source's 2 highest stats
  const srcStats=Object.entries(sourcePower.stats).sort((a,b)=>b[1]-a[1]);
  const topStats=srcStats.slice(0,2);

  // Hero gains +1 to source's top 2 stats (capped at 10)
  for(const[stat,val] of topStats){
    const current=heroPower.stats[stat]||0;
    if(current<10){
      gains.stats[stat]=Math.min(10,current+1);
    }
  }

  // Arc bonus: +1 to weakest stats per completed arc (max 3 bonus points)
  const arcBonus=Math.min(3,completedArcCount);
  if(arcBonus>0){
    const heroStats=Object.entries(heroPower.stats).sort((a,b)=>a[1]-b[1]);
    const weakest=heroStats.filter(([k,v])=>v<10).slice(0,arcBonus);
    for(const[stat,val] of weakest){
      gains.stats[stat]=Math.min(10,(gains.stats[stat]||val)+1);
    }
  }

  // Find best tag to absorb — highest intensity tag from source not on hero
  const heroTagSet=new Set(heroPower.tags||[]);
  const absorbable=(sourcePower.tags||[])
    .filter(t=>!heroTagSet.has(t))
    .map(t=>{
      const def=TAG_DEFS[t]||LEGENDARY_TAGS[t]||MUTANT_TAGS[t];
      return{tag:t,intensity:def?.intensity||1};
    })
    .sort((a,b)=>b.intensity-a.intensity);

  if(absorbable.length>0&&(heroPower.tags||[]).length<8){
    gains.tags.push(absorbable[0].tag);
  }

  // Source loses: -1 to top 2 stats, loses absorbed tag
  for(const[stat,val] of topStats){
    losses.stats[stat]=Math.max(0,val-1);
  }
  if(gains.tags.length>0){
    losses.tags=gains.tags.slice();
  }

  return{gains,losses,arcBonus};
}

function executeEvolution(heroId,sourceId){
  const hero=heroes.find(h=>h.id===heroId);
  if(!hero)return false;
  const heroPower=powers.find(p=>p.id===hero.powerId);
  const source=powers.find(p=>p.id===sourceId);
  if(!heroPower||!source)return false;

  // Count completed arcs for this hero
  const completedArcs=storyArcs.filter(sa=>sa.completed&&(sa.heroA===heroId||sa.heroB===heroId)).length;
  const preview=previewEvolution(heroPower,source,completedArcs);

  // Apply gains to hero's power
  for(const[stat,val] of Object.entries(preview.gains.stats)){
    heroPower.stats[stat]=val;
  }
  if(preview.gains.tags.length>0){
    heroPower.tags=[...heroPower.tags,...preview.gains.tags].slice(0,8);
  }
  heroPower.gen+=1;
  heroPower.evolvedFrom=heroPower.evolvedFrom||[];
  heroPower.evolvedFrom.push({sourceId,sourceName:source.name,timestamp:Date.now()});

  // Recalculate quality grade
  const parents=heroPower.parentIds?heroPower.parentIds.map(id=>powers.find(p=>p.id===id)).filter(Boolean):[];
  const qResult=computeQualityScore(parents,heroPower.tags,null);
  heroPower.qualityGrade=qResult.grade;
  heroPower.qualityTotal=qResult.total;

  // Apply losses to source
  for(const[stat,val] of Object.entries(preview.losses.stats)){
    source.stats[stat]=val;
  }
  if(preview.losses.tags.length>0){
    source.tags=(source.tags||[]).filter(t=>!preview.losses.tags.includes(t));
  }
  source.drained=(source.drained||0)+1;

  // Invalidate caches
  invalidateAbilityCache(hero.powerId);
  invalidateAbilityCache(sourceId);

  // Re-render
  renderGrid();updateStats();renderArchetype();
  autoSave();

  return{preview,completedArcs};
}

function evaluateRelationship(heroA,heroB){
  const pA=powers.find(p=>p.id===heroA.powerId);
  const pB=powers.find(p=>p.id===heroB.powerId);
  if(!pA||!pB)return null;

  const famA=detectFamily(pA.tags||[]);
  const famB=detectFamily(pB.tags||[]);
  const driveIdxA=abilityHash((heroA.personality.drive||'')+'d')%100;
  const driveIdxB=abilityHash((heroB.personality.drive||'')+'d')%100;
  const flawIdxA=abilityHash((heroA.personality.flaw||'')+'f')%100;
  const flawIdxB=abilityHash((heroB.personality.flaw||'')+'f')%100;

  // 1. Family resonance
  const compat=(FAMILY_COMPAT[famA]||{})[famB]||0;
  const sameFam=famA===famB;

  // 2. Drive alignment (same drive family direction = aligned)
  const driveDiff=Math.abs(driveIdxA-driveIdxB);
  const drivesAligned=driveDiff<30;
  const drivesOpposed=driveDiff>70;

  // 3. Flaw friction
  const flawDiff=Math.abs(flawIdxA-flawIdxB);
  const flawsSimilar=flawDiff<25;
  const flawsOpposed=flawDiff>65;

  // 4. Lineage bond
  const parA=new Set(pA.parentIds||[]);
  const parB=new Set(pB.parentIds||[]);
  const sharedLineage=[...parA].some(id=>parB.has(id));

  // 5. Gen difference
  const genDiff=Math.abs(pA.gen-pB.gen);

  // Determine type
  let type='wild';
  let intensity=2;

  if(sameFam&&drivesAligned&&!flawsOpposed){
    type='kindred';intensity=sharedLineage?5:driveDiff<15?4:3;
  } else if(sameFam&&flawsOpposed){
    type='foil';intensity=4;
  } else if(sameFam&&drivesOpposed){
    type='mirror';intensity=3;
  } else if(compat<=-2&&drivesOpposed){
    type='sworn';intensity=5;
  } else if(compat<=-1&&drivesAligned){
    type='reluctant';intensity=4;
  } else if(compat>=2&&drivesOpposed){
    type='rival';intensity=driveDiff>85?4:3;
  } else if(genDiff>=2&&compat>=1){
    type='mentor';intensity=genDiff>=3?4:3;
  } else if((famA==='earth'||famA==='bio')&&(famB==='thermal'||famB==='kinetic'||famB==='entropy')){
    type='anchor';intensity=3;
  } else if((famB==='earth'||famB==='bio')&&(famA==='thermal'||famA==='kinetic'||famA==='entropy')){
    type='anchor';intensity=3;
    // Swap so anchor is always heroA perspective from the stable one
  } else if(!flawsSimilar&&!flawsOpposed&&Math.abs(flawIdxA-(100-driveIdxB))<20){
    type='catalyst';intensity=4;
  } else if(compat>=1&&!drivesOpposed){
    type='kindred';intensity=2;
  } else if(compat<=-1){
    type='rival';intensity=2;
  } else {
    type='wild';intensity=Math.random()>.5?2:3;
  }

  // Clamp intensity
  if(sharedLineage)intensity=Math.min(intensity+1,5);
  if(window._worldBondBonus&&intensity<2)intensity=2;
  intensity=Math.max(1,Math.min(5,intensity));

  return{type,intensity,famA,famB};
}

function generateBondNarrative(heroA,heroB,type,intensity){
  const pool=REL_NARRATIVES[type];
  if(!pool)return'An undefined bond connects them.';
  const seed=abilityHash(heroA.id+heroB.id+type);
  const useDeep=intensity>=4&&pool.deep&&pool.deep.length>0;
  const templates=useDeep?pool.deep:pool.short;
  const idx=((seed%templates.length)+templates.length)%templates.length;
  return templates[idx](heroA,heroB);
}

function formBonds(newHero){
  const newBonds=[];
  for(const other of heroes){
    if(other.id===newHero.id)continue;
    // Skip if bond already exists
    if(relationships.some(r=>(r.heroA===newHero.id&&r.heroB===other.id)||(r.heroA===other.id&&r.heroB===newHero.id)))continue;

    const eval_=evaluateRelationship(newHero,other);
    if(!eval_)continue;

    const narrative=generateBondNarrative(newHero,other,eval_.type,eval_.intensity);
    const rel={
      id:'rel_'+relationships.length,
      heroA:newHero.id,
      heroB:other.id,
      type:eval_.type,
      intensity:eval_.intensity,
      narrative,
      created:Date.now(),
    };
    relationships.push(rel);
    newBonds.push({rel,other});
  }
  return newBonds;
}

function getHeroRelationships(heroId){
  return relationships.filter(r=>r.heroA===heroId||r.heroB===heroId).map(r=>{
    const otherId=r.heroA===heroId?r.heroB:r.heroA;
    const other=heroes.find(h=>h.id===otherId);
    return{...r,other};
  }).filter(r=>r.other);
}

function renderRelationshipSection(heroId,powerColor){
  const rels=getHeroRelationships(heroId);
  if(!rels.length)return'';
  return`
    <div class="hp-divider" id="hp-s-bonds"><span class="hp-divider-label">Bonds — ${rels.length} Relationship${rels.length!==1?'s':''}</span></div>
    ${rels.map(r=>{
      const t=REL_TYPES[r.type]||REL_TYPES.wild;
      const otherPower=powers.find(p=>p.id===r.other.powerId);
      const oColor=otherPower?.color||'#888';
      const encCount=getPairEncounterCount(heroId,r.other.id);
      return`<div class="rel-card" style="--rel-color:${t.color}" onclick="this.classList.toggle('expanded')">
        <div class="rel-header">
          <span class="rel-type-badge" style="background:${t.color}18;color:${t.color};border:1px solid ${t.color}33">${t.icon} ${t.name}</span>
          <span class="rel-hero-name" style="color:${oColor}">${r.other.alias}</span>
          <span style="font-size:10px;color:var(--text3)">${r.other.name}</span>
          ${encCount?`<span style="font-size:9px;color:var(--text3)">${encCount}×</span>`:''}
          <div class="rel-intensity">${[1,2,3,4,5].map(i=>`<span class="rel-dot${i<=r.intensity?' active':''}"></span>`).join('')}</div>
        </div>
        <div class="rel-narrative" style="white-space:pre-line">${r.narrative}</div>
      </div>`;
    }).join('')}`;
}

    (a,b)=>`${a.alias} references something from before the fracture without thinking. The memory lands between them like a coin dropped in a quiet room. Both hear it. Neither picks it up. The moment passes, and the conversation continues on the other side of the silence.`,
    (a,b)=>`They are more useful to each other now than they were before the fracture. The opposition sharpens what the agreement used to dull. ${a.alias} thinks better when ${b.alias} is pushing back, and ${b.alias} plans better when ${a.alias} is poking holes. The fracture was a loss of comfort. It was a gain of function.`,
    (a,b)=>`${b.alias} says something that the old ${a.alias} would have agreed with immediately. The new ${a.alias} pauses. The pause is the fracture — the space where automatic agreement used to live, now occupied by deliberate evaluation. The evaluation reaches the same conclusion. The route is different. The route matters.`,
    (a,b)=>`Someone who didn't know their history would assume ${a.alias} and ${b.alias} are colleagues. Cordial, efficient, professionally warm. The truth is underneath — a foundation of shared origin, divergent paths, and the mutual decision that the divergence was more respectful than pretending it didn't exist.`,
    (a,b)=>`The fracture gave them something that closeness couldn't: perspective. ${a.alias} sees ${b.alias} more clearly from this distance than they ever did up close. The foil's gift is not comfort — it's visibility. They see each other now. They see each other completely.`,
    (a,b)=>`${a.alias} and ${b.alias} leave the encounter in different directions, as they always do now. The divergence is physical and philosophical and permanent. Neither looks back. Both know exactly where the other is going. The fracture didn't destroy the connection — it gave it a direction. Two directions.`,
  ],
  truce:[
    (a,b)=>`The truce holds. Not because it's easy — because both of them have decided, independently and irrevocably, that the alternative is worse. The respect they've built from opposition is more durable than anything friendship could have provided.`,
    (a,b)=>`There's a shorthand between them now — the kind that only develops between people who have been enemies and chosen to stop. The efficiency of their cooperation carries the specific weight of two people who know exactly what the other is capable of when the cooperation fails.`,
    (a,b)=>`${b.alias} defers to ${a.alias} on a tactical call, and the deference is genuine. Not submission — recognition. The truce has taught them both that the other's judgment, while built from different premises, arrives at conclusions worth trusting.`,
    (a,b)=>`The old animosity surfaces occasionally — a flash of the sworn opposition that preceded the truce. ${a.alias} feels it. ${b.alias} feels it. Neither acts on it. The discipline of the truce is stronger than the reflex of the feud, and both of them are quietly proud of that fact.`,
    (a,b)=>`${a.alias} makes a joke at ${b.alias}'s expense. ${b.alias} laughs. The laugh is genuine. Three months ago, the same joke would have been an act of war. The truce has not made them friends. It has made them people who can laugh at each other without reaching for weapons.`,
    (a,b)=>`They sit on the same side of the table now. Not by design — by drift. The truce has rearranged their spatial habits the way all significant relationships do: slowly, without announcement, until someone notices that the former enemies are operating as a unit and neither of them can identify when the transition happened.`,
    (a,b)=>`${a.alias} covers for ${b.alias} without being asked — instinct overriding the residual opposition. The truce has rewired reflexes that the feud originally installed. The body has accepted the ceasefire faster than the mind. ${a.alias} doesn't examine the instinct too closely. Examining it might break it.`,
    (a,b)=>`Someone mentions the old conflict in conversation. ${a.alias} and ${b.alias} exchange a glance that contains an entire debriefing. The glance says: we were that. We are not that now. The distance between those two states is the measure of what the truce cost. The truce was worth the cost.`,
    (a,b)=>`The truce has a texture that neither expected — not warmth, exactly, but the specific comfort of predictability. ${a.alias} knows exactly where ${b.alias} stands. The position is opposed to their own. The opposition is stable, managed, and oddly reassuring. The enemy you understand is safer than the friend you don't.`,
    (a,b)=>`${b.alias} asks ${a.alias} for an opinion. Not a tactical opinion — a personal one. The request crosses a line that the truce technically doesn't cover, and both of them feel the boundary flex. ${a.alias} answers honestly. The honesty costs something. The truce absorbs the cost without breaking.`,
    (a,b)=>`They disagree about everything except the things that matter. The truce hasn't resolved their philosophical differences — it has sorted them into categories: differences that require opposition and differences that can coexist. The sorting was the hard part. The coexistence is the reward.`,
    (a,b)=>`${a.alias} would never call ${b.alias} an ally. The word is too warm and too imprecise. What they have is colder and more reliable: a non-aggression pact backed by mutual respect, maintained by the shared memory of what it cost to establish, and reinforced every time they choose the truce over the reflex.`,
  ],
  succession:[
    (a,b)=>`${a.alias} watches ${b.alias} work and sees the echo of lessons taught years ago, applied in ways that the teacher never imagined. The student has surpassed the mentor. The mentor has found peace in the surpassing — and a new purpose in its wake.`,
    (a,b)=>`They are equals now, in the specific way that only a mentor and a graduated student can be. The hierarchy is gone. What remains is a mutual respect built on the foundation of everything ${a.alias} gave and everything ${b.alias} built from it.`,
    (a,b)=>`The succession changed both of them. ${b.alias} carries the weight that ${a.alias} set down, and carries it differently. ${a.alias} has expanded into territory that the mentorship never allowed time for. They are both more than they were. They both know why.`,
    (a,b)=>`${b.alias} does something that ${a.alias} taught them — but better. The improvement is not a correction. It is an evolution. ${a.alias} recognizes the seed of their teaching in the flower of ${b.alias}'s execution, and the recognition fills them with something that is too specific to be called pride. It is closer to completion.`,
    (a,b)=>`${a.alias} asks ${b.alias} for advice. The reversal is deliberate and unselfconscious — the natural consequence of a succession that left both parties standing. The student's perspective has become valuable to the teacher. The hierarchy didn't invert. It dissolved.`,
    (a,b)=>`They collaborate now the way two architects collaborate — each bringing a different expertise to the same structure, neither subordinate, both essential. The mentorship built the foundation. The succession built the capacity for partnership. What they have now is the payoff of both.`,
    (a,b)=>`${a.alias} corrects a mistake ${b.alias} makes, and the correction lands without friction — teacher reflexes still sharp, student receptors still open. The channel between them is permanent. The content has changed — the corrections are rarer now, and more nuanced — but the channel itself remains.`,
    (a,b)=>`${b.alias} teaches someone else a technique that ${a.alias} originally taught them. ${a.alias} overhears the lesson and notes, with quiet satisfaction, that the explanation is better than theirs was. The knowledge has been improved in transit. This is what succession is for.`,
    (a,b)=>`They finish each other's tactical assessments — not because they think alike, but because ${a.alias} taught ${b.alias} the framework and ${b.alias} extended it. The shared language of the mentorship persists even though the mentorship itself has graduated into something horizontal.`,
    (a,b)=>`${a.alias} sees ${b.alias} struggle with something and doesn't intervene. The restraint is deliberate — the final lesson of the succession: the student must be allowed to find their own solutions, even when the mentor's solution is faster. Especially when the mentor's solution is faster.`,
    (a,b)=>`${b.alias} makes a decision that ${a.alias} would never have made. The decision works. ${a.alias} adds it to their own repertoire without comment. The succession is not just the student learning from the teacher — it is the teacher learning from what the student became. The education never stopped. It just became bidirectional.`,
    (a,b)=>`They share a silence that contains no awkwardness. The silence is the sound of two people who have exhausted the teacher-student dynamic and settled into something rarer: mutual recognition. ${a.alias} sees a peer. ${b.alias} sees a peer. The mentorship made this possible. The succession made it real.`,
  ],
  reckoning:[
    (a,b)=>`The rivalry has been stress-tested to failure and survived. Everything between ${a.alias} and ${b.alias} is post-reckoning now — sharper, more honest, stripped of the performative layer that made it possible to pretend the competition was casual.`,
    (a,b)=>`They fight differently since the reckoning. The moves are cleaner. The feints are fewer. Two people who have seen each other's absolute ceiling don't waste time on posturing — they operate at the level the other demands, because anything less would be an insult.`,
    (a,b)=>`${a.alias} and ${b.alias} have an understanding that predates language. It was forged in the reckoning — the moment where the rivalry stopped being theoretical and became physical, permanent, and clarifying.`,
    (a,b)=>`${b.alias} pushes ${a.alias} harder than anyone else does. Not out of malice — out of the specific knowledge, earned in the reckoning, of exactly how much ${a.alias} can take. The pushing is a form of respect. It is the rival's gift: the refusal to let the other be comfortable.`,
    (a,b)=>`The reckoning left marks that neither discusses and both carry. Not scars — calibrations. ${a.alias} adjusts for ${b.alias} now the way a ship adjusts for a known current: automatically, precisely, with the deep familiarity of someone who has charted the water by nearly drowning in it.`,
    (a,b)=>`When ${a.alias} succeeds, ${b.alias} is the first to notice and the last to acknowledge it. When ${b.alias} fails, ${a.alias} says nothing but adjusts their own performance upward. The reckoning made the rivalry efficient. The competition is no longer about winning. It is about deserving.`,
    (a,b)=>`${a.alias} knows ${b.alias}'s recovery time, fatigue threshold, and preferred opening move. ${b.alias} knows the same about ${a.alias}. The reckoning turned them into each other's most comprehensive database. The rivalry is informed now — surgical where it used to be blunt.`,
    (a,b)=>`They warm up differently when the other is watching. Longer. More deliberate. The reckoning taught them both that showing up at anything less than full capacity is not just a personal failure — it's a disrespect to the opponent who earned the right to face them at their best.`,
    (a,b)=>`${b.alias} finds a new technique. ${a.alias} adapts within the hour. The arms race between them has become the primary engine of both their development. Without the rival, the growth would slow. Without the reckoning, the rivalry would still have guardrails. The guardrails are gone. The growth is exponential.`,
    (a,b)=>`Someone asks ${a.alias} who their greatest opponent is. The answer is immediate, requires no thought, and surprises no one. The reckoning settled the question permanently. ${b.alias}, asked the same question separately, gives the same answer. The symmetry is the rivalry's signature.`,
    (a,b)=>`They respect each other in the specific way that only rivals can — not for who they are, but for what they force the other to become. The reckoning was the moment that respect crystallized from theory into fact. Everything since has been confirmation.`,
    (a,b)=>`${a.alias} catches ${b.alias} watching them train. ${b.alias} doesn't look away. The observation is open, deliberate, analytical — the rival's version of studying. ${a.alias} trains harder because ${b.alias} is watching. This is the point. This has always been the point.`,
  ],
  cracked_foundation:[
    (a,b)=>`The repair is visible if you know where to look. The bond between ${a.alias} and ${b.alias} carries a scar where the betrayal landed — not a weakness, but a mark. Scar tissue is stronger than skin. They both know this. They both wish it wasn't relevant.`,
    (a,b)=>`Trust, once cracked and rebuilt, has a different texture than trust that was never tested. What ${a.alias} and ${b.alias} have now is not the effortless confidence of the untested — it's the deliberate, maintained certainty of two people who have seen the crack and chosen to reinforce rather than replace.`,
    (a,b)=>`${b.alias} still flinches, occasionally, at the specific frequency of ${a.alias}'s flaw. The flinch is smaller than it was. It may never fully disappear. ${a.alias} notices every time and says nothing, because the noticing is itself a form of vigilance — a promise that the foundation will not crack again.`,
    (a,b)=>`${a.alias} overcompensates sometimes — reaches too far in the other direction, bends where standing firm would be fine. The overcorrection is the ghost of the betrayal, still shaping behavior months after the crack was repaired. ${b.alias} sees it. ${b.alias} allows it. The grace period has no expiration date.`,
    (a,b)=>`The foundation they rebuilt is not the same foundation. It is heavier, more deliberately constructed, reinforced in places the original never needed reinforcing. ${a.alias} and ${b.alias} built it together this time, and the shared labor is itself a form of repair.`,
    (a,b)=>`There are conversations they have now that they couldn't have had before the crack. The betrayal opened a register of honesty that the original, untested bond kept sealed. What they lost in comfort they gained in depth. Neither would choose the betrayal. Both have chosen what it made possible.`,
    (a,b)=>`${a.alias} makes a promise. The weight of the promise is heavier than it would be between two people with an untested bond — because ${b.alias} knows the precise cost of a broken one. The promise is not casual. It is load-bearing. ${a.alias} treats it accordingly.`,
    (a,b)=>`${b.alias} trusts ${a.alias} with something fragile. The trust is a test — not a conscious one, but the kind that the subconscious administers when it needs to verify that the repair is holding. ${a.alias} handles the fragile thing carefully. The test passes. The subconscious updates its records.`,
    (a,b)=>`The betrayal comes up in conversation — not as accusation, but as reference point. They can talk about it now the way geologists talk about an earthquake: clinically, with professional interest in the damage patterns, neither denying the destruction nor being destroyed by the memory of it.`,
    (a,b)=>`${a.alias} does something unremarkable — keeps a small commitment, follows through on a minor detail. ${b.alias} notices. The noticing is disproportionate to the act, because the cracked foundation made every small reliability a data point. The data points accumulate. The foundation strengthens. This is how repair works: not in grand gestures, but in the ordinary kept promises that nobody else would bother to track.`,
    (a,b)=>`They are gentler with each other now than they were before the crack. Not softer — gentler. The distinction matters. Softness would mean they've weakened. Gentleness means they've learned where the load-bearing walls are, and they don't lean on them casually anymore.`,
    (a,b)=>`${b.alias} defends ${a.alias} to a third party. The defense is fierce and automatic and surprises ${b.alias} more than anyone. The cracked foundation, fully repaired, has produced something the original never had: the specific loyalty that comes from choosing to stay when leaving was easier.`,
  ],
  metamorphosis:[
    (a,b)=>`${a.alias} is not the person they were before ${b.alias} entered their orbit. The metamorphosis is complete but its effects are permanent — a changed posture, a different reflex, a default setting that has been recalibrated by proximity to someone who made growth possible simply by existing.`,
    (a,b)=>`The butterfly remembers being the caterpillar. ${a.alias} carries the memory of who they were before the metamorphosis with the specific gratitude of someone who knows that the change was necessary and the catalyst was ${b.alias}.`,
    (a,b)=>`They interact differently now — with the ease of two people who have been through a transformation together and emerged on the other side with a shared vocabulary for what growth costs and what it provides.`,
    (a,b)=>`${a.alias} catches themselves mid-reaction — the old pattern activating, the flaw asserting its gravity — and corrects. The correction is fast enough now that only ${b.alias} would notice the delay. ${b.alias} notices. ${b.alias} says nothing. The silence is congratulatory.`,
    (a,b)=>`${b.alias} sees the version of ${a.alias} that exists now and remembers the version that existed before. The distance between those two people is the measure of the metamorphosis, and ${b.alias} is privately, fiercely proud of having been part of the catalyst — even though the growth belongs entirely to ${a.alias}.`,
    (a,b)=>`The metamorphosis is visible in small choices — moments where the old ${a.alias} would have flinched and the current ${a.alias} holds steady. ${b.alias} doesn't celebrate these moments. Celebration would imply they were remarkable. They're not remarkable anymore. They're default. That's the point.`,
    (a,b)=>`${a.alias} handles a situation that would have broken the old version of themselves. The handling is calm, competent, and unremarkable — which is exactly what makes it extraordinary. ${b.alias} watches from the periphery and knows, with certainty, that the metamorphosis took.`,
    (a,b)=>`Someone asks ${a.alias} about their flaw — the old one, the one that the metamorphosis addressed. ${a.alias} describes it in past tense. The past tense is not denial. It is accurate. The flaw is managed now, its gravity reduced, its automatic activation replaced by conscious choice. ${b.alias} made the choice possible. ${a.alias} makes the choice daily.`,
    (a,b)=>`${b.alias} pushes ${a.alias} on an old trigger — not deliberately, but in the natural course of a direct conversation. The trigger doesn't fire. The mechanism has been replaced. ${a.alias} responds with the patience of someone who has done the internal work, and ${b.alias} responds with the quiet satisfaction of someone who watched the work happen.`,
    (a,b)=>`The metamorphosis created a debt that ${a.alias} can never repay and ${b.alias} will never collect. The debt is not financial — it is existential. ${b.alias} made ${a.alias} possible. The current version of ${a.alias} would not exist without the catalyst. Both of them carry this knowledge. Neither weaponizes it.`,
    (a,b)=>`${a.alias} helps someone else through a similar transformation — recognizes the pattern, offers the specific kind of support that ${b.alias} once offered them. The chain continues. The metamorphosis is not just personal — it is transmissible. What ${b.alias} gave ${a.alias}, ${a.alias} is now capable of giving to others.`,
    (a,b)=>`They share a look that contains the entire arc — the resistance, the crack, the shedding, the emergence. The look takes a second. The history takes a paragraph to describe. The efficiency of the look is itself evidence of the metamorphosis: two people who have been through something together communicate at a compression ratio that makes language unnecessary.`,
  ],
  chaos_variable:[
    (a,b)=>`The chaos between ${a.alias} and ${b.alias} has been integrated. It hasn't stopped — it has been accepted, the way experienced sailors accept the ocean. The relationship is post-categorical, maintained by the mutual agreement that some things are more valuable undefined than defined.`,
    (a,b)=>`Nobody can predict what ${a.alias} and ${b.alias} will be to each other in any given moment. Including them. The chaos variable is not a bug — it's the feature. The unpredictability is the most honest thing about their bond.`,
    (a,b)=>`${a.alias} says something, and ${b.alias}'s response doesn't fit any category. It never does. The chaos between them has become a language — incomprehensible to observers, perfectly legible to participants.`,
    (a,b)=>`Observers have given up trying to map the dynamic between ${a.alias} and ${b.alias}. The taxonomy doesn't exist. What they have resists classification the way water resists being held — not because it's weak but because it's too fluid to be contained by the shapes other people offer.`,
    (a,b)=>`${b.alias} contradicts something they said to ${a.alias} last week. ${a.alias} doesn't point out the contradiction because the chaos variable long ago taught them that consistency is not the metric. Authenticity to the current moment is the metric. And in this moment, the contradiction is the most authentic thing either of them has said.`,
    (a,b)=>`The relationship shifts mid-encounter — a visible transition from one mode to another, so smooth that only someone who has been watching from the beginning would recognize the seam. ${a.alias} and ${b.alias} change gears together, wordlessly, with the synchronized unpredictability that is their signature.`,
    (a,b)=>`${a.alias} prepares for one version of ${b.alias} and gets another. The adjustment is instant — not because it's easy, but because the chaos has trained ${a.alias} to hold multiple versions of ${b.alias} in memory simultaneously, ready to engage whichever one shows up. The preparation is not for a person. It is for a range.`,
    (a,b)=>`They argue about something trivial with the intensity of something existential, then pivot to something existential with the lightness of something trivial. The tonal mismatch is their natural frequency. ${a.alias} and ${b.alias} operate on a wavelength that nobody else can tune to, and the static between stations is where they do their best work.`,
    (a,b)=>`${b.alias} does something completely unexpected, and ${a.alias}'s reaction is not surprise — it is recognition. The unexpected has become the expected. The chaos variable has recalibrated ${a.alias}'s entire anticipation system. Predictability, once valued, now feels like a limitation. ${b.alias} broke that limitation permanently.`,
    (a,b)=>`Someone asks ${a.alias} to describe their relationship with ${b.alias}. ${a.alias} opens their mouth, closes it, opens it again, and settles on a shrug that communicates more than any word could. The relationship resists description. The shrug is the most accurate summary available.`,
    (a,b)=>`The chaos between them has become productive. Ideas emerge from the disorder — solutions that no structured collaboration could have produced, born from the collision of perspectives that refuse to align. ${a.alias} and ${b.alias} don't solve problems together. They collide, and solutions fall out of the wreckage.`,
    (a,b)=>`${a.alias} and ${b.alias} end the encounter in a completely different relational mode than they started it. This is normal. This is their normal. The journey from start to finish is never a straight line, and the destination is never the one they planned. The map is useless. The territory is home.`,
  ],
  firewall:[
    (a,b)=>`The protection is mutual now. ${a.alias} and ${b.alias} take turns being the shield, with the practiced rotation of two people who have learned that the firewall holds longer when the load is shared.`,
    (a,b)=>`${b.alias} positions themselves between ${a.alias} and the threat without being asked. The movement is automatic — the reflex of an anchor who has already proven what they're willing to absorb for the person they're anchoring.`,
    (a,b)=>`There is a safety in proximity to each other that neither ${a.alias} nor ${b.alias} experiences anywhere else. The firewall they've built is not just protection — it's a home. A space where the defenses can come down because someone else is holding the perimeter.`,
    (a,b)=>`${a.alias} sleeps better when ${b.alias} is nearby. Not because of security — because of the specific absence of hypervigilance that only occurs when someone you trust completely is covering the angles you can't see. The firewall is not just physical. It is neurological. It is the ability to rest.`,
    (a,b)=>`They check on each other. Small gestures — a glance, a nod, a positioning adjustment that puts the other in a safer vector. The firewall is maintained through these micro-actions, accumulated continuously, the way a heartbeat maintains circulation: automatically, constantly, without conscious effort.`,
    (a,b)=>`${b.alias} takes a hit meant for ${a.alias}. The absorption is practiced, almost casual — the reflex of someone who has decided that this is their function and has stopped questioning whether the function is fair. ${a.alias} watches and resolves, again, to be worth the cost.`,
    (a,b)=>`${a.alias} says something vulnerable. In any other company, the vulnerability would be a risk. Here, it is absorbed — processed, acknowledged, and filed by ${b.alias} with the same care that the firewall applies to physical threats. The protection extends beyond the tactical. It covers the emotional. It covers everything.`,
    (a,b)=>`They have a ritual — a check-in, brief and coded, that translates to "I'm here, I'm functional, the perimeter is secure." The ritual predates language between them. It operates on a frequency that bypasses conversation and lands directly in the nervous system. The firewall is always on. The check-in confirms it.`,
    (a,b)=>`${b.alias} is injured. ${a.alias}'s response is immediate and disproportionate — not to the severity of the injury but to the principle that the injury represents: someone got through. The firewall was breached. ${a.alias}'s reaction is not anger — it is a system-wide audit of how the breach occurred and a silent commitment to ensuring it does not happen again.`,
    (a,b)=>`They position themselves in rooms without discussing it — ${a.alias} near the exit, ${b.alias} with the sightlines, or the reverse, depending on the threat model. The spatial awareness is a product of the firewall: two people who have agreed, through action rather than conversation, that each other's survival is non-negotiable.`,
    (a,b)=>`${a.alias} lets ${b.alias} handle something difficult alone. Not because the firewall has failed — because the firewall has evolved. Protection is not always intervention. Sometimes protection is trust. Sometimes the hardest thing the shield can do is step back and let the person they're shielding prove they can stand.`,
    (a,b)=>`The firewall between them is invisible to outsiders. No dramatic gestures, no announced protocols. Just two people who have quietly, systematically, and permanently made each other's safety a background process — running always, noticed never, effective unconditionally.`,
  ],
  terminal:[
    (a,b)=>`The disagreement is permanent, and both of them have made peace with its permanence. ${a.alias} and ${b.alias} oppose each other with the specific respect of two people who have accepted that this fight will last as long as they do — and that the fight is worth having.`,
    (a,b)=>`They argue like old chess opponents — with deep knowledge of each other's opening moves, mid-game strategies, and endgame tendencies. The terminal disagreement has become a form of intimacy. Nobody knows ${a.alias}'s position better than ${b.alias}. Nobody has tested it more rigorously.`,
    (a,b)=>`${a.alias} and ${b.alias} have protocols. The disagreement has infrastructure — rules for engagement, designated neutral zones, established boundaries. The protocols are not friendship. They are the product of two people who have decided that permanent opposition requires permanent management.`,
    (a,b)=>`${a.alias} anticipates ${b.alias}'s objection before it's voiced and adjusts the argument preemptively. ${b.alias} notices the adjustment and adjusts their counter. The exchange is invisible to everyone else in the room — a private chess match conducted at a frequency only the two of them can hear.`,
    (a,b)=>`The terminal disagreement has made both of them better. ${a.alias}'s position is stronger for having been attacked by ${b.alias} for years. ${b.alias}'s position is stronger for the same reason. They are sharpening stones for each other. Neither would admit that the opponent is the reason their blade still holds an edge.`,
    (a,b)=>`Someone new tries to mediate between ${a.alias} and ${b.alias}. The attempt is well-intentioned and completely unnecessary. The terminal disagreement doesn't need mediation — it needs witnesses. Two people maintaining the highest-quality opposition either of them has ever encountered don't need a peacemaker. They need an audience that understands what it's watching.`,
    (a,b)=>`${b.alias} concedes a minor point. The concession is tactical, not philosophical — a strategic retreat designed to strengthen the larger position. ${a.alias} recognizes the maneuver instantly because it's one they've used themselves. The terminal disagreement has made them fluent in each other's rhetorical grammar.`,
    (a,b)=>`They eat lunch separately, by protocol. The neutral zone between meals is one of the earliest boundaries established. The separation is not personal — it is structural. Two people in permanent opposition need spaces where the opposition is paused, and the cafeteria is one of those spaces. The protocol is never discussed. The protocol is never violated.`,
    (a,b)=>`${a.alias} reads something that supports ${b.alias}'s position. The information is processed, filed, and integrated into ${a.alias}'s model — not to change their mind, but to better understand the architecture of the opposition. The terminal disagreement demands comprehensive knowledge of the other side. Ignorance would be disrespectful.`,
    (a,b)=>`They defend each other to outsiders. Not each other's positions — each other's right to hold them. The terminal disagreement is an internal matter. External threats to either party are met with a unified front that surprises people who only see the opposition and miss the respect beneath it.`,
    (a,b)=>`${b.alias} is absent for a week. ${a.alias}'s arguments lose their edge. The sharpening stone is gone, and the blade dulls faster than expected. When ${b.alias} returns, ${a.alias}'s performance immediately improves. Neither mentions it. The dependency is mutual, unnamed, and permanent.`,
    (a,b)=>`The terminal disagreement has outlasted every other variable in both their lives. Jobs have changed, locations have shifted, other relationships have formed and dissolved. The opposition remains — the most durable structure either of them has built. The disagreement is not a burden. It is a monument. It is the thing they made together that will never be finished.`,
  ],
  forged:[
    (a,b)=>`What ${a.alias} and ${b.alias} have does not require maintenance. It requires acknowledgment — the daily, quiet recognition that the bond forged in fire is still burning, still strong, still the most stable element in both their lives.`,
    (a,b)=>`They move like a single system. The coordination is pre-verbal, born from accumulated data points that no training regimen could replicate — the product of every crisis survived, every argument resolved, every moment where the bond was tested and held without question.`,
    (a,b)=>`${a.alias} looks at ${b.alias} and sees the one thing in the world that they are absolutely certain of. The certainty is not romantic. It is structural. It is the foundation upon which everything else is built. It is unbreakable because they have both decided, independently and irrevocably, that it will not break.`,
    (a,b)=>`${a.alias} doesn't need to check if ${b.alias} is there. The presence is gravitational — felt without looking, confirmed without asking, as reliable as any physical law. The bond forged in fire doesn't flicker. It is beyond the point where external conditions can affect the output.`,

function getLegacyContext(heroAId,heroBId){
  const pairArcs=storyArcs.filter(sa=>sa.completed&&
    ((sa.heroA===heroAId&&sa.heroB===heroBId)||(sa.heroA===heroBId&&sa.heroB===heroAId)));
  if(!pairArcs.length)return null;
  const hA=heroes.find(h=>h.id===heroAId);
  const hB=heroes.find(h=>h.id===heroBId);
  if(!hA||!hB)return null;

  // Use the highest-priority completed arc for the legacy line
  const bestArc=pairArcs.sort((a,b)=>{
    const pA=ARC_PATTERNS.find(p=>p.id===a.patternId);
    const pB=ARC_PATTERNS.find(p=>p.id===b.patternId);
    return(pB?.priority||0)-(pA?.priority||0);
  })[0];

  const pattern=ARC_PATTERNS.find(p=>p.id===bestArc.patternId);
  if(!pattern)return null;
  const lines=LEGACY_LINES[bestArc.patternId];
  if(!lines||!lines.length)return null;

  const seed=abilityHash(heroAId+heroBId+bestArc.id+Date.now());
  const idx=((seed%lines.length)+lines.length)%lines.length;
  const text=lines[idx](hA,hB);

  return{
    text,
    arcName:pattern.name,
    arcIcon:pattern.icon,
    arcColor:pattern.color,
    patternId:bestArc.patternId,
  };
}

function resolveEncounterOutcome(encType,rel,heroA,heroB){
  const seed=abilityHash(heroA.id+heroB.id+encType+Date.now());
  const roll=((seed%100)+100)%100;
  let intensityShift=0;
  let typeShift=null;
  let label='';

  // Default: slight intensity boost for most encounters
  if(roll<40)intensityShift=1;
  else if(roll<55)intensityShift=0;
  else if(roll<70)intensityShift=-1;

  // Type-specific overrides
  switch(encType){
    case'crisis':
      intensityShift=roll<60?1:0;
      if(rel.type==='sworn'&&roll<25){typeShift='reluctant';label='Shared crisis forced grudging cooperation';}
      if(rel.type==='rival'&&roll<20){typeShift='kindred';label='Mutual respect crystallized under pressure';}
      if(rel.type==='reluctant'&&roll<30){intensityShift=2;label='Crisis proved the partnership is real';}
      break;
    case'betrayal':
      intensityShift=roll<30?-2:-1;
      if(rel.type==='kindred'&&roll<35){typeShift='foil';label='Trust fractured — they see each other differently now';}
      if(rel.type==='anchor'&&roll<25){typeShift='catalyst';label='The betrayal became a catalyst for growth';}
      if(rel.type==='mentor'&&roll<30){typeShift='rival';label='The student lost faith in the teacher';}
      break;
    case'rescue':
      intensityShift=roll<70?2:1;
      if(rel.type==='rival'&&roll<30){typeShift='reluctant';label='Hard to hate someone who saved your life';}
      if(rel.type==='wild'&&roll<40){typeShift='anchor';label='The rescue revealed a stabilizing bond';}
      break;
    case'revelation':
      if(roll<30)intensityShift=2;
      else if(roll<60)intensityShift=1;
      if(rel.type==='wild'&&roll<35){typeShift='catalyst';label='The truth revealed their real dynamic';}
      if(rel.type==='foil'&&roll<25){typeShift='kindred';label='Understanding replaced opposition';}
      if(rel.type==='mirror'&&roll<30){typeShift='foil';label='The secret exposed how different they really are';}
      break;
    case'clash':
      if(rel.type==='rival')intensityShift=roll<50?1:0;
      if(rel.type==='mirror'&&roll<20){typeShift='rival';label='Similarity became competition';}
      if(rel.type==='sworn')intensityShift=roll<40?1:0;
      break;
    case'philosophical':
      if(rel.type==='kindred'&&roll<15){typeShift='foil';label='A fundamental disagreement surfaced';}
      if(rel.type==='rival'&&roll<20){typeShift='reluctant';label='They found common ground beneath the competition';}
      if(rel.type==='foil')intensityShift=roll<50?1:0;
      break;
    case'downtime':
      intensityShift=roll<50?1:0;
      if(rel.type==='sworn'&&roll<15){typeShift='reluctant';label='A human moment softened the opposition';}
      if(rel.type==='wild'&&roll<30){typeShift='kindred';label='Off-duty honesty revealed genuine connection';}
      break;
    case'territorial':
      if(roll<40)intensityShift=1;
      if(rel.type==='kindred'&&roll<20){typeShift='rival';label='Shared territory created unexpected competition';}
      if(rel.type==='reluctant')intensityShift=roll<60?1:0;
      break;
    case'training':
      intensityShift=roll<55?1:0;
      if(rel.type==='mentor')intensityShift=roll<70?1:0;
      if(rel.type==='mirror'&&roll<20){typeShift='rival';label='Training revealed they\'re competing, not collaborating';}
      break;
    case'first_contact':
      intensityShift=roll<50?1:0;
      break;
  }

  // Build outcome description
  if(!label){
    if(intensityShift>0)label='Bond deepened through shared experience';
    else if(intensityShift<0)label='Distance grew between them';
    else label='The dynamic held steady — neither closer nor further';
  }

  return{intensityShift,typeShift,label,roll};
}

function selectEncounterType(relType){
  const weights=ENCOUNTER_WEIGHTS[relType]||ENCOUNTER_WEIGHTS.wild;
  const entries=Object.entries(weights).filter(([k,v])=>v>0);
  const totalWeight=entries.reduce((s,[k,v])=>s+v,0);
  let roll=Math.random()*totalWeight;
  for(const[type,weight] of entries){
    roll-=weight;
    if(roll<=0)return type;
  }
  return entries[entries.length-1][0];
}

function generateEncounterNarrative(heroA,heroB,encType,relType){
  const pool=ENCOUNTER_NARRATIVES[encType];
  if(!pool||!pool.length)return'The encounter unfolded in ways neither expected.';
  const seed=abilityHash(heroA.id+heroB.id+encType+encounterHistory.length);
  const idx=((seed%pool.length)+pool.length)%pool.length;
  return pool[idx](heroA,heroB,relType);
}

function triggerEncounter(heroAId,heroBId,forceType){
  const heroA=heroes.find(h=>h.id===heroAId);
  const heroB=heroes.find(h=>h.id===heroBId);
  if(!heroA||!heroB)return null;

  const rel=relationships.find(r=>
    (r.heroA===heroAId&&r.heroB===heroBId)||(r.heroA===heroBId&&r.heroB===heroAId));
  if(!rel)return null;

  const encType=forceType||selectEncounterType(rel.type);
  const narrative=generateEncounterNarrative(heroA,heroB,encType,rel.type);
  const legacy=getLegacyContext(heroAId,heroBId);
  const outcome=resolveEncounterOutcome(encType,rel,heroA,heroB);

  // Apply outcome
  const oldType=rel.type;
  const oldIntensity=rel.intensity;
  rel.intensity=Math.max(1,Math.min(5,rel.intensity+outcome.intensityShift));
  if(outcome.typeShift&&REL_TYPES[outcome.typeShift]){
    rel.type=outcome.typeShift;
    rel.narrative=generateBondNarrative(
      heroes.find(h=>h.id===rel.heroA),
      heroes.find(h=>h.id===rel.heroB),
      rel.type,rel.intensity);
  }

  const enc={
    id:'enc_'+encounterHistory.length,
    heroA:heroAId,heroB:heroBId,
    type:encType,
    relTypeBefore:oldType,relTypeAfter:rel.type,
    intensityBefore:oldIntensity,intensityAfter:rel.intensity,
    narrative:legacy?narrative+'\n\n'+legacy.text:narrative,
    outcomeLabel:outcome.label,
    typeShifted:!!outcome.typeShift,
    legacy:legacy?{arcName:legacy.arcName,arcIcon:legacy.arcIcon,arcColor:legacy.arcColor,patternId:legacy.patternId}:null,
    timestamp:Date.now(),
  };
  encounterHistory.push(enc);
  // Scan for new/progressed story arcs
  const arcUpdates=scanForArcs();
  if(arcUpdates.length){
    const first=arcUpdates[0];
    const p=ARC_PATTERNS.find(x=>x.id===first.arc.patternId);
    if(p){
      const msg=first.progressed
        ?`📜 Arc progressed: ${p.icon} ${p.name} — ${first.arc.beatLabels[first.arc.currentBeat]}`
        :`📜 New arc: ${p.icon} ${p.name} — ${first.hA.alias} × ${first.hB.alias}`;
      setTimeout(()=>showSaveToast(msg),800);
    }
  }
  autoSave();
  return enc;
}

function getPairEncounterCount(heroAId,heroBId){

function scanForArcs(){
  const newArcs=[];
  // PHASE 1: Progress existing arcs (may complete them, freeing pairs for new arcs)
  for(const arc of storyArcs){
    if(arc.completed)continue;
    const pattern=ARC_PATTERNS.find(p=>p.id===arc.patternId);
    if(!pattern)continue;
    const encs=getPairEncounters(arc.heroA,arc.heroB);
    const encsSinceArc=encs.filter(e=>e.timestamp>arc.lastUpdated);
    if(encsSinceArc.length===0)continue;
    const rel=relationships.find(r=>(r.heroA===arc.heroA&&r.heroB===arc.heroB)||(r.heroA===arc.heroB&&r.heroB===arc.heroA));
    const nextBeat=arc.currentBeat+1;
    const baseThreshold=nextBeat>=pattern.beats.length-1?2:1;
    const threshold=window._worldArcBoost?Math.max(1,baseThreshold-1):baseThreshold;
    if(encsSinceArc.length>=threshold&&nextBeat<pattern.beats.length){
      const hA=heroes.find(h=>h.id===arc.heroA);
      const hB=heroes.find(h=>h.id===arc.heroB);
      if(!hA||!hB)continue;
      arc.currentBeat=nextBeat;
      arc.completedBeats.push(pattern.beats[nextBeat].gen(hA,hB));
      arc.beatLabels.push(pattern.beats[nextBeat].label);
      arc.lastUpdated=Date.now();
      if(nextBeat>=pattern.beats.length-1)arc.completed=true;
      newArcs.push({arc,pattern,hA,hB,progressed:true});
    }
  }
  // PHASE 2: Scan for new arcs (completed arcs no longer block their pair)
  const sortedPatterns=[...ARC_PATTERNS].sort((a,b)=>(b.priority||0)-(a.priority||0));
  for(const pattern of sortedPatterns){
    for(const rel of relationships){
      if(storyArcs.some(sa=>sa.heroA===rel.heroA&&sa.heroB===rel.heroB&&(sa.patternId===pattern.id||!sa.completed)))continue;
      // Narrative bandwidth: max 2 active arcs per hero
      const heroAActive=storyArcs.filter(sa=>!sa.completed&&(sa.heroA===rel.heroA||sa.heroB===rel.heroA)).length;
      const heroBActive=storyArcs.filter(sa=>!sa.completed&&(sa.heroA===rel.heroB||sa.heroB===rel.heroB)).length;
      if(heroAActive>=2||heroBActive>=2)continue;
      const encs=getPairEncounters(rel.heroA,rel.heroB);
      if(pattern.match(rel,encs)){
        const hA=heroes.find(h=>h.id===rel.heroA);
        const hB=heroes.find(h=>h.id===rel.heroB);
        if(!hA||!hB)continue;
        const arc={
          id:'arc_'+storyArcs.length,
          patternId:pattern.id,
          heroA:rel.heroA,heroB:rel.heroB,
          currentBeat:0,
          completedBeats:[pattern.beats[0].gen(hA,hB)],
          beatLabels:[pattern.beats[0].label],
          totalBeats:pattern.beats.length,
          started:Date.now(),lastUpdated:Date.now(),
          completed:false,
        };
        storyArcs.push(arc);
        newArcs.push({arc,pattern,hA,hB});
      }
    }
  }
  return newArcs;
}

function renderHeroArcs(heroId){
  const heroArcs=storyArcs.filter(sa=>sa.heroA===heroId||sa.heroB===heroId);
  if(!heroArcs.length)return'';
  const active=heroArcs.filter(a=>!a.completed);
  const completed=heroArcs.filter(a=>a.completed);
  return`
    <div class="hp-divider" id="hp-s-arcs"><span class="hp-divider-label">Story Arcs — ${active.length?active.length+' active':''}${active.length&&completed.length?' · ':''}${completed.length?completed.length+' completed':''}</span></div>
    ${heroArcs.map(sa=>{
      const p=ARC_PATTERNS.find(x=>x.id===sa.patternId);
      if(!p)return'';
      const otherId=sa.heroA===heroId?sa.heroB:sa.heroA;
      const other=heroes.find(h=>h.id===otherId);
      if(!other)return'';
      return`<div style="padding:10px 14px;border-radius:10px;border:1px solid ${sa.completed?'rgba(251,191,36,.2)':'rgba('+p.rgb+',.2)'};background:${sa.completed?'rgba(251,191,36,.03)':'rgba('+p.rgb+',.03)'};margin-bottom:8px">

          <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.06em;color:${p.color}">${p.name}</span>
          <span style="font-size:10px;color:var(--text3)">with ${other.alias}</span>
          <span class="arc-status ${sa.completed?'completed':'active'}" style="margin-left:auto">${sa.completed?'Complete':'Act '+(sa.currentBeat+1)+'/'+sa.totalBeats}</span>
        </div>
        <div class="arc-progress" style="margin-bottom:4px">

}

function checkWorldEvents(){
  const fired=[];
  for(const evt of WORLD_EVENTS){
    if(worldEventLog.some(w=>w.id===evt.id))continue;
    if(evt.check()){
      evt.apply();
      const entry={id:evt.id,timestamp:Date.now()};
      worldEventLog.push(entry);
      fired.push(evt);
    }
  }
  if(fired.length>0){
    autoSave();
    renderGrid();updateStats();
    // Queue events sequentially — each waits for Continue click
    window._worldEventQueue=fired.slice();
    showNextWorldEvent();
  }
  return fired;
}

function showNextWorldEvent(){
  if(!window._worldEventQueue||!window._worldEventQueue.length)return;
  const evt=window._worldEventQueue.shift();
  showWorldEventReveal(evt);
}

function showWorldEventReveal(evt){
  const root=document.getElementById('world-event-root');
  root.innerHTML=`<div class="we-overlay">
    <div class="we-subtitle">WORLD EVENT</div>
    <div class="we-icon">${evt.icon}</div>
    <div class="we-title">${evt.name.toUpperCase()}</div>
    <div class="we-narrative">${evt.narrative}</div>
    <div class="we-effect">⚡ ${evt.effect}</div>
    <button class="enlist-btn" style="margin-top:16px;animation:bdin .6s ease 1s both;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#fbbf24" onclick="this.closest('.we-overlay').remove();showNextWorldEvent()">Continue</button>
  </div>`;
}

function renderWorldEventLog(){
  if(!worldEventLog.length)return'';
  return`
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">🌍 World Events — ${worldEventLog.length} occurred</div>
      ${worldEventLog.map(w=>{
        const evt=WORLD_EVENTS.find(e=>e.id===w.id);
        if(!evt)return'';
        return`<div class="we-log-card">
          <div class="we-log-header">
            <span style="font-size:18px">${evt.icon}</span>
            <span class="we-log-name">${evt.name}</span>
          </div>
          <div style="font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:6px">${evt.narrative}</div>
          <div class="we-log-effect">⚡ ${evt.effect}</div>
        </div>`;
      }).join('')}
    </div>`;
}

function rollCrisis(chance){
  if(_crisisCooldown>0){_crisisCooldown--;return;}
  if(Math.random()>chance)return;
  // Don't fire if any modal is open
  const modalRoots=['hero-root','modal-root','encounter-root','arena-root','teams-root','tutorial-root'];
  if(modalRoots.some(id=>{const el=document.getElementById(id);return el&&el.innerHTML.trim().length>0;}))return;
  // Pick eligible crisis
  const eligible=CRISIS_PROMPTS.filter(c=>!crisisLog.some(l=>l.id===c.id&&Date.now()-l.timestamp<300000)&&c.check());
  if(!eligible.length)return;
  const crisis=eligible[Math.floor(Math.random()*eligible.length)];
  _crisisCooldown=3; // Min 3 actions between crises
  showCrisisPrompt(crisis);
}

function showCrisisPrompt(crisis){
  const root=document.getElementById('crisis-root');
  root.innerHTML=`
    <div class="crisis-overlay">
      <div class="crisis-badge">⚠ CRISIS PROMPT</div>
      <div class="crisis-icon">${crisis.icon}</div>
      <div class="crisis-title">${crisis.name.toUpperCase()}</div>
      <div class="crisis-narrative">${crisis.narrative}</div>
      <div class="crisis-options">
        ${crisis.options.map((opt,i)=>`
          <div class="crisis-option" onclick="resolveCrisis('${crisis.id}',${i})">
            <div class="crisis-opt-label">${opt.label}</div>
            <div class="crisis-opt-desc">${opt.desc}</div>
            ${opt.cost?`<div class="crisis-opt-cost">⚠ ${opt.cost}</div>`:''}
            ${opt.gain?`<div class="crisis-opt-gain">✓ ${opt.gain}</div>`:''}
          </div>`).join('')}
      </div>
    </div>`;
}

function resolveCrisis(crisisId,optIndex){
  const crisis=CRISIS_PROMPTS.find(c=>c.id===crisisId);
  if(!crisis)return;
  const opt=crisis.options[optIndex];
  const resultText=opt.apply();
  crisisLog.push({id:crisisId,option:optIndex,label:opt.label,timestamp:Date.now()});
  autoSave();
  renderGrid();updateStats();

  const root=document.getElementById('crisis-root');
  root.innerHTML=`
    <div class="crisis-overlay">
      <div class="crisis-icon">${crisis.icon}</div>
      <div class="crisis-result">
        <div class="crisis-result-title">${opt.label}</div>
        <div class="crisis-result-text">${resultText}</div>
      </div>
      <button class="enlist-btn" style="margin-top:16px;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#fbbf24" onclick="document.getElementById('crisis-root').innerHTML=''">Continue</button>
    </div>`;
}

function renderTutorialSlide(){
  const slide=TUTORIAL_SLIDES[tutorialSlide];
  const isFirst=tutorialSlide===0;
  const isLast=tutorialSlide===TUTORIAL_SLIDES.length-1;

  // Update content with fade
  const body=document.getElementById('tut-body');
  if(body){body.classList.remove('tut-fade-in');void body.offsetWidth;body.classList.add('tut-fade-in');}
  const sub=document.getElementById('tut-sub');
  const title=document.getElementById('tut-title');
  const text=document.getElementById('tut-text');
  if(sub)sub.textContent=slide.subtitle;
  if(title)title.textContent=slide.title;
  if(text)text.innerHTML=slide.text.replace(/\n/g,'<br>');

  // Update dots
  const dots=document.getElementById('tut-dots');
  if(dots)dots.innerHTML=TUTORIAL_SLIDES.map((_,i)=>`<div class="tut-dot${i===tutorialSlide?' active':''}" onclick="tutorialSlide=${i};renderTutorialSlide()" style="cursor:pointer"></div>`).join('');

  // Update buttons
  const back=document.getElementById('tut-back');
  const next=document.getElementById('tut-next');
  if(back)back.style.visibility=isFirst?'hidden':'visible';
  if(next){
    next.textContent=isLast?'Got it ✓':'Next →';
    next.onclick=isLast?closeTutorial:tutNext;
  }
}
function tutNext(){tutorialSlide=Math.min(TUTORIAL_SLIDES.length-1,tutorialSlide+1);renderTutorialSlide();}
function tutPrev(){tutorialSlide=Math.max(0,tutorialSlide-1);renderTutorialSlide();}
function closeTutorial(){
  document.getElementById('tutorial-root').innerHTML='';
  localStorage.setItem('pfl_tutorial_seen','1');
}

  const dd=document.getElementById('hud-dropdown');
  if(dd&&!dd.contains(e.target))dd.style.display='none';
}

function computeCombatProfile(heroId){
  const hero=heroes.find(h=>h.id===heroId);
  if(!hero)return null;
  const power=powers.find(p=>p.id===hero.powerId);
  if(!power)return null;
  const s=power.stats;
  const abilities=generateAbilities(power);
  return{
    hero,power,abilities,
    maxHp:(s.dur||1)*12+20,
    hp:(s.dur||1)*12+20,
    baseDmg:Math.max(1,(s.pow||1)*3),
    critChance:Math.min(60,(s.ctl||1)*6),
    evadeChance:Math.min(40,(s.rng||1)*4),
    counterChance:Math.min(25,(s.vrs||1)*3),
    dmgReduction:Math.floor((s.dur||1)*1.5),
    initiative:(s.rng||1)*2+Math.random()*4,
  };
}

function aiSelectTechnique(profile,round,hpPercent){
  const abs=profile.abilities;
  if(!abs.length)return{name:'Basic Strike',type:'offensive',isSig:false};
  // Low HP → prefer defensive/passive
  if(hpPercent<0.3){
    const def=abs.filter(a=>a.type==='defensive'||a.type==='passive');
    if(def.length&&Math.random()<0.6)return def[Math.floor(Math.random()*def.length)];
  }
  // Has signature + opponent vulnerable → use signature
  const sig=abs.find(a=>a.isSig);
  if(sig&&round>=3&&Math.random()<0.4)return sig;
  // Default: weighted toward offensive
  const offensive=abs.filter(a=>a.type==='offensive'||a.type==='utility');
  const all=[...offensive,...offensive,...abs]; // 2x weight for offensive
  return all[Math.floor(Math.random()*all.length)];
}

function simulateFight(heroAId,heroBId){
  const a=computeCombatProfile(heroAId);
  const b=computeCombatProfile(heroBId);
  if(!a||!b)return null;

  const log=[];
  const maxRounds=10;

  // Opening
  log.push({type:'intro',text:`${a.hero.alias} (${a.power.name}) enters the arena. ${b.hero.alias} (${b.power.name}) faces them. The distance closes.`});

  for(let round=1;round<=maxRounds;round++){
    if(a.hp<=0||b.hp<=0)break;

    // Determine order by initiative
    const first=a.initiative>=b.initiative?a:b;
    const second=first===a?b:a;

    for(const[attacker,defender] of [[first,second],[second,first]]){
      if(attacker.hp<=0||defender.hp<=0)break;
      const hpPct=attacker.hp/attacker.maxHp;
      const tech=aiSelectTechnique(attacker,round,hpPct);

      // Defensive/passive → heal
      if(tech.type==='defensive'||tech.type==='passive'){
        const heal=Math.floor(attacker.maxHp*0.12);
        attacker.hp=Math.min(attacker.maxHp,attacker.hp+heal);
        const tmpl=COMBAT_NARR.heal[Math.floor(Math.random()*COMBAT_NARR.heal.length)];
        log.push({type:'heal',text:tmpl(attacker.hero.alias,tech),round});
        continue;
      }

      // Check evasion
      if(Math.random()*100<defender.evadeChance){
        const tmpl=COMBAT_NARR.evade[Math.floor(Math.random()*COMBAT_NARR.evade.length)];
        log.push({type:'evade',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round});
        continue;
      }

      // Check counter
      if(Math.random()*100<defender.counterChance){
        const counterDmg=Math.max(1,defender.baseDmg-attacker.dmgReduction);
        attacker.hp-=counterDmg;
        const tmpl=COMBAT_NARR.counter[Math.floor(Math.random()*COMBAT_NARR.counter.length)];
        log.push({type:'counter',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round,dmg:counterDmg});
        continue;
      }

      // Calculate damage
      let dmg=attacker.baseDmg+Math.floor(Math.random()*6);
      let isCrit=Math.random()*100<attacker.critChance;
      if(tech.isSig)dmg=Math.floor(dmg*1.5);
      if(isCrit)dmg=Math.floor(dmg*2);
      dmg=Math.max(1,dmg-defender.dmgReduction);
      defender.hp-=dmg;

      // Is this the finisher?
      if(defender.hp<=0){
        defender.hp=0;
        const tmpl=COMBAT_NARR.finisher[Math.floor(Math.random()*COMBAT_NARR.finisher.length)];
        log.push({type:'finisher',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round,dmg});
      } else if(tech.isSig){
        const tmpl=COMBAT_NARR.sig[Math.floor(Math.random()*COMBAT_NARR.sig.length)];
        log.push({type:'sig',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round,dmg});
      } else if(isCrit){
        const tmpl=COMBAT_NARR.crit[Math.floor(Math.random()*COMBAT_NARR.crit.length)];
        log.push({type:'crit',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round,dmg});
      } else{
        const tmpl=COMBAT_NARR.attack[Math.floor(Math.random()*COMBAT_NARR.attack.length)];
        log.push({type:'attack',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round,dmg});
      }
    }

    // HP status after round
    log.push({type:'hp',hpA:a.hp,maxA:a.maxHp,hpB:b.hp,maxB:b.maxHp,round,nameA:a.hero.alias,nameB:b.hero.alias,colorA:a.power.color,colorB:b.power.color});
  }

  // Determine winner (if timeout, higher HP% wins)
  const winner=a.hp<=0?b:b.hp<=0?a:(a.hp/a.maxHp>b.hp/b.maxHp?a:b);
  const loser=winner===a?b:a;

  return{log,winner:winner.hero,loser:loser.hero,winnerPower:winner.power,loserPower:loser.power,rounds:log.filter(l=>l.round).reduce((m,l)=>Math.max(m,l.round),0)};
}

function startArenaFight(){
  if(!arenaSlots[0]||!arenaSlots[1]||arenaSlots[0]===arenaSlots[1])return;
  const result=simulateFight(arenaSlots[0],arenaSlots[1]);
  if(!result)return;

  // Update records
  if(!result.winner.arenaRecord)result.winner.arenaRecord={w:0,l:0};
  if(!result.loser.arenaRecord)result.loser.arenaRecord={w:0,l:0};
  result.winner.arenaRecord.w++;
  result.loser.arenaRecord.l++;

  // Ranked: log a Clash encounter
  if(arenaMode==='ranked'){
    const enc=triggerEncounter(result.winner.id,result.loser.id,'clash');
  }

  autoSave();
  renderArenaResult(result);
  setTimeout(()=>rollCrisis(0.10),3000);
}

function getChemStatBonus(grade){return grade==='S'?2:grade==='A'?1:grade==='F'?-1:0;}

function simulateTeamFight(teamA,teamB){
  const chemA=computeTeamChemistry(teamA);
  const chemB=computeTeamChemistry(teamB);
  const bonusA=getChemStatBonus(chemA.grade);
  const bonusB=getChemStatBonus(chemB.grade);

  const queueA=teamA.members.map(id=>heroes.find(h=>h.id===id)).filter(Boolean);
  const queueB=teamB.members.map(id=>heroes.find(h=>h.id===id)).filter(Boolean);
  if(queueA.length<3||queueB.length<3)return null;

  const log=[];
  const matchups=new Set(); // Track actual relay matchup pairs
  let idxA=0,idxB=0;
  let fighterA=computeCombatProfile(queueA[0].id);
  let fighterB=computeCombatProfile(queueB[0].id);
  if(!fighterA||!fighterB)return null;

  // Apply chemistry bonuses
  const applyBonus=(profile,bonus)=>{
    if(bonus===0)return;
    profile.baseDmg+=bonus*3;
    profile.maxHp+=bonus*12;
    profile.hp+=bonus*12;
    profile.critChance=Math.min(60,profile.critChance+bonus*4);
    profile.evadeChance=Math.min(40,profile.evadeChance+bonus*3);
    profile.dmgReduction+=bonus;
  };
  applyBonus(fighterA,bonusA);
  applyBonus(fighterB,bonusB);

  log.push({type:'intro',text:`👥 TEAM BATTLE: ${teamA.name} (⚗${chemA.grade}) vs ${teamB.name} (⚗${chemB.grade})`});
  log.push({type:'intro',text:`${fighterA.hero.alias} steps forward for ${teamA.name}. ${fighterB.hero.alias} answers for ${teamB.name}. The relay begins.`});

  let totalRounds=0;
  const maxTotalRounds=30;

  while(idxA<3&&idxB<3&&totalRounds<maxTotalRounds){
    totalRounds++;
    matchups.add(fighterA.hero.id+'|'+fighterB.hero.id);

    // Determine order
    const first=fighterA.initiative>=fighterB.initiative?fighterA:fighterB;
    const second=first===fighterA?fighterB:fighterA;

    for(const[attacker,defender] of [[first,second],[second,first]]){
      if(attacker.hp<=0||defender.hp<=0)break;
      const hpPct=attacker.hp/attacker.maxHp;
      const tech=aiSelectTechnique(attacker,totalRounds,hpPct);

      if(tech.type==='defensive'||tech.type==='passive'){
        const heal=Math.floor(attacker.maxHp*0.12);
        attacker.hp=Math.min(attacker.maxHp,attacker.hp+heal);
        const tmpl=COMBAT_NARR.heal[Math.floor(Math.random()*COMBAT_NARR.heal.length)];
        log.push({type:'heal',text:tmpl(attacker.hero.alias,tech),round:totalRounds});
        continue;
      }

      if(Math.random()*100<defender.evadeChance){
        const tmpl=COMBAT_NARR.evade[Math.floor(Math.random()*COMBAT_NARR.evade.length)];
        log.push({type:'evade',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds});
        continue;
      }

      if(Math.random()*100<defender.counterChance){
        const counterDmg=Math.max(1,defender.baseDmg-attacker.dmgReduction);
        attacker.hp-=counterDmg;
        const tmpl=COMBAT_NARR.counter[Math.floor(Math.random()*COMBAT_NARR.counter.length)];
        log.push({type:'counter',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds,dmg:counterDmg});
        continue;
      }

      let dmg=attacker.baseDmg+Math.floor(Math.random()*6);
      let isCrit=Math.random()*100<attacker.critChance;
      if(tech.isSig)dmg=Math.floor(dmg*1.5);
      if(isCrit)dmg=Math.floor(dmg*2);
      dmg=Math.max(1,dmg-defender.dmgReduction);
      defender.hp-=dmg;

      if(defender.hp<=0){
        defender.hp=0;
        const tmpl=COMBAT_NARR.finisher[Math.floor(Math.random()*COMBAT_NARR.finisher.length)];
        log.push({type:'finisher',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds,dmg});
      } else if(tech.isSig){
        const tmpl=COMBAT_NARR.sig[Math.floor(Math.random()*COMBAT_NARR.sig.length)];
        log.push({type:'sig',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds,dmg});
      } else if(isCrit){
        const tmpl=COMBAT_NARR.crit[Math.floor(Math.random()*COMBAT_NARR.crit.length)];
        log.push({type:'crit',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds,dmg});
      } else{
        const tmpl=COMBAT_NARR.attack[Math.floor(Math.random()*COMBAT_NARR.attack.length)];
        log.push({type:'attack',text:tmpl(attacker.hero.alias,defender.hero.alias,tech),round:totalRounds,dmg});
      }
    }

    // HP status
    log.push({type:'hp',hpA:fighterA.hp,maxA:fighterA.maxHp,hpB:fighterB.hp,maxB:fighterB.maxHp,round:totalRounds,nameA:fighterA.hero.alias,nameB:fighterB.hero.alias,colorA:fighterA.power.color,colorB:fighterB.power.color});

    // Check for KO — relay swap
    if(fighterA.hp<=0){
      idxA++;
      if(idxA<3){
        const next=queueA[idxA];
        log.push({type:'swap',text:`${fighterA.hero.alias} is down! ${next.alias} enters the arena for ${teamA.name}. ${fighterB.hero.alias} holds the field at ${Math.round(fighterB.hp/fighterB.maxHp*100)}% HP.`});
        fighterA=computeCombatProfile(next.id);
        applyBonus(fighterA,bonusA);
      }
    }
    if(fighterB.hp<=0){
      idxB++;
      if(idxB<3){
        const next=queueB[idxB];
        log.push({type:'swap',text:`${fighterB.hero.alias} is down! ${next.alias} enters the arena for ${teamB.name}. ${fighterA.hero.alias} holds the field at ${Math.round(fighterA.hp/fighterA.maxHp*100)}% HP.`});
        fighterB=computeCombatProfile(next.id);
        applyBonus(fighterB,bonusB);
      }
    }
  }

  const winnerTeam=idxA>=3?teamB:idxB>=3?teamA:(fighterA.hp>fighterB.hp?teamA:teamB);
  const loserTeam=winnerTeam===teamA?teamB:teamA;
  const survivorsCount=winnerTeam===teamA?3-idxA:3-idxB;

  return{log,winnerTeam,loserTeam,chemA,chemB,totalRounds,survivorsCount,queueA,queueB,matchups};
}

function startTeamFight(){
  const tA=teams.find(t=>t.id===arenaTeamSlots[0]);
  const tB=teams.find(t=>t.id===arenaTeamSlots[1]);
  if(!tA||!tB||tA.id===tB.id)return;

  const result=simulateTeamFight(tA,tB);
  if(!result)return;

  // Update individual records
  const winIds=new Set(result.winnerTeam.members);
  const loseIds=new Set(result.loserTeam.members);
  heroes.forEach(h=>{
    if(!h.arenaRecord)h.arenaRecord={w:0,l:0};
    if(winIds.has(h.id))h.arenaRecord.w++;
    if(loseIds.has(h.id))h.arenaRecord.l++;
  });

  // Ranked: log Clash encounters only for pairs that actually fought in the relay
  if(arenaMode==='ranked'&&result.matchups){
    for(const pair of result.matchups){
      const[idA,idB]=pair.split('|');
      const rel=relationships.find(r=>(r.heroA===idA&&r.heroB===idB)||(r.heroA===idB&&r.heroB===idA));
      if(rel)triggerEncounter(idA,idB,'clash');
    }
  }

  autoSave();
  renderTeamResult(result);
  setTimeout(()=>rollCrisis(0.10),3000);
}

let teams=[];

function computeTeamChemistry(team){
  const memberHeroes=team.members.map(id=>heroes.find(h=>h.id===id)).filter(Boolean);
  const memberPowers=memberHeroes.map(h=>powers.find(p=>p.id===h.powerId)).filter(Boolean);
  if(memberHeroes.length<3||memberPowers.length<3)return{total:0,grade:'D',breakdown:{}};

  let score=0;
  const breakdown={};

  // Tag overlap: +2 per tag shared by 2+ members
  const tagCounts={};
  memberPowers.forEach(p=>(p.tags||[]).forEach(t=>{tagCounts[t]=(tagCounts[t]||0)+1;}));
  const sharedTags=Object.entries(tagCounts).filter(([t,c])=>c>=2);
  const tagOverlapPts=sharedTags.length*2;
  score+=tagOverlapPts;
  breakdown.tagOverlap={pts:tagOverlapPts,detail:`${sharedTags.length} shared tag${sharedTags.length!==1?'s':''}`};

  // Family coverage: +3 per unique tag family
  const families=new Set();
  memberPowers.forEach(p=>(p.tags||[]).forEach(t=>{
    const def=TAG_DEFS[t]||LEGENDARY_TAGS[t]||MUTANT_TAGS[t];
    if(def&&TAG_FAMILIES){
      for(const[fam,famData] of Object.entries(TAG_FAMILIES)){
        if(famData.tags&&famData.tags.has(t))families.add(fam);
      }
    }
  }));
  const familyPts=families.size*3;
  score+=familyPts;
  breakdown.families={pts:familyPts,detail:`${families.size} tag famil${families.size!==1?'ies':'y'}`};

  // Bond strength: +1 per intensity point between any pair
  let bondPts=0;
  let bondCount=0;
  for(let i=0;i<memberHeroes.length;i++){
    for(let j=i+1;j<memberHeroes.length;j++){
      const rel=relationships.find(r=>
        (r.heroA===memberHeroes[i].id&&r.heroB===memberHeroes[j].id)||
        (r.heroA===memberHeroes[j].id&&r.heroB===memberHeroes[i].id));
      if(rel){bondPts+=rel.intensity;bondCount++;}
    }
  }
  score+=bondPts;
  breakdown.bonds={pts:bondPts,detail:`${bondCount} bond${bondCount!==1?'s':''} (${bondPts} intensity)`};

  // Arc history: +5 per completed arc between any pair
  let arcPts=0;
  let arcCount=0;
  for(let i=0;i<memberHeroes.length;i++){
    for(let j=i+1;j<memberHeroes.length;j++){
      const pairArcs=storyArcs.filter(sa=>sa.completed&&
        ((sa.heroA===memberHeroes[i].id&&sa.heroB===memberHeroes[j].id)||
         (sa.heroA===memberHeroes[j].id&&sa.heroB===memberHeroes[i].id)));
      arcPts+=pairArcs.length*5;
      arcCount+=pairArcs.length;
    }
  }
  score+=arcPts;
  breakdown.arcs={pts:arcPts,detail:`${arcCount} completed arc${arcCount!==1?'s':''}`};

  // Rivalry penalty: -3 per sworn opposition pair
  let rivalPenalty=0;
  for(let i=0;i<memberHeroes.length;i++){
    for(let j=i+1;j<memberHeroes.length;j++){
      const rel=relationships.find(r=>
        (r.heroA===memberHeroes[i].id&&r.heroB===memberHeroes[j].id)||
        (r.heroA===memberHeroes[j].id&&r.heroB===memberHeroes[i].id));
      if(rel&&rel.type==='sworn')rivalPenalty+=rel.intensity;
    }
  }
  score-=rivalPenalty;
  if(rivalPenalty)breakdown.rivalry={pts:-rivalPenalty,detail:'sworn opposition penalty'};

  const grade=score>=50?'S':score>=35?'A':score>=20?'B':score>=10?'C':score>=0?'D':'F';
  return{total:score,grade,breakdown};
}
