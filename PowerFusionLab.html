  'prob+teleport':    {name:'Quantum Leap',            desc:'Teleport to the location with the highest probability of achieving your current objective — without needing to know where that location is. The displacement itself becomes probabilistically guided. Need to find a missing person? Teleport and arrive next to them.',reason:'Teleportation requires a destination. Probability manipulation identifies the optimal outcome and its spatial coordinates. The fusion bypasses destination mapping entirely — the probability field computes the ideal location and teleportation displaces you there in a single weighted quantum event.'},
  'sono+strength':    {name:'Thunderclap',             desc:'Generate devastating sonic booms through raw physical force — claps that produce concussive shockwaves, footsteps that send seismic pulses through structures, and punches that break the sound barrier with every swing. The air itself becomes a weapon.',reason:'Sufficiently powerful physical impacts generate shockwaves as displaced air compresses past the speed of sound. Super Strength provides impacts of that magnitude consistently. Sonokinesis shapes and directs the resulting acoustic energy rather than letting it dissipate omnidirectionally.'},
  'sono+teleport':    {name:'Echo Displacement',       desc:'Teleport to the source of any sound — a voice, an explosion, a heartbeat. Use echolocation to map destination coordinates with acoustic precision, then displace to the sound\'s origin before the echo fades. Track anyone who makes a noise anywhere.',reason:'Teleportation requires destination mapping. Sonokinesis provides high-resolution acoustic imaging — echolocation that constructs precise three-dimensional spatial maps from sound reflection. Any audible event becomes a teleportation coordinate, solved from its acoustic signature.'},
  'strength+teleport':{name:'Displacement Strike',     desc:'Teleport with preserved momentum — build a running charge, displace mid-stride, and arrive at the target with full velocity plus the force of materialization. A punch that begins in one hemisphere and lands in another, carrying accumulated kinetic energy across the spatial gap.',reason:'Teleportation displaces matter between points. Super Strength generates enormous kinetic energy. The fusion preserves momentum through displacement — the kinetic energy of the origin is carried through the spatial gap and delivered at the destination, adding teleportation\'s disorientation to a superhuman impact.'},
  // ── NEW × EXISTING PAIRS ─────────────────────────────────────────────────
  'pyro+sono':        {name:'Thermoacoustic Ignition', desc:'Generate fire through sound — high-frequency vibrations heat air molecules past ignition point, producing flame from pure acoustic energy. Targeted frequencies ignite specific materials from a distance. A whispered note sets a room ablaze.',reason:'Thermoacoustics is real physics — sound waves create pressure oscillations that generate heat through compression. Sonokinesis provides the frequency control; Pyrokinesis provides the thermal amplification. Together they bypass the need for fuel or spark — sound itself becomes the ignition source.'},
  'cryo+sono':      {name:'Shatter Song',            desc:'Flash-freeze targets and deliver the killing resonant frequency in a single combined assault — but the physics fight at the seams. Cold demands stillness; sound demands motion. The ice forms and the vibration cracks it, the freeze spreads and the resonance shatters the spread, each principle undermining the other even as they cooperate to destroy the target. The result is devastatingly effective and fundamentally unstable.',reason:'Cryokinesis crystallizes matter into rigid brittle lattices. Sonokinesis propagates mechanical waves that require molecular motion. The opposition between stillness and velocity means the freeze is constantly disrupted by the vibration and the vibration is constantly damped by the freeze — a destructive interference pattern that tears apart whatever is caught between them.'},
  'electro+sono':     {name:'Piezoelectric Storm',     desc:'Generate electrical charge from sonic vibration and sonic vibration from electrical discharge — a self-amplifying feedback loop of lightning and thunder. Piezoelectric resonance turns every surface into a generator. The world hums with harvestable charge.',reason:'Piezoelectric materials generate voltage under mechanical stress. Sound is mechanical stress propagating through a medium. Sonokinesis provides the vibration; Electrokinesis harvests and amplifies the resulting charge — creating a feedback loop where sound generates lightning and lightning generates thunder.'},
  'sono+tele':      {name:'Psionic Frequency',       desc:'Broadcast telepathic signals as modulated sound waves — thoughts encoded in acoustic carriers that bypass psychic defenses by entering through the auditory cortex. But the telepathic harmony that synchronizes minds and the sonic discord that disrupts systems are the same signal traveling the same channel, and the message arrives with an edge of dissonance that the receiver cannot separate from the content. Commands carry the ghost of a headache.',reason:'Telepathy carries harmony — the synchronization of minds. Sonokinesis carries discord — the disruption of stable systems. Encoding thoughts in sound means transmitting harmonious content through a dissonant medium, and the opposition between them produces signal artifacts. The message is always slightly corrupted by its delivery mechanism, creating telepathic communication that works but unsettles.'},
  'sono+speed':       {name:'Mach Scream',             desc:'Move faster than the sound you generate — delivering sonic attacks from a position the target has not heard you reach yet. The sonic boom of superspeed movement becomes a directed weapon rather than a byproduct. Arrive before your own war cry.',reason:'Supersonic movement already generates shockwaves. Sonokinesis weaponizes what Super Speed produces as a side effect — shaping the Mach cone into focused acoustic lances and controlling the boom\'s directionality. The user becomes a precision-guided sonic weapon.'},
  'gravity+sono':     {name:'Gravitational Resonance', desc:'Vibrate gravitational fields at audible and sub-audible frequencies — generating tidal pulses that compress and decompress matter rhythmically. Targets experience oscillating gravitational force, their own mass becoming the medium through which destructive waves propagate.',reason:'Gravitational waves are oscillations in spacetime itself — predicted by Einstein and detected by LIGO. Sonokinesis provides frequency control over wave propagation. Gravity Control provides the medium. The fusion generates localized gravitational waves at frequencies that resonate with physical structures.'},
  'shadow+sono':      {name:'Dead Silence',            desc:'Absorb all sound in an area into shadow — creating zones of absolute acoustic void where screams produce nothing and explosions make no noise. Alternatively, release the stored sound as a devastating burst from darkness. Silence as a weapon and an ambush.',reason:'Shadow Form absorbs photons to create darkness. Sonokinesis manipulates mechanical wave energy. The fusion extends absorption to acoustic energy — shadows become sound sinks that trap vibration, creating silence as a physical substance that can be wielded, shaped, and released.'},
  'heal+sono':        {name:'Restoration Frequency',   desc:'Accelerate healing through precise therapeutic frequencies — ultrasonic bone repair, resonant tissue regeneration, acoustic disruption of infection and malignant cells. The body is tuned like an instrument, each frequency correcting a specific biological dysfunction.',reason:'Ultrasonic therapy already accelerates bone healing and tissue repair in modern medicine. Sonokinesis provides precision frequency delivery. Healing Factor provides the biological regeneration mechanism. Together they target specific cellular repair processes with acoustic catalysis.'},
  'earth+sono':       {name:'Seismic Voice',           desc:'Channel sonic energy through stone and earth, generating precision earthquakes with voice commands. Sing a note and watch fault lines respond. Whisper into bedrock and shatter foundations from below. The planet becomes a resonating chamber for directed tectonic force.',reason:'Earth transmits seismic waves as its primary energy propagation method — earthquakes are literally sonic events in stone. Earth Mastery provides the medium and structural control. Sonokinesis provides the frequency precision. The fusion treats the planet\'s crust as a speaker cone.'},
  'sono+time':        {name:'Echo Memory',             desc:'Hear sounds from the past — extracting acoustic information imprinted in the environment by temporal navigation. Listen to conversations that occurred in this room years ago. Trace a target by the sound trail they left in time. Every space remembers every sound it ever held.',reason:'Time Perception navigates the temporal dimension and reads causal residue. Sound waves deposit energy into their environment as heat and vibration. The fusion reads that deposited energy as temporal acoustic data — reconstructing past sounds from their environmental imprint.'},
  'photo+pyro':       {name:'Solar Flare',             desc:'Channel concentrated solar-spectrum light into superheated plasma — fire so intense it burns white and radiates across the electromagnetic spectrum. A fusion of light and heat that replicates the surface of a star at a human scale.',reason:'Fire is a plasma state that emits light. Solar radiation is light that generates heat. Pyrokinesis provides thermal plasma control; Photokinesis provides electromagnetic concentration. Together they collapse the distinction between light and fire — producing stellar-temperature plasma constrained by dual control.'},
  'cryo+photo':       {name:'Absolute Prism',          desc:'Create crystalline ice structures of perfect optical purity — lenses, mirrors, and prism arrays that split, focus, and redirect light with zero distortion. Build fortifications that double as laser weapon systems. Frozen architecture that fights with refracted light.',reason:'Ice forms crystalline lattice structures with high optical clarity. Cryokinesis grows crystals of perfect molecular alignment. Photokinesis directs light through them with precision — creating a symbiotic system where ice shapes the light and light weaponizes the ice.'},
  'electro+photo':    {name:'Electromagnetic Dominion',desc:'Command the unified electromagnetic force in its entirety — from radio waves to gamma rays and from static charge to lightning. Generate EMPs, control all electronic signals, project coherent energy at any frequency. The full electromagnetic spectrum as a single instrument.',reason:'Light and electricity are both manifestations of the electromagnetic force — photons carry the electromagnetic interaction. Electrokinesis controls charge and current; Photokinesis controls radiation and waves. Together they command both aspects of the same fundamental force.'},
  'photo+tele':       {name:"Mind's Eye Projection",  desc:'Project thoughts, memories, and mental images as visible holograms made of shaped light — sharing experiences visually, constructing photorealistic illusions drawn from imagination, or displaying a target\'s own memories back to them as accusatory apparitions.',reason:'Telepathy accesses mental imagery as electrochemical patterns. Photokinesis constructs light structures with precision. The fusion translates mental content into photonic output — rendering thoughts as visible, manipulable holograms projected into shared physical space.'},
  'photo+speed':      {name:'Lightrunner',             desc:'Approach lightspeed by converting kinetic energy into photonic thrust — the body partially phase-shifts into light at peak velocity, leaving an afterimage trail of Cherenkov-blue radiation. At maximum speed, physical collisions release energy equivalent to a directed gamma burst.',reason:'As objects approach lightspeed, relativistic effects blur the boundary between matter and energy. Photokinesis controls the energy side of that equation. Super Speed provides the kinetic baseline. The fusion uses photonic energy to supplement kinetic energy past normal relativistic limits.'},
  'gravity+photo':    {name:'Gravitational Lensing',   desc:'Bend light around gravitational wells to see behind objects, observe events from across the planet through light-bending corridors, or focus diffuse light into devastating concentrated beams using gravity as a lens. Turns empty space into an optical instrument.',reason:'Gravitational lensing is observed astrophysics — massive objects bend light through spacetime curvature. Gravity Control provides the curvature. Photokinesis provides the light source and precision. The fusion replicates a galactic-scale phenomenon at a personal scale with surgical accuracy.'},
  'photo+shadow':   {name:'Total Eclipse',           desc:'Command both the presence and absolute absence of light — blinding radiance and impenetrable darkness wielded in the same gesture. The boundary between them vibrates with barely contained antagonism, photons and void annihilating each other along a knife-edge that the user rides without ever reaching equilibrium. Light here is a weapon; shadow is its sheath; and the edge between them cuts at a level deeper than either.',reason:'Luminance is the fundamental assertion of photonic presence. Void is the fundamental assertion of absence. They cannot occupy the same space without one consuming the other — and when both are held at equal intensity, the boundary itself becomes a site of continuous creation and annihilation that radiates energy from the conflict alone.'},
  'heal+photo':       {name:'Radiant Mending',         desc:'Heal through therapeutic light — accelerating cellular repair with precisely calibrated UV and infrared radiation, photobiomodulating tissue regeneration, and sterilizing wounds with germicidal wavelengths. At peak output, injuries close under a warm golden glow in seconds.',reason:'Photobiomodulation is established medicine — specific light wavelengths stimulate mitochondrial ATP production, accelerating cell repair. Healing Factor provides the regenerative substrate. Photokinesis delivers perfectly calibrated therapeutic wavelengths directly to damaged tissue.'},
  'earth+photo':      {name:'Crystal Focus',           desc:'Grow mineral crystal formations optimized for light manipulation — natural fiber optics through quartz veins, ruby laser rods from geological matrix, diamond lenses that focus light to cutting intensity. The earth becomes a precision optical workshop.',reason:'Crystalline minerals interact with light through refraction, reflection, and stimulated emission — ruby was used in the first laser. Earth Mastery grows crystal structures to spec. Photokinesis calibrates their optical properties. Together they produce geological optical instruments of perfect precision.'},
  'photo+time':       {name:'Lightstream Chronicle',   desc:'Capture and replay light that existed in the past — observing historical events by navigating the temporal dimension to retrieve the photons that were present. Replay a crime scene as a holographic reconstruction. See what any place looked like at any point in history.',reason:'Light travels at finite speed — the farther you look, the further back in time you see. Time Perception navigates temporal distance. Photokinesis captures and renders photonic data. The fusion retrieves historical light from the temporal dimension and replays it in the present as perfect visual reconstruction.'},
  'bio+pyro':       {name:'Thermal Biology',         desc:'Develop heat-resistant biological structures and internal exothermic reactions — but the synthesis that builds the adaptations and the destruction that fuels the fire occupy the same biological space. Thermophilic proteins assemble and pyrokinetic heat tears at them in the same metabolic cycle, each improvement immediately stress-tested by the force it was designed to channel. The body runs hot, adapts, and the adaptation makes it run hotter.',reason:'Biomimicry now carries synthesis — the principle of constructive combination. Pyrokinesis carries destruction. The opposition forces the body into a simultaneous build-and-burn cycle where every biological structure created to handle heat is immediately challenged by the heat it enables, producing an evolutionary arms race contained within a single organism.'},
  'bio+cryo':         {name:'Cryogenic Adaptation',    desc:'Replicate the antifreeze proteins of Arctic fish, the cryobiotic stasis of wood frogs, and the ice-nucleating compounds of frost-tolerant insects — the body operates at temperatures that would crystallize normal tissue, moving fluidly through its own ice.',reason:'Multiple organisms survive freezing through antifreeze glycoproteins and controlled intracellular dehydration. Biomimicry replicates these cryoprotective mechanisms. Cryokinesis provides the cold. The fusion creates a body that treats subzero temperatures as an optimal operating environment.'},
  'bio+electro':    {name:'Bioelectric Dynamo',      desc:'Generate electricity biologically through electroplaque cell arrays and voltage-gated ion channels — but the electromagnetic output ionizes the user\'s own tissue as fast as adaptation can harden against it. Every increase in power output triggers a radiation exposure event that the body must evolve past in real time. The dynamo runs hot and its fuel is its own cells.',reason:'Biomimicry replicates biological electrical generation systems. Electrokinesis amplifies the output into the ionizing spectrum. The radiation feeds back into the biological substrate, forcing constant adaptive mutation — the body is simultaneously the generator, the conductor, and the shielding, locked in a cycle of self-irradiation and self-repair.'},
  'bio+tele':         {name:'Hive Consciousness',      desc:'Telepathically link with the nervous systems of observed organisms and perceive through their senses — see through a hawk\'s eyes, smell through a bloodhound\'s nose, echolocate through a bat\'s ears. Build a distributed sensory network from every animal in range.',reason:'Biomimicry reads biological structures. Telepathy interfaces with neural systems. The fusion connects to animal nervous systems telepathically — not replicating their traits but sharing their consciousness directly, creating a multi-species perceptual network anchored in the user\'s mind.'},
  'bio+speed':        {name:'Cheetah Protocol',        desc:'Layer speed-optimized biological adaptations onto an already superhuman velocity — flexible spine elongation, spring-loaded tendon energy storage, semi-retractable claw traction, and enlarged adrenal systems. Every biological solution to the speed problem, stacked on a body that already breaks physics.',reason:'The fastest animals achieve speed through structural adaptation — cheetah spines flex to extend stride length, kangaroo tendons store elastic energy, peregrine falcons minimize drag. Biomimicry replicates these systems. Super Speed provides the baseline. The fusion is evolutionary optimization applied to superhuman locomotion.'},
  'bio+gravity':      {name:'Adaptive Mass',           desc:'Shift biological density at will — compress tissue to withstand crushing gravitational forces or expand it to near-weightlessness for levitation. The body adapts its mass distribution in response to gravitational conditions, becoming immovably dense or impossibly light as needed.',reason:'Deep-sea organisms adapt to extreme pressure through specialized tissue density and skeletal structures. Biomimicry replicates these pressure-response adaptations. Gravity Control provides the pressure variance. The fusion produces a body that dynamically restructures its density to match gravitational conditions.'},
  'bio+shadow':       {name:'Abyssal Form',            desc:'Replicate the adaptations of deep-ocean organisms that live in permanent darkness — bioluminescent lures, pressure-immune tissue, sonar-reflective skin, and vantablack pigmentation that absorbs all incident light. The body becomes a creature evolved for the void.',reason:'Abyssal organisms adapted to lightless, high-pressure environments through millions of years of evolution. Shadow Form provides the darkness as habitat. Biomimicry provides the biological toolkit. The fusion creates a body optimized for existence in shadow — camouflaged in darkness and weaponized by it.'},
  'bio+heal':         {name:'Evolutionary Regeneration',desc:'Regenerate not just to baseline but to an improved state — every injury heals back stronger, incorporating biological adaptations that prevent the same damage from recurring. Break a bone and it regrows reinforced with biological ceramic. Scar tissue becomes armor.',reason:'Healing Factor restores the body to its template. Biomimicry rewrites the template. The fusion treats injury as evolutionary pressure — each repair cycle integrates adaptive reinforcement at the cellular level, producing a body that evolves in response to damage rather than merely recovering from it.'},
  'bio+earth':        {name:'Lithic Organism',         desc:'Integrate mineral structures into biological tissue — calcium carbonate armor plating, silicate-reinforced skeletal systems, piezoelectric bone arrays that generate charge from impact. The body incorporates geological material as living tissue, blurring the line between organism and mineral.',reason:'Many organisms already integrate minerals — shells, bones, teeth, and diatom silica structures. Earth Mastery commands mineral at the molecular level. Biomimicry provides the biological integration framework. The fusion extends biomineralization to its logical extreme, producing living stone.'},
  'bio+time':         {name:'Ancestral Memory',        desc:'Access the biological traits of organisms from any point in evolutionary history — replicate extinct adaptations by reaching back through the temporal dimension to observe creatures that no longer exist. Tyrannosaurus jaw musculature. Anomalocaris compound eyes. Dunkleosteus armored plating.',reason:'Biomimicry requires observation of a living organism. Time Perception removes the temporal constraint — navigating back to observe extinct species in their living state. The fusion opens the entire four-billion-year evolutionary catalogue as a source of adaptable biological traits.'},
  'pyro+teleport':    {name:'Flash Fire',              desc:'Teleport with a thermal signature — vanish in a burst of flame and arrive wreathed in fire. The displacement event superheats the air at both origin and destination, leaving scorched craters at departure and a detonation of fire on arrival. Entry and exit are both weapons.',reason:'Teleportation displaces matter, creating a brief vacuum at the origin and a compression event at the destination. Pyrokinesis converts these pressure differentials into thermal events — the vacuum ignites residual atmosphere on collapse, and the compression at arrival superheats the surrounding air.'},
  'cryo+teleport':    {name:'Frostblink',              desc:'Teleport through a flash-freeze — departure leaves a burst of crystallized moisture at absolute zero and arrival emanates a wave of cryogenic cold. Chain rapid teleportation to create a maze of frozen zones, each displacement seeding a new ice formation.',reason:'Teleportation\'s displacement creates a momentary vacuum at the origin point. Cryokinesis fills that vacuum with a thermal sink — the surrounding air flash-freezes as energy rushes to fill the void. At the destination, compressed air crystallizes on arrival into an expanding frost wave.'},
  'electro+teleport': {name:'Lightning Step',          desc:'Teleport along electromagnetic field lines — locking onto electrical signals as destination coordinates and arriving as a lightning bolt. Teleport to any active circuit, any neural signal, any electromagnetic source. Travel the grid like current through a wire.',reason:'Electrokinesis reads electromagnetic fields. Every electrical signal has a spatial origin. Teleportation displaces matter to a known location. The fusion uses electromagnetic signatures as coordinate beacons — the user follows the field line to its source, arriving as a discharge of accumulated charge.'},
  'tele+teleport':    {name:'Psychic Transposition',   desc:'Teleport to any mind you can sense telepathically — or teleport someone else to your location by grasping their mental signature and pulling. Distance is irrelevant. If you can think about them, you can appear beside them or summon them to you.',reason:'Telepathy provides an omnidirectional mental positioning system — every conscious mind is a locatable signal. Teleportation requires destination coordinates. The fusion uses telepathic contact as spatial targeting — the mental link becomes the teleportation vector, bypassing all conventional mapping.'},
  'speed+teleport':   {name:'Flicker',                 desc:'Teleport so rapidly and frequently that movement becomes a stuttering strobe of displacement — appearing in dozens of locations per second, striking from everywhere simultaneously. Not speed and not teleportation. A state of distributed physical presence through cascading micro-jumps.',reason:'Super Speed provides the reaction time to chain teleportation events at superhuman frequency. Standard teleportation is a single displacement. The fusion produces a rapid-fire stutter of micro-displacements — the user occupies multiple positions within the same second, creating the functional equivalent of being everywhere at once.'},
  'gravity+teleport': {name:'Mass Displacement',       desc:'Teleport with gravitational control — arrive at the destination and immediately impose a gravitational field. Teleport above a target and bring crushing gravity with you. Displace into orbit and maintain your own gravitational anchor. Exit a teleportation event as a falling star.',reason:'Teleportation displaces matter. Gravity Control manipulates the curvature of spacetime around that matter. The fusion carries gravitational distortion through the displacement event — the user\'s personal gravitational field travels with them, arriving at the destination as an immediate environmental weapon.'},
  'shadow+teleport':  {name:'Shadow Step',             desc:'Teleport between shadows — any shadow you can perceive becomes a valid displacement destination. Step into darkness in one room and emerge from the shadow beneath a table across the city. The shadow network becomes a private transit system.',reason:'Shadow Form treats darkness as traversable space. Teleportation displaces matter between points. The fusion uses shadow\'s spatial properties as the displacement medium — dark spaces become connected entry and exit points in a shadow-based teleportation network, limited only by the presence of darkness.'},
  'heal+teleport':    {name:'Emergency Displacement',  desc:'Teleportation triggers automatically when injury exceeds a threshold — the body displaces to a safe location and begins accelerated healing before conscious thought processes the damage. A lethal blow hits, and the target is simply gone, reappearing at a distance already regenerating.',reason:'Healing Factor operates autonomously — it activates without conscious direction. Teleportation normally requires intent. The fusion links displacement to the healing reflex — the body treats lethal damage as a displacement trigger, teleporting away from the threat source before regeneration begins.'},
  'earth+teleport':   {name:'Tectonic Shift',          desc:'Teleport through the earth itself — submerge into stone at one location and emerge from bedrock at another. Displace geological masses across distances, moving boulders, ore deposits, or entire terrain features between locations instantaneously.',reason:'Earth Mastery interfaces with geological structures. Teleportation displaces matter. The fusion extends displacement to geological-scale objects — treating stone and earth as teleportable mass. The user phases into earth at the origin and resolves out of earth at the destination, using the planet as a transit medium.'},
  'teleport+time':    {name:'Chronoportation',         desc:'Displace through time as well as space — teleport not just to where you want to be but to when you want to be there. Arrive at a location five minutes in the past or three hours in the future. Every displacement becomes a temporal event.',reason:'Teleportation displaces matter through spatial dimensions. Time Perception navigates the temporal dimension. Spacetime is a unified manifold — displacement through one dimension implies the capability to displace through the other. The fusion adds temporal coordinates to spatial teleportation targeting.'},
  'astral+pyro':      {name:'Spirit Flame',            desc:'Project an astral form composed of spectral fire — a burning ghost that ignites what it touches despite having no physical mass. The astral flame burns on a metaphysical frequency, damaging consciousness and matter simultaneously.',reason:'Pyrokinesis channels thermal energy as an extension of will. The astral form is pure will separated from the body. Fire generated by willpower rather than chemistry persists in the astral state — creating a projection that carries thermal output as an expression of psychic energy rather than physical combustion.'},
  'astral+cryo':      {name:'Soul Chill',              desc:'The astral form radiates intense cold — draining thermal energy from any space it occupies despite having no physical mass. Rooms grow frigid as the projection passes through. Targets experience a bone-deep chill that no insulation can block because the cold source is non-physical.',reason:'Cryokinesis draws thermal energy out of matter. Astral projection exists as a disembodied conscious presence. The astral form becomes a mobile thermal sink — absorbing heat from its environment through psychokinetic rather than physical mechanisms, producing cold that originates from no detectable source.'},
  'astral+electro':   {name:'Neural Ghost',            desc:'Project your consciousness directly into electronic systems — inhabiting circuits, networks, and digital infrastructure as an astral presence inside the machine. Read data by experiencing it. Control systems from within. A ghost in every machine you choose to haunt.',reason:'Electrokinesis interfaces with electrical systems. Astral projection sends consciousness through non-physical space. Electronic circuits carry signal patterns analogous to neural impulses. The fusion treats digital networks as a traversable medium for astral consciousness — the mind enters the circuit as it would enter a room.'},
  'astral+tele':    {name:'Psychic Omnipresence',    desc:'Project the astral form anywhere and maintain full telepathic capability from the disembodied position — but the astral state\'s fundamental isolation resists the telepathic connection. Every mind reached from the astral plane feels the chill of the gap between the projector and the physical world. Communication works, but it carries the texture of a voice from the other side of something.',reason:'Astral projection separates consciousness from physical presence, introducing a phase-shifted isolation that telepathy must bridge. The telepathic connection stretches across the gap between the physical and astral planes — and the isolation inherent in the astral state imposes a distortion on every message that passes through it, like signal loss across a dimensional barrier.'},
  'astral+speed':     {name:'Thought Speed',           desc:'The astral form moves at the speed of thought — crossing continental distances in the time it takes to form the intention. Physical Speed\'s neural acceleration applies to the astral form\'s travel, making projection functionally instantaneous to any point on Earth.',reason:'Super Speed accelerates neural processing and physical movement. Astral projection is limited by the speed of conscious intention. The fusion applies Speed\'s neural acceleration to the astral form — thought-speed processing means thought-speed travel, since the projection moves as fast as the mind can direct it.'},
  'astral+gravity':   {name:'Gravitational Specter',   desc:'The astral form exerts gravitational influence despite having no mass — a phantom presence that warps spacetime around it, pulling objects toward nothing visible. Targets are crushed by a force emanating from empty space, generated by a consciousness they cannot see or touch.',reason:'Gravity is spacetime curvature, traditionally requiring mass. Gravity Control decouples the force from mass dependence. Astral projection provides a massless conscious anchor point. The fusion generates gravitational curvature centered on a consciousness rather than a body — invisible, intangible, and inescapable.'},
  'astral+shadow':    {name:'Shade Walker',            desc:'Project into the shadow dimension itself — a fully immersive astral journey through the space between darkness and light. From within the shadow plane, manipulate all shadows in the physical world simultaneously. Every dark corner becomes a window, a hand, a weapon.',reason:'Shadow Form accesses a liminal space between presence and absence. Astral projection sends consciousness into non-physical spaces. The fusion treats shadow\'s liminal dimension as a navigable astral plane — the mind projects into darkness itself and commands it from within.'},
  'astral+heal':      {name:'Soul Surgery',            desc:'Project the astral form into a patient\'s body and direct healing from within — observing cellular damage at the point of injury, guiding regeneration with conscious intent, and repairing tissue with precision impossible from the outside. Surgery without incision.',reason:'Healing Factor repairs tissue autonomously but without surgical precision. Astral projection allows consciousness to exist at any point, including inside a living body. The fusion provides an internal perspective for healing — the mind observes and directs regeneration at the cellular level from within the patient.'},
  'astral+earth':     {name:'Stone Memory Walk',       desc:'Project your consciousness into geological formations and experience their ancient memory directly — the tectonic forces that shaped them, the fossils embedded within, the mineral history spanning billions of years. Navigate the earth\'s deep history as a lived experience.',reason:'Earth Mastery connects to geological memory — the stratigraphic record of deep time encoded in stone. Astral projection allows consciousness to merge with non-biological substrates. The fusion sends the mind into stone itself, experiencing geological history as the earth experienced it.'},
  'astral+time':      {name:'Temporal Witness',        desc:'Project the astral form into any point in the past or future — existing as an invisible observer at historical events or witnessing future outcomes before they occur. Not time travel but time viewing — the body stays anchored in the present while consciousness roams the timeline.',reason:'Astral projection separates consciousness from spatial constraints. Time Perception separates awareness from temporal constraints. The fusion removes both limitations simultaneously — consciousness travels freely through time and space as an observer, anchored only by the tether to the body in the present.'},
  'prob+pyro':        {name:'Spontaneous Combustion',  desc:'Weight probability so that combustion events occur where they should not — a target\'s clothing reaches ignition temperature from ambient friction, electrical wiring arcs at the worst moment, gas leaks find sparks. Fire erupts from statistical manipulation rather than direct generation.',reason:'Combustion requires fuel, heat, and oxygen aligning. Probability manipulation collapses the chance of that alignment occurring at a specific point to near-certainty. Pyrokinesis provides the thermal nudge. The fusion manufactures fire from improbable but physically possible spontaneous ignition events.'},
  'cryo+prob':        {name:'Entropy Arrest',          desc:'Freeze probability itself — locking a system into its current state by weighting all outcomes toward stasis. Nothing changes, nothing moves, nothing progresses. Time appears to stop but actually continues — it is the probability of any event occurring that drops to zero.',reason:'Cold reduces molecular motion toward absolute zero. Probability manipulation reduces causal motion toward absolute certainty of the status quo. The fusion applies thermodynamic stasis to probabilistic stasis — freezing not molecules but outcomes, achieving temporal stillness through statistical paralysis.'},
  'electro+prob':     {name:'Signal Collapse',         desc:'Manipulate the probability of electrical events — force circuits to short, guarantee data packets arrive corrupted, ensure that every electronic system in range fails in the way most disadvantageous to the opponent. The technological environment becomes hostile on command.',reason:'Electronic systems operate on quantum-level charge transfer, inherently probabilistic at the circuit level. Electrokinesis interfaces with the electrical substrate. Probability manipulation weights quantum outcomes. The fusion targets the probabilistic foundation of electronics, forcing statistically unlikely failures to become certain.'},
  'prob+tele':        {name:'Cognitive Cascade',       desc:'Weight the probability that a specific thought occurs in a target\'s mind — not implanting thoughts but making certain thoughts statistically inevitable. The target believes the idea is their own. The most subtle form of mental influence, invisible even to other telepaths.',reason:'Thoughts are electrochemical events with probabilistic firing patterns — neurons fire stochastically. Telepathy accesses the mental substrate. Probability manipulation weights which neurons fire. The fusion does not implant thoughts; it makes specific neural firing patterns overwhelmingly probable, producing natural thoughts on command.'},
  'prob+speed':       {name:'Precognitive Reflex',     desc:'React to events before they occur — probability perception identifies incoming threats as statistical certainties and Super Speed responds before the causal chain completes. Dodge bullets that have not been fired. Counter attacks that have not been thrown. The body moves in advance of reality.',reason:'Probability manipulation perceives future events as collapsing wavefunctions. Super Speed provides reaction time faster than the events themselves. The fusion perceives threats while they are still probabilistic and responds before they become actual — precognitive defense at superhuman execution speed.'},
  'gravity+prob':     {name:'Inevitable Force',        desc:'Weight probability so that gravitational effects always produce the worst possible outcome for the target — debris falls toward them, structures collapse in their direction, even their own mass betrays them as their center of gravity shifts to the most unstable point.',reason:'Gravity acts on all mass universally. Probability manipulation determines where and how that action manifests. The fusion does not increase gravitational force — it ensures every gravitational interaction resolves in the least favorable direction for the target. Mass becomes malicious through statistical weighting.'},
  'prob+shadow':      {name:"Fortune's Shadow",        desc:'Manipulate probability from within shadow — unseen and untraceable, adjusting the odds while hidden in darkness. Targets experience cascading bad luck with no apparent source. Lights fail, weapons jam, footing slips — all while the manipulator watches from the dark.',reason:'Shadow Form provides perfect concealment. Probability manipulation requires no visible mechanism — its effects appear as natural coincidence. The fusion creates an invisible saboteur — the shadow provides the hiding place, and probability manipulation provides an attack vector that leaves no evidence and requires no exposure.'},
  'heal+prob':        {name:'Miraculous Recovery',     desc:'Weight probability toward the most favorable biological outcome — diseases go into spontaneous remission, injuries heal at statistically impossible rates, and the body always responds with the optimal immune reaction. Medical luck so extreme it looks like divine intervention.',reason:'Healing processes are probabilistic at the cellular level — immune response, cell division accuracy, protein folding. Probability manipulation weights every biological micro-event toward recovery. Healing Factor provides the regenerative baseline. The fusion makes every cellular decision resolve optimally, producing recovery rates that defy medical explanation.'},
  'earth+prob':       {name:'Seismic Certainty',       desc:'Weight geological probability — ensure that faults slip at the right moment, mineral veins surface where needed, and cave-ins happen exactly where the enemy stands. The earth cooperates not through command but through the statistical inevitability of its own physics.',reason:'Geological events are driven by stress accumulation and probabilistic failure thresholds. Earth Mastery interfaces with geological systems. Probability manipulation collapses those thresholds at desired moments. The fusion does not command the earth — it ensures the earth\'s own natural processes trigger exactly when and where needed.'},
  'prob+time':      {name:'Destiny Engine',          desc:'Navigate the timeline with probabilistic certainty — seeing futures and their exact likelihoods, then collapsing the timeline toward the desired outcome. But the engine runs on paradox fuel. Past and future tear at the probability field; entropy insists the desired outcome is thermodynamically unlikely; causality loops form and dissolve in the calculation. The power works — it works terrifyingly well — but operating it feels like holding together a machine that is trying to eat its own blueprints.',reason:'Time Perception contributes both past and future as active opposing essences. Probability manipulation attempts to collapse the wave function toward a single outcome. But the temporal substrate is at war with itself — past-state data and future-state data generate contradictory probability fields, and the entropy inherent in both time and probability ensures every selection of a desired outcome is a thermodynamic violation the universe actively resists.'},
  'pyro+strength':    {name:'Magma Fist',              desc:'Generate heat through raw friction and impact force — punches that ignite the air, ground slams that melt stone beneath the impact point, grip strength that generates welding temperatures through compression alone. Physical force so extreme it produces fire as a byproduct.',reason:'Mechanical energy converts to thermal energy through friction and compression. Super Strength provides mechanical force far exceeding any material\'s thermal threshold. Pyrokinesis channels and amplifies the resulting heat. The fusion produces fire through sheer physical force — combustion from impact.'},
  'cryo+strength':  {name:'Permafrost Titan',        desc:'Encase the body in ultra-dense cryogenic armor and strike with glacial mass — but the cold demands stillness while the strength demands motion. Each swing cracks the ice, each re-freeze locks the joints, and the user operates in a grinding cycle of explosive movement and instantaneous re-armoring that makes every attack feel like breaking free from a tomb.',reason:'Cryokinesis imposes crystalline stillness on matter. Super Strength channels awakened kinetic potential through the body. The opposition is mechanical — ice armor resists the movement that strength requires, and strength shatters the armor that cold rebuilds. The user exists in constant conflict between the shell that protects them and the force that needs to escape it.'},
  'electro+strength': {name:'Arc Titan',               desc:'Channel electrical current through reinforced muscle fiber — every contraction generates an electromagnetic pulse, every impact discharges accumulated voltage, and the nervous system operates at superconducting efficiency. The body becomes a biological capacitor that hits like a thunderbolt.',reason:'Muscles contract through electrical impulse. Super Strength requires enhanced neural signaling to fire enhanced muscle groups. Electrokinesis supercharges that signaling — current flows through the reinforced neuromuscular system at amplitudes that turn the body into a walking power plant, discharging on impact.'},
  'strength+tele':    {name:'Psychokinetic Amplifier', desc:'Project physical force through telepathic focus — strike a wall psychically with the full tonnage of Super Strength at a distance. The mind exerts the body\'s force without the body moving. Telekinesis with the raw power output of someone who can bench-press a building.',reason:'Telepathy projects mental force. Super Strength generates physical force. The fusion allows the mind to project the body\'s full mechanical output at range — bypassing the contact limitation of physical strength by channeling it through telepathic force projection.'},
  'speed+strength':   {name:'Kinetic Colossus',        desc:'Apply maximum strength at maximum velocity — the physics of force multiplication through acceleration taken to its extreme. A body that hits with megatons of force because it delivers building-crushing power at supersonic speed. F=ma, and both variables are superhuman.',reason:'Force equals mass times acceleration. Super Strength provides the mass-equivalent force. Super Speed provides the acceleration. The fusion multiplies them — a strike that already exceeds structural limits arrives at a velocity that squares the energy on impact. Physics says this should be impossible. It happens anyway.'},
  'gravity+strength': {name:"Titan's Weight",         desc:'Increase your own gravitational density to levels that make the ground crack under your feet, then deliver that concentrated mass in a strike. Alternatively, reduce gravity to nothing and swing with full strength while functionally weightless — ten-ton punches from a body that moves like it weighs nothing.',reason:'Gravity Control modulates mass-weight relationships. Super Strength provides mechanical force. The fusion decouples weight from strength — increasing personal gravity for devastating mass impacts or reducing it for unrestricted movement. The body manipulates its own gravitational relationship with the planet.'},
  'shadow+strength':  {name:'Dark Colossus',           desc:'Coat the body in solid shadow and strike with force amplified by the void\'s density — shadow-wreathed fists that hit with physical tonnage and leave a chill of absence where they land. Intangibility toggles between strikes, phasing through defense and resolving solid for impact.',reason:'Shadow Form provides intangibility and darkness. Super Strength provides physical force. The fusion alternates states — phasing through obstacles as shadow and resolving as ultra-dense physical mass for strikes. The void adds its own weight to impacts, and the ability to phase provides approach vectors that pure strength cannot.'},
  'heal+strength':    {name:'Unbreakable',             desc:'A body that regenerates damage faster than Super Strength can self-inflict — meaning there is no longer an upper limit on force output. Hit with everything and heal the fractures before the fist finishes its arc. The safety limiters biology imposes on muscle contraction are permanently off.',reason:'Human muscles can generate enough force to shatter their own bones — the nervous system imposes limits to prevent self-destruction. Super Strength exceeds those limits. Healing Factor repairs the self-damage in real time. The fusion removes the body\'s final restraint — output is limited only by will, not by structural integrity.'},
  'earth+strength':   {name:'Continental Force',       desc:'Channel the mass and momentum of geological formations through physical strikes — draw on the kinetic energy of tectonic plates, the weight of mountain ranges, the density of the planet\'s mantle. Punches that carry the inertia of continents. Stamps that redirect plate boundaries.',reason:'Earth Mastery commands geological mass. Super Strength provides the physical interface to channel that mass. The fusion uses the planet itself as a force amplifier — the user\'s body serves as a conduit for tectonic-scale energy, delivering geological forces through a human-scale impact point.'},
  'strength+time':    {name:'Momentum Anchor',         desc:'Lock the momentum of a strike at its peak force and sustain it across temporal manipulation — a punch that hits with the same force whether time is flowing normally, slowed, or stopped. Time cannot diminish the impact. The kinetic energy exists outside temporal flow.',reason:'Momentum is mass times velocity; velocity requires time. Time Perception manipulates temporal flow. Super Strength provides the force. The fusion decouples momentum from time dependence — the kinetic energy of a strike is anchored at its peak value regardless of temporal dilation, making the impact temporally invariant.'},
  'chloro+pyro':      {name:'Wildfire Communion',      desc:'Command fire and forest as a single system — directing wildfire through controlled burns while simultaneously accelerating new growth in its wake. Fire becomes a gardening tool. Alternatively, grow plants saturated with volatile oils and ignite them as botanical incendiaries.',reason:'Fire is a natural component of forest ecology — many species require fire for seed germination. Pyrokinesis provides the flame. Chlorokinesis provides the fuel and the regrowth. The fusion treats fire and plant life as two phases of the same ecological cycle, commanding both simultaneously.'},
  'chloro+cryo':      {name:'Frost Garden',            desc:'Grow ice-crystal plants — botanical structures formed from frozen water that grow, branch, and bloom according to chlorokinetic command. Cryogenic root networks crack foundations through freeze-thaw expansion. Living frost that spreads, adapts, and obeys.',reason:'Ice crystals grow in branching fractal patterns structurally analogous to plant growth — dendrites, branches, and lattice formations. Chlorokinesis provides the growth-command framework. Cryokinesis provides the medium. The fusion applies plant-growth logic to ice formation, producing frost that behaves like a living organism.'},
  'chloro+electro': {name:'Bioelectric Canopy',      desc:'Grow plant networks that generate and store electrical current — living power grids of bio-capacitor vines and conductive root tissue. But the electromagnetic output irradiates the root network that generates it, and the plants must outgrow their own radiation damage to maintain output. The canopy hums with charge and its leaves brown at the edges, new growth racing to replace what the current destroys.',reason:'Chlorokinesis commands biological plant structures. Electrokinesis now carries radiation — ionizing electromagnetic emission that damages biological tissue. The plant network must continuously regenerate against its own electromagnetic output, creating a biological power grid locked in a cycle of growth and radiative decay.'},
  'chloro+tele':      {name:'Green Empathy',           desc:'Communicate telepathically through plant networks — embedding thoughts in the chemical signals of mycorrhizal systems and extracting the raw sensory data plants collect. Know what every root tastes in the soil, what every leaf feels in the wind. The forest thinks, and you think with it.',reason:'Plants communicate through chemical signaling networks spanning entire forests. Telepathy interfaces with information-carrying substrates. The mycorrhizal network is precisely such a substrate — Chlorokinesis activates it, and Telepathy translates its chemical language into cognitive content.'},
  'chloro+speed':     {name:'Vine Rush',               desc:'Accelerate plant growth to match superhuman speed — roots that outpace a sprinting target, thorned tendrils that lash at bullet speed, and seed-to-tree growth cycles compressed into the time it takes to blink. The green world moves at combat velocity.',reason:'Plant growth is limited by cellular division rates and nutrient transport speed. Super Speed accelerates kinetic processes. Chlorokinesis provides the growth directive. The fusion applies superhuman speed to biological growth rates — photosynthesis, cell division, and nutrient uptake all operate at time-compressed velocity.'},
  'chloro+gravity':   {name:'World Tree',              desc:'Grow plant structures of impossible scale by overriding gravitational constraints — trees that reach into the upper atmosphere, root networks that grip bedrock through gravitational anchoring, and branch canopies that form floating platforms held aloft by reduced gravity. Life at continental scale.',reason:'Tree height is limited by gravity — water cannot be pumped above ~130 meters against Earth\'s gravitational pull. Gravity Control removes this constraint. Chlorokinesis provides the growth. The fusion eliminates the gravitational ceiling on plant size, allowing growth to continue until nutrient supply, not physics, becomes the limiting factor.'},
  'chloro+shadow':    {name:'Umbral Bloom',            desc:'Grow plants that thrive in absolute darkness — fungal networks, shadow-adapted vines, and bioluminescent flowers that bloom in the void. The plant network extends through shadow as a medium, sprouting from darkness itself rather than soil.',reason:'Many organisms grow without light — fungi, deep-cave plants, deep-sea chemosynthetic organisms. Shadow Form provides darkness as a habitable medium. Chlorokinesis adapts plant growth to non-photosynthetic metabolisms. The fusion produces plant life that uses shadow itself as a substrate, growing from darkness rather than soil.'},
  'chloro+heal':      {name:'Botanical Medicine',      desc:'Synthesize any pharmaceutical compound through accelerated plant growth — grow targeted medicinal plants in seconds, extract and concentrate their active compounds, and deliver them directly into wounds or through dermal absorption. A living pharmacy that produces any drug on demand.',reason:'The majority of modern pharmaceuticals derive from plant compounds — aspirin from willow bark, morphine from poppies, taxol from yew. Chlorokinesis grows these source plants on demand and concentrates their output. Healing Factor optimizes biological delivery. The fusion creates an on-demand pharmacological synthesis system.'},
  'chloro+earth':     {name:'Primordial Forest',       desc:'Command the deep symbiosis between plant life and earth — roots that mine minerals from deep geological strata, trees that grow through solid rock by directing root pressure along fault lines, and forests that terraform barren stone into fertile soil within hours.',reason:'Plants and geology are already deeply coupled — root systems weather rock into soil, mycorrhizal networks distribute minerals, and forests create their own growing medium over centuries. Earth Mastery accelerates the geological side. Chlorokinesis accelerates the biological side. The fusion compresses millions of years of terraforming into moments.'},
  'chloro+time':    {name:'Ancient Grove',           desc:'Perceive and command the full temporal arc of any ecosystem — growing ancient forests from temporal blueprints or accelerating decay to reclaim structures in minutes. The power shudders between creation and rot, seeds germinating and withering in the same breath, growth and entropy locked in a cycle that makes the air taste like spring rain and grave soil simultaneously.',reason:'Plant life is the slowest rebellion against entropy — photosynthesis converting disorder into structure over millennia. Time perception accelerates both directions of that struggle. The fusion forces botanical growth and thermodynamic decay into direct confrontation, producing ecosystems that exist in accelerated tension between flourishing and collapse.'},
  'portal+pyro':      {name:'Inferno Gate',            desc:'Open portals into the heart of active volcanic systems, stellar surfaces, or any source of extreme heat — channeling magma, plasma, or concentrated thermal energy through wormholes as a weapon. Redirect a target\'s own fire back through a portal behind them.',reason:'Portals create persistent spatial tunnels. Pyrokinesis controls thermal energy. The fusion opens tunnels to heat sources and channels fire through them — any thermal source in the universe becomes a tap-able weapon, and any fire attack can be swallowed by a portal and redirected.'},
  'cryo+portal':      {name:'Void Conduit',            desc:'Open portals into the vacuum of deep space — channeling absolute-zero cold and hard vacuum through a stable wormhole. A portal to the void of space serves as both a cryogenic weapon and an inescapable trap, pulling atmosphere and heat through the gateway.',reason:'Space is the ultimate heat sink — 2.7 Kelvin background radiation temperature and near-perfect vacuum. Portal Creation opens a doorway to it. Cryokinesis prevents the portal user from suffering the cold. The fusion weaponizes the vacuum of space as an accessible cold source and atmospheric drain.'},
  'electro+portal':   {name:'Circuit Bridge',          desc:'Create portals that transmit electrical current as efficiently as superconducting wire — connecting distant power sources, rerouting lightning through wormhole circuits, or channeling a power plant\'s entire output through a handheld portal to create a directed energy weapon.',reason:'Portals transmit matter and energy between points. Electrokinesis controls electrical current. The fusion creates portals optimized for charge transfer — superconducting wormholes that connect any two points in an electrical circuit, enabling energy transmission across arbitrary distances with zero resistance.'},
  'portal+tele':      {name:'Mind Gate',               desc:'Open portals to locations perceived through telepathic contact — see through someone\'s eyes, open a portal to their location, and step through. Alternatively, project telepathic communication through portals to bypass any psychic shielding, since the signal physically traverses the wormhole.',reason:'Portals require destination awareness. Telepathy provides remote sensory information. The fusion uses telepathic contact as portal targeting — the view through a contacted mind provides the spatial data needed to anchor a portal terminus. Any mind becomes a doorway.'},
  'portal+speed':     {name:'Blitz Corridor',          desc:'Open chains of portals and sprint through them at superhuman speed — creating a high-velocity transit network that covers global distances in seconds. Enter a portal at full sprint, exit from another already accelerating, and chain the next without breaking stride.',reason:'Super Speed provides velocity. Portals eliminate distance. The fusion chains portals into continuous corridors — the user maintains top speed through sequential wormholes, covering thousands of miles without deceleration. Speed is preserved through each transit, making global-scale sprinting physically possible.'},
  'gravity+portal':   {name:'Gravitational Corridor',  desc:'Open portals between regions of different gravitational intensity — channeling tidal forces through wormholes, creating portals that accelerate anything passing through them to extreme velocity via gravitational differential, or dumping gravity itself through a wormhole as a weapon.',reason:'Portals connect two spatial points. Gravity varies between those points. The fusion exploits gravitational differential across portal termini — objects entering a portal in low gravity and exiting in high gravity experience sudden acceleration. The wormhole becomes a gravity-driven particle accelerator.'},
  'portal+shadow':    {name:'Void Portal',             desc:'Open portals into pure shadow — gateways that lead to the lightless void between spaces. Anything that enters does not exit from another portal but is held in shadow\'s liminal space indefinitely. A portal that is a prison, a storage dimension, and a garbage disposal.',reason:'Shadow Form accesses a liminal state between presence and absence. Portal Creation opens spatial tunnels. The fusion opens a portal with only one terminus — the other end opens into shadow\'s liminal void, creating a one-way gateway into a dimensionless dark space from which nothing returns without Shadow Form to retrieve it.'},
  'heal+portal':    {name:'Triage Gate',             desc:'Open portals that heal anything passing through them — the wormhole transit serving as a full-body regeneration event. But the portal carries void essence and the healing demands life essence, and the traversal passes through a threshold where both are equally present. For an instant during transit, the body exists in a state that is simultaneously being healed and being unmade, and the passenger feels it — a flash of something that is not pain but is not nothing.',reason:'Portals disassemble matter at one terminus and reassemble at the other, passing through a void-adjacent liminal space. The healing factor demands biological integrity throughout. The void↔life opposition means the transit space actively resists the preservation of life that healing requires — regeneration must outpace dissolution during the fraction of a second the body spends in the threshold between portals.'},
  'earth+portal':     {name:'Seismic Gateway',         desc:'Open portals through solid earth and stone — wormholes that transit through geological mass, connecting underground chambers, mining through mountains instantaneously, or channeling magma and tectonic force from deep mantle sources through a convenient doorway.',reason:'Earth Mastery commands geological formations. Portal Creation opens spatial connections. The fusion anchors portal termini within the earth itself — connecting subsurface locations, channeling geological forces through wormholes, and treating the planet\'s interior as an accessible space rather than an impenetrable barrier.'},
  'portal+time':      {name:'Temporal Gateway',        desc:'Open portals through time — stable, traversable wormholes connecting the present to any point in the past or future. Unlike temporal viewing, objects and people can pass through. The portal persists, creating a permanent bridge between two moments in history.',reason:'Portal Creation opens persistent traversable tunnels through space. Time Perception navigates the temporal dimension. Spacetime is a single manifold. The fusion extends the portal mechanism from spatial connections to temporal connections — a wormhole whose termini exist at different points on the timeline rather than at different points in space.'},
  'intel+pyro':       {name:'Thermal Calculus',        desc:'Model thermodynamic systems with perfect precision — computing exact heat transfer rates, combustion efficiencies, and flame propagation paths before ignition. Fire becomes a solved equation. Every flame behaves exactly as predicted, channeled through mathematical certainty.',reason:'Fire is a complex thermodynamic system governed by fluid dynamics, chemistry, and heat transfer. Super Intelligence models these systems to arbitrary precision. Pyrokinesis provides the thermal interface. The fusion applies perfect computational modeling to fire — every combustion event is predicted, planned, and executed with zero waste.'},
  'cryo+intel':       {name:'Absolute Zero Logic',     desc:'Compute with cryogenic precision — the mind operates with the clarity of a supercooled processor, eliminating thermal noise from thought itself. Simultaneously, apply that precision to cryogenic control — sculpting ice structures of mathematical perfection at the molecular level.',reason:'Superconducting computers require cryogenic temperatures to eliminate thermal noise. Cryokinesis provides the cold. Super Intelligence provides the processing architecture. The fusion applies the superconducting principle to cognition — thought itself becomes cleaner, faster, and more precise in a cryogenically stabilized neural environment.'},
  'electro+intel':    {name:'Living Network',          desc:'Interface with any electronic system through direct neural connection — reading data flows, writing commands, and processing digital information at the speed of thought. Every networked device on Earth becomes an extension of a mind that can process all of them simultaneously.',reason:'Both brains and computers process information through electrical signals. Electrokinesis interfaces with electronic systems. Super Intelligence processes information at superhuman rates. The fusion bridges biological and digital processing — the mind connects to networks as a native node, processing silicon and neural data interchangeably.'},
  'intel+tele':       {name:'Cognitive Architect',     desc:'Read a mind and understand it more deeply than it understands itself — mapping neural architecture, identifying cognitive biases, predicting decisions before the target makes them. Construct perfect arguments tailored to specific psychological profiles. Not mind control — mind understanding.',reason:'Telepathy accesses mental content. Super Intelligence models complex systems. A mind is a complex system. The fusion applies superhuman analytical capability to the raw data of consciousness — mapping not just thoughts but the architecture that produces them, enabling prediction and influence through perfect psychological modeling.'},
  'intel+speed':      {name:'Hypercognition',          desc:'Think at superhuman speed with superhuman depth simultaneously — processing entire libraries of information in seconds, modeling complex systems in real time, and arriving at conclusions that normally require years of research in the time it takes to blink. Genius at the speed of light.',reason:'Super Intelligence provides processing depth — more variables, deeper modeling, better pattern recognition. Super Speed provides processing velocity — faster neural firing, compressed time perception. The fusion multiplies both — deep thought at fast speed produces cognitive output that exceeds any biological or computational system.'},
  'gravity+intel':    {name:'Unified Field Theory',    desc:'Comprehend and manipulate gravity with the precision of complete physical understanding — computing exact gravitational field equations for any configuration of mass, predicting orbital mechanics to arbitrary precision, and applying gravitational force with mathematical perfection.',reason:'Gravity is described by Einstein\'s field equations — enormously complex tensorial mathematics. Super Intelligence solves these equations in real time. Gravity Control provides the physical interface. The fusion applies perfect mathematical understanding to gravitational manipulation, enabling precision impossible through intuitive control alone.'},
  'intel+shadow':   {name:'Dark Pattern',            desc:'Analyze and predict from perfect concealment — but the shadow\'s isolation distorts the intelligence\'s need for informational connection. The mind builds flawless models from incomplete data because the shadow refuses to let it reach outward for more. Deductions become frighteningly accurate and slightly paranoid, pattern recognition running at maximum precision inside a self-imposed informational quarantine.',reason:'Super Intelligence requires informational connection — data inputs, pattern networks, signal access. Shadow form imposes isolation — severance from external systems. The fusion forces superhuman cognition to operate in an information vacuum, producing analysis that is brilliant, self-contained, and subtly warped by the absence of external correction.'},
  'heal+intel':       {name:'Diagnostic Omniscience',  desc:'Understand the body with perfect medical precision — diagnosing any condition from observation alone, computing optimal healing pathways, and directing regeneration with surgical specificity. Healing becomes a science rather than an instinct, targeting disease at the molecular level.',reason:'Healing Factor repairs damage instinctively. Super Intelligence provides diagnostic precision. The fusion transforms autonomous regeneration into directed medical intervention — the mind understands exactly what is wrong and directs the healing process with the precision of a thousand specialists working simultaneously.'},
  'earth+intel':      {name:'Geological Omniscience',  desc:'Read the earth like a book — deducing mineral composition, structural integrity, fault lines, and underground formations from surface observation alone. Model geological processes with perfect accuracy, predicting earthquakes, volcanic events, and mineral deposits with absolute certainty.',reason:'Geological formations contain enormous encoded information — stratigraphy, mineral composition, stress patterns. Earth Mastery senses these formations. Super Intelligence interprets the data with perfect accuracy. The fusion produces total geological awareness — the earth\'s structure and history are fully legible to a mind capable of reading them.'},
  'intel+time':     {name:'Temporal Calculus',       desc:'Model causal chains with such precision that the future becomes computationally deterministic — but the calculation itself is haunted by temporal paradox. The mind perceives past and future as solvable equations, but the past↔future opposition in the temporal substrate means every solution contains its own contradiction. Predictions are devastatingly accurate and faintly recursive, the mind catching glimpses of itself having already made the calculation it is currently making.',reason:'Time Perception provides causal data flowing in two opposed temporal directions simultaneously. Super Intelligence processes both streams. But past↔future is an active opposition — the data from each direction contradicts the data from the other, and the mind must solve equations where the variables are fighting each other for dominance. The result is precognition that works, with a recursive tremor it can never fully resolve.'},
};

function detectFamily(tags){
  const scores={};
  for(const [fam,def] of Object.entries(TAG_FAMILIES)){
    scores[fam]=tags.filter(t=>def.tags.has(t)).length;
  }
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(sorted[0][1]>=2)return sorted[0][0];
  if(sorted[0][1]>=1)return sorted[0][0];
  return'generic';
}

function buildBehaviorClauses(tags,maxClauses=2){
  const sorted=[...new Set(tags)].sort();
  const found=[];
  for(let i=0;i<sorted.length&&found.length<maxClauses+2;i++){
    for(let j=i+1;j<sorted.length&&found.length<maxClauses+2;j++){
      const key=sorted[i]+'+'+sorted[j];
      const clauses=TAG_BEHAVIORS[key];
      if(clauses)found.push(clauses[Math.floor(Math.random()*clauses.length)]);
    }
  }
  if(found.length>maxClauses){found.sort(()=>Math.random()-0.5);found.length=maxClauses;}
  return found;
}

function getClosingLine(gen,family){
  const candidates=CLOSING_LINES.map(fn=>fn(gen,family)).filter(Boolean);
  return candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:'';
}

function buildFullDescription(arcText,tags,gen,family){
  const behaviors=buildBehaviorClauses(tags,gen>=2?3:2);
  const closing=getClosingLine(gen,family);
  let desc=arcText;
  if(behaviors.length)desc+=' '+behaviors.join(' ');
  if(closing)desc+=' '+closing;
  return desc;
}

const GEN_PREFIXES=['','','','Mega','Ultra','Omega','Hyper','Neo','Proto','Arch','Prime','Apex','True'];
const COSMIC_NOUNS=['Horizon','Perihelion','Apogee','Parallax','Redshift','Nebula','Quasar','Pulsar','Corona','Firmament','Ecliptic','Zenith','Solstice','Equinox','Conjunction','Transit','Occultation'];

function getNounPool(family){
  if(COSMIC_EXTRA_NOUNS&&family==='cosmic')return[...NOUNS,...COSMIC_NOUNS];
  return NOUNS;
}

function synthesizeChain(sel){
  const a=sel[0],b=sel[1]||sel[0],allTags=sel.flatMap(p=>p.tags||[]);
  const existingNames=new Set(powers.map(p=>p.name));
  const maxGen=Math.max(...sel.map(p=>p.gen||0));
  const family=detectFamily(allTags);
  const arcPool=FAMILY_ARC[family]||FAMILY_ARC.generic;
  const whyPool=FAMILY_WHY[family]||FAMILY_WHY.generic;
  const nounPool=getNounPool(family);

  for(let attempt=0;attempt<12;attempt++){
    const shuffled=[...allTags].sort(()=>Math.random()-0.5);
    const used=new Set(),parts=[];
    for(const tag of shuffled){
      const pool=NAME_POOL[tag];
      if(pool&&parts.length<2){
        const w=pool[Math.floor(Math.random()*pool.length)];
        if(!used.has(w)){used.add(w);parts.push(w);}
      }
    }
    if(parts.length<2)parts.push(nounPool[Math.floor(Math.random()*nounPool.length)]);
    if(maxGen>=3&&attempt>=4){
      const prefix=GEN_PREFIXES[Math.min(maxGen,GEN_PREFIXES.length-1)];
      if(prefix)parts[0]=prefix+' '+parts[0];
    }
    const name=parts.slice(0,2).join(' ');
    if(!existingNames.has(name)){
      const arcText=arcPool[Math.floor(Math.random()*arcPool.length)](a,b,shuffled);
      return{
        name,
        desc:buildFullDescription(arcText,allTags,maxGen+1,family),
        reason:whyPool[Math.floor(Math.random()*whyPool.length)](a,b)
      };
    }
  }
  const baseParts=[];
  const shuffled=[...allTags].sort(()=>Math.random()-0.5);
  for(const tag of shuffled){
    const pool=NAME_POOL[tag];
    if(pool&&baseParts.length<2){baseParts.push(pool[Math.floor(Math.random()*pool.length)]);}
  }
  if(baseParts.length<2)baseParts.push(nounPool[Math.floor(Math.random()*nounPool.length)]);
  let name=baseParts.slice(0,2).join(' ');
  let suffix=2;
  while(powers.some(p=>p.name===name)){name=baseParts.slice(0,2).join(' ')+' '+toRoman(suffix);suffix++;}
  const arcText=arcPool[Math.floor(Math.random()*arcPool.length)](a,b,shuffled);
  return{
    name,
    desc:buildFullDescription(arcText,allTags,maxGen+1,family),
    reason:whyPool[Math.floor(Math.random()*whyPool.length)](a,b)
  };
}

function computeEP(power){
  let score=0;
  for(const tag of (power.tags||[])){
    const def=TAG_DEFS[tag]||LEGENDARY_TAGS[tag]||MUTANT_TAGS[tag];
    if(!def)continue;
    score+=def.intensity*10;
    if(def.type==='Legendary')score+=20;
    if(def.type==='Mutant')score+=15;
  }
  // Evolved tag bonus
  if(power.evolvedTags){
    score+=power.evolvedTags.length*8;
  }
  // Awakened bonus
  if(power.awakened)score+=12;
  const genBonus=(power.gen||0)*6;
  return Math.min(100,score+genBonus);
}
function epDiamonds(score){
  const filled=score>=85?4:score>=65?3:score>=45?2:score>=25?1:0;
  return'◆'.repeat(filled)+'◇'.repeat(4-filled);
}
function epCeilingPL(power){
  const ep=computeEP(power);
  const legCount=(power.tags||[]).filter(t=>LEGENDARY_TAGS[t]).length;
  return Math.round(Math.max(computePL(power),MAX_PL*(ep/100)*(1+legCount*0.15))/100)*100;
}

// parents is optional — when provided, skips any reaction whose required tags
// are ALL present on a single parent (no emergent cross-power synthesis needed)
function checkReaction(allTags, parents){
  for(const r of REACTIONS){
    if(!r.tags.every(t=>allTags.includes(t)))continue;
    if(parents&&parents.some(p=>r.tags.every(t=>(p.tags||[]).includes(t))))continue;
    return r;
  }
  return null;
}

let _lastTruncatedTags=[];
function computeFusedTags(parents,bonusTags){
  const all=parents.flatMap(p=>p.tags||[]);
  const unique=[...new Set(all)];
  const sorted=unique.sort((a,b)=>{
    const da=LEGENDARY_TAGS[a]?100:(TAG_DEFS[a]?.intensity||1)*10;
    const db=LEGENDARY_TAGS[b]?100:(TAG_DEFS[b]?.intensity||1)*10;
    return db-da;
  });
  const full=[...new Set([...bonusTags,...sorted])];
  const result=full.slice(0,8);
  _lastTruncatedTags=full.length>8?full.slice(8):[];
  return result;
}

function computeFusedStats(parents,bonusTags,resonanceBonus=0){
  const allTags=[...new Set([...parents.flatMap(p=>p.tags||[]),...bonusTags])];
  const affinity={pow:0,rng:0,ctl:0,dur:0,vrs:0};
  for(const tag of allTags){
    const def=TAG_DEFS[tag]||LEGENDARY_TAGS[tag];
    if(def?.stat)affinity[def.stat]=Math.min(affinity[def.stat]+(def.intensity||1),3);
  }
  const legBonus=bonusTags.filter(t=>LEGENDARY_TAGS[t]).length;
  const out={};

  if(fuseMode==='aggressive'){
    // Aggressive: +1 POW, +1 RNG — maximizes offensive output
    STAT_KEYS.forEach(k=>{
      const avg=parents.reduce((s,p)=>s+(p.stats[k]||5),0)/parents.length;
      const affinityBonus=affinity[k]?1:0;
      const modeBonus=(k==='pow'||k==='rng')?1:0;
      out[k]=Math.min(10,Math.round(avg)+affinityBonus+legBonus+modeBonus+resonanceBonus);
    });
  } else if(fuseMode==='precise'){
    // Precise: +1 CTL, +1 VRS — maximizes precision and versatility
    STAT_KEYS.forEach(k=>{
      const avg=parents.reduce((s,p)=>s+(p.stats[k]||5),0)/parents.length;
      const affinityBonus=affinity[k]?1:0;
      const modeBonus=(k==='ctl'||k==='vrs')?1:0;
      out[k]=Math.min(10,Math.round(avg)+affinityBonus+legBonus+modeBonus+resonanceBonus);
    });
  } else {
    // Balanced: +1 DUR, plus raise any stat below the parent floor
    // Computes the average floor and lifts weak stats — prevents dump stats
    const parentAvgs={};
    STAT_KEYS.forEach(k=>{
      parentAvgs[k]=parents.reduce((s,p)=>s+(p.stats[k]||5),0)/parents.length;
    });
    const avgFloor=Math.round(Object.values(parentAvgs).reduce((s,v)=>s+v,0)/5);
    STAT_KEYS.forEach(k=>{
      const avg=parentAvgs[k];
      const affinityBonus=affinity[k]?1:0;
      const durBonus=k==='dur'?1:0;
      const base=Math.round(avg)+affinityBonus+legBonus+durBonus+resonanceBonus;
      // Floor raise: if base would be 2+ below the average, bring it up by 1
      const floorRaise=(base<avgFloor-1)?1:0;
      out[k]=Math.min(10,base+floorRaise);
    });
  }
  // Active archetype bonus: +1 to archetype's stat if fusion tags overlap archetype domain
  if(currentArchetype?.bonusStat){
    const arc=currentArchetype;
    const fusionTags=new Set(allTags);
    const overlap=arc.tags.filter(t=>fusionTags.has(t)).length;
    // Probability Weaver and Paradox Engine apply to all fusions, others need 2+ tag overlap
    if(overlap>=2||arc.id==='probability-weaver'||arc.id==='paradox-engine'){
      out[arc.bonusStat]=Math.min(10,(out[arc.bonusStat]||0)+1);
    }
  }
  return out;
}
